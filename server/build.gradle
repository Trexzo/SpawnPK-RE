tasks.register('pluginKotlinJvmConsumerRegression') {
    group = 'verification'
    description = 'Proves Kotlin/JVM target-11 plugins consume only the standalone plugin API artifact and do not widen the server runtime.'
    dependsOn(
        tasks.named(
            'pluginDeveloperApiArtifactRegression'
        ),
        compileKotlinPluginApiFixture,
        tasks.named('jar')
    )

    doLast {
        File output =
            kotlinPluginFixtureOutput
                .get()
                .asFile

        def classFiles =
            fileTree(output) {
                include '**/*.class'
            }.files

        if(classFiles.empty)
            throw new GradleException(
                'Kotlin plugin API fixture produced no class files.'
            )

        classFiles.each { classFile ->
            int major =
                readClassMajor(
                    classFile
                )

            if(major != 55)
                throw new GradleException(
                    "Kotlin plugin fixture major=" +
                    major +
                    ", expected=55 file=" +
                    classFile
                )
        }

        File fixtureClass =
            new File(
                output,
                'example/spawnpk/fixture/KotlinPluginApiFixture.class'
            )

        if(!fixtureClass.isFile())
            throw new GradleException(
                'KotlinPluginApiFixture.class missing.'
            )

        def runtimeKotlin =
            configurations.runtimeClasspath
                .allDependencies
                .findAll {
                    dependency ->
                        dependency.group ==
                            'org.jetbrains.kotlin' ||
                        dependency.name
                            .toLowerCase(
                                Locale.ROOT
                            )
                            .contains(
                                'kotlin'
                            )
                }

        if(!runtimeKotlin.empty)
            throw new GradleException(
                'Kotlin validation dependency leaked to runtimeClasspath: ' +
                runtimeKotlin
            )

        def implementationKotlin =
            configurations.implementation
                .allDependencies
                .findAll {
                    dependency ->
                        dependency.group ==
                            'org.jetbrains.kotlin' ||
                        dependency.name
                            .toLowerCase(
                                Locale.ROOT
                            )
                            .contains(
                                'kotlin'
                            )
                }

        if(!implementationKotlin.empty)
            throw new GradleException(
                'Kotlin validation dependency leaked to implementation: ' +
                implementationKotlin
            )

        File serverJar =
            tasks.named(
                'jar',
                Jar
            ).get()
                .archiveFile.get()
                .asFile

        boolean scriptingHostPresent = false
        boolean scriptingSdkPresent = false
        boolean kotlinStdlibPresent = false
        boolean scriptingCompilerPresent = false

        new java.util.jar.JarFile(
            serverJar
        ).withCloseable { jar ->
            def enumeration =
                jar.entries()

            while(enumeration.hasMoreElements()) {
                String name =
                    enumeration
                        .nextElement()
                        .getName()

                if(name ==
                        'spk/local/KotlinPluginLoader.class')
                    scriptingHostPresent = true

                if(name ==
                        'spk/plugin/kotlin/KotlinPluginDslKt.class')
                    scriptingSdkPresent = true

                if(name ==
                        'kotlin/Unit.class')
                    kotlinStdlibPresent = true

                if(name ==
                        'org/jetbrains/kotlin/scripting/compiler/plugin/ScriptingCompilerConfigurationComponentRegistrar.class' ||
                   name ==
                        'org/jetbrains/kotlin/cli/jvm/K2JVMCompiler.class')
                    scriptingCompilerPresent = true
            }
        }

        if(!scriptingHostPresent ||
           !scriptingSdkPresent ||
           !kotlinStdlibPresent ||
           !scriptingCompilerPresent)
            throw new GradleException(
                'Kotlin scripting runtime packaging incomplete: host=' +
                scriptingHostPresent +
                ' sdk=' +
                scriptingSdkPresent +
                ' stdlib=' +
                kotlinStdlibPresent +
                ' compiler=' +
                scriptingCompilerPresent
            )

        File apiJar =
            pluginApiJar.get()
                .archiveFile.get()
                .asFile

        File scriptRuntimeJar =
            kotlinScriptRuntimeJar.get()
                .archiveFile.get()
                .asFile

        if(!scriptRuntimeJar.isFile())
            throw new GradleException(
                'Missing Kotlin script runtime artifact: ' +
                scriptRuntimeJar
            )

        boolean scriptStdlibPresent = false
        boolean scriptTemplatePresent = false
        boolean scriptDslPresent = false

        new java.util.jar.JarFile(
            scriptRuntimeJar
        ).withCloseable { jar ->
            def enumeration =
                jar.entries()

            while(enumeration.hasMoreElements()) {
                def entry =
                    enumeration
                        .nextElement()
                String name =
                    entry.getName()

                if(entry.isDirectory())
                    continue

                if(name.startsWith('spk/')) {
                    boolean dsl =
                        name ==
                            'spk/plugin/kotlin/KotlinPluginDslKt.class' ||
                        name.startsWith(
                            'spk/plugin/kotlin/KotlinPluginDslKt$'
                        )

                    if(!dsl)
                        throw new GradleException(
                            'Kotlin script runtime artifact contains non-DSL SpawnPK class: ' +
                            name
                        )

                    if(name ==
                            'spk/plugin/kotlin/KotlinPluginDslKt.class')
                        scriptDslPresent = true
                }

                if(name ==
                        'kotlin/Unit.class')
                    scriptStdlibPresent = true

                if(name ==
                        'kotlin/script/templates/standard/SimpleScriptTemplate.class')
                    scriptTemplatePresent = true
            }
        }

        if(!scriptStdlibPresent ||
           !scriptTemplatePresent ||
           !scriptDslPresent)
            throw new GradleException(
                'Kotlin script runtime artifact incomplete: stdlib=' +
                scriptStdlibPresent +
                ' template=' +
                scriptTemplatePresent +
                ' dsl=' +
                scriptDslPresent
            )

        def fixtureClasspath =
            files(
                apiJar,
                kotlinFixtureStdlib
            ).files

        if(fixtureClasspath.any {
                it.name ==
                    'SpawnPKLocalServer.jar'
            })
            throw new GradleException(
                'Kotlin fixture compile classpath contains server JAR.'
            )

        logger.lifecycle(
            'PLUGIN_KOTLIN_JVM_CONSUMER_PASS ' +
            'kotlin=2.4.20 ' +
            'apiArtifactOnly=true ' +
            'jvmTarget=11 ' +
            'jdkRelease=11 ' +
            'bytecodeMajor=55 ' +
            'serverRuntimeScriptingOnly=true ' +
            'serverJarKotlinScripting=true ' +
            'scriptRuntimeArtifact=SpawnPKKotlinScriptRuntime.jar ' +
            'scriptRuntimeSdkOnly=true ' +
            'scriptingRuntimeIntegrated=true'
        )
    }
}


