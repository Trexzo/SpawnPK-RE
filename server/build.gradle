tasks.register('pluginDeveloperApiArtifactRegression') {
    group = 'verification'
    description = 'Locks the standalone allowlisted plugin API JAR and Java/JVM consumer boundary.'
    dependsOn(
        pluginApiJar,
        compileJavaPluginApiFixture,
        tasks.named('testClasses')
    )

    doLast {
        File apiJar =
            pluginApiJar.get()
                .archiveFile.get()
                .asFile

        if(!apiJar.isFile())
            throw new GradleException(
                "Missing plugin API artifact: " +
                apiJar
            )

        Set<String> entries =
            new TreeSet<>()

        new java.util.jar.JarFile(apiJar)
            .withCloseable { jar ->
                def enumeration =
                    jar.entries()

                while(enumeration.hasMoreElements()) {
                    def entry =
                        enumeration.nextElement()

                    if(!entry.isDirectory())
                        entries.add(
                            entry.getName()
                        )
                }
            }

        if(entries.any {
                it.startsWith('spk/local/')
            })
            throw new GradleException(
                'Plugin API artifact contains spk/local classes.'
            )

        Set<String> allowedClassEntries =
            new TreeSet<String>(
                pluginApiClassPatterns
            )

        Set<String> actualClassEntries =
            new TreeSet<String>(
                entries.findAll {
                    it.endsWith('.class')
                }
            )

        Set<String> unexpected =
            new TreeSet<String>(
                actualClassEntries
            )
        unexpected.removeAll(
            allowedClassEntries
        )

        if(!unexpected.isEmpty())
            throw new GradleException(
                'Unexpected plugin API artifact classes: ' +
                unexpected
            )

        pluginApiTopLevelClasses.each { binaryName ->
            String entry =
                binaryName.replace('.', '/') +
                '.class'

            if(!actualClassEntries.contains(entry))
                throw new GradleException(
                    'Missing API class from artifact: ' +
                    binaryName
                )
        }

        for(String eventEntry : [
                'spk/event/DomainEventBus.class',
                'spk/event/DomainEventBus$Event.class',
                'spk/event/DomainEventBus$Cancellable.class',
                'spk/event/DomainEventBus$Priority.class',
                'spk/event/DomainEventBus$Listener.class',
                'spk/event/DomainEventBus$Subscription.class'
        ])
            if(!actualClassEntries.contains(eventEntry))
                throw new GradleException(
                    'Missing event API class from artifact: ' +
                    eventEntry
                )

        def apiClassFiles =
            zipTree(apiJar)
                .matching {
                    include '**/*.class'
                }
                .files

        if(apiClassFiles.empty)
            throw new GradleException(
                'Plugin API artifact contains no classes.'
            )

        apiClassFiles.each { classFile ->
            int major =
                readClassMajor(
                    classFile
                )

            if(major != 55)
                throw new GradleException(
                    "Plugin API bytecode compatibility failure: " +
                    classFile +
                    " major=" +
                    major +
                    ", expected=55"
                )
        }

        File javaFixture =
            new File(
                layout.buildDirectory
                    .get()
                    .asFile,
                'plugin-fixtures/java-classes/example/spawnpk/fixture/JavaPluginApiFixture.class'
            )

        if(!javaFixture.isFile())
            throw new GradleException(
                'Java plugin API fixture did not compile.'
            )

        int fixtureMajor =
            readClassMajor(
                javaFixture
            )

        if(fixtureMajor != 55)
            throw new GradleException(
                "Java plugin fixture major=" +
                fixtureMajor +
                ", expected=55"
            )

        logger.lifecycle(
            'PLUGIN_DEVELOPER_API_ARTIFACT_PASS ' +
            'artifact=SpawnPKPluginApi.jar ' +
            'allowlistedClasses=' +
            actualClassEntries.size() +
            ' spkLocalLeak=false ' +
            'javaConsumer=true ' +
            'javaConsumerServerJar=false ' +
            'bytecodeMajor=55 ' +
            'kotlinConsumerDeferred=true ' +
            'classloaderIsolationDeferred=true'
        )
    }
}

def sha256 = { File f ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { input ->
        byte[] buf = new byte[8192]
        int n
        while ((n = input.read(buf)) > 0) {
            digest.update(buf, 0, n)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def findPinnedClient = {
    def candidates = [
        new File(repoRoot, 'evidence/client(6).jar'),
        new File(repoRoot, 'evidence/client(4).jar'),
        new File(repoRoot, 'evidence/client.jar'),
        new File(repoRoot, 'client.jar')
    ]

    candidates.find { f ->
        f.isFile() && sha256(f).equalsIgnoreCase(pinnedClientSha256)
    }
}

