def kotlinScriptSdkOutput =
    layout.buildDirectory.dir(
        'classes/kotlin-script-sdk/main'
    )

def compileKotlinScriptSdk =
    tasks.register(
        'compileKotlinScriptSdk',
        JavaExec
    ) {
        group = 'build'
        description = 'Compiles Kotlin script DSL helpers against the standalone plugin API and script-visible Kotlin runtime only.'
        dependsOn pluginApiJar

        classpath = kotlinFixtureCompiler
        mainClass =
            'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler'
        javaLauncher =
            javaToolchains.launcherFor {
                languageVersion =
                    JavaLanguageVersion.of(21)
            }

        def kotlinSources =
            fileTree(
                'kotlin-sdk'
            ) {
                include '**/*.kt'
            }

        inputs.files(kotlinSources)
        inputs.files(kotlinScriptPluginClasspath)
        outputs.dir(kotlinScriptSdkOutput)

        doFirst {
            File output =
                kotlinScriptSdkOutput
                    .get()
                    .asFile

            project.delete(output)

            if(!output.mkdirs()&&
               !output.isDirectory())
                throw new GradleException(
                    'Could not create Kotlin script SDK output: ' +
                    output
                )

            File apiJar =
                pluginApiJar.get()
                    .archiveFile.get()
                    .asFile

            def sources =
                kotlinSources.files
                    .sort {
                        left,
                        right ->
                            left.absolutePath <=>
                            right.absolutePath
                    }

            if(sources.empty)
                throw new GradleException(
                    'No Kotlin script SDK sources found.'
                )

            String compileClasspath =
                files(
                    apiJar,
                    kotlinScriptPluginClasspath
                ).asPath

            setArgs(
                [
                    '-jvm-target',
                    '11',
                    '-Xjdk-release=11',
                    '-no-reflect',
                    '-no-stdlib',
                    '-classpath',
                    compileClasspath,
                    '-d',
                    output.absolutePath
                ] +
                sources.collect {
                    it.absolutePath
                }
            )
        }
    }

tasks.register('verifyKotlinScriptSdkBytecode') {
    group = 'verification'
    description = 'Verifies Kotlin script SDK classes remain Java 11 bytecode compatible.'
    dependsOn compileKotlinScriptSdk

    doLast {
        def classFiles =
            fileTree(
                kotlinScriptSdkOutput
                    .get()
                    .asFile
            ) {
                include '**/*.class'
            }.files

        if(classFiles.empty)
            throw new GradleException(
                'Kotlin script SDK produced no class files.'
            )

        classFiles.each { classFile ->
            int major =
                readClassMajor(
                    classFile
                )

            if(major != 55)
                throw new GradleException(
                    'Kotlin script SDK bytecode major=' +
                    major +
                    ', expected=55 file=' +
                    classFile
                )
        }

        logger.lifecycle(
            'KOTLIN_SCRIPT_SDK_BYTECODE_PASS major=55 classes=' +
            classFiles.size()
        )
    }
}


