    manifest {
        attributes('Main-Class': 'spk.local.Main')
    }

    // Keep the server artifact dependency-complete when JVM dependencies are
    // introduced later. At R8.5 runtimeClasspath is intentionally empty.
    from {
        configurations.runtimeClasspath.collect { f ->
            f.isDirectory() ? f : zipTree(f)
        }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

def readClassMajor = { File classFile ->
    classFile.withInputStream { input ->
        DataInputStream data = new DataInputStream(input)
        int magic = data.readInt()
        if (magic != (0xCAFEBABE as int)) {
            throw new GradleException("Not a class file: ${classFile}")
        }
        data.readUnsignedShort() // minor
        data.readUnsignedShort()
    }
}

tasks.register('verifyJava11Bytecode') {
    group = 'verification'
    description = 'Verifies all compiled LocalLab classes use Java 11 class major version 55.'
    dependsOn tasks.named('classes'), tasks.named('testClasses')

    doLast {
        def classFiles = files(
            fileTree(new File(layout.buildDirectory.get().asFile, 'classes/java/main')) { include '**/*.class' },
            fileTree(new File(layout.buildDirectory.get().asFile, 'classes/java/test')) { include '**/*.class' }
        ).files

        if (classFiles.empty) {
            throw new GradleException('No compiled class files were produced.')
        }

        classFiles.each { f ->
            int major = readClassMajor(f)
            if (major != 55) {
                throw new GradleException("Java bytecode compatibility failure: ${f} major=${major}, expected=55")
            }
        }

        logger.lifecycle("LOCALLAB_BYTECODE_MAJOR_PASS major=55 classes=${classFiles.size()}")
    }
}

