           copyIndex <= writerOpenIndex ||
           privateOpenIndex <= copyIndex ||
           privateHashIndex <= privateOpenIndex ||
           sourceReleaseIndex <= privateHashIndex)
            throw new GradleException(
                'Wrapper exact-v308 client admission ordering drifted: expected guarded source open -> source hash -> private writer open/copy -> private guard open -> private hash -> source release.'
            )

        if(text.contains('"-Pv308ClientPath=$client"'))
            throw new GradleException(
                'Wrapper must never pass the mutable external client path into Gradle.'
            )

        if(cleanIndex < 0 ||
           gateIndex <= cleanIndex ||
           clientIndex <= gateIndex)
            throw new GradleException(
                'Wrapper Gradle invocation ordering drifted: expected clean -> cumulative gate -> invocation-owned exact client snapshot.'
            )

        int privateReleaseIndex =
            text.lastIndexOf(
                '$privateGuard.Dispose()'
            )
        int snapshotCleanupIndex =
            text.lastIndexOf(
                'Remove-CertificationSnapshotSafely -SnapshotRoot $snapshotRoot -SnapshotClient $snapshotClient'
            )

        if(gradleOutputInitIndex < 0 ||
           logGuardIndex <= gradleOutputInitIndex ||
           logWriterIndex <= logGuardIndex ||
           invokeIndex <= logWriterIndex ||
           gradleOutputAddIndex <= invokeIndex ||
           logLineWriteIndex <= gradleOutputAddIndex ||
           exitCaptureIndex <= logLineWriteIndex ||
           exitSuccessCheckIndex <= exitCaptureIndex ||
           markerObservationIndex <= exitSuccessCheckIndex ||
           markerServerShaParseIndex <= markerObservationIndex ||
           logHashIndex <= markerServerShaParseIndex ||
           logGuardReleaseIndex <= logHashIndex ||
           privateReleaseIndex <= logGuardReleaseIndex ||
           snapshotCleanupIndex <= privateReleaseIndex ||
           jsonIndex <= snapshotCleanupIndex ||
           evidenceGuardIndex <= jsonIndex ||
           evidenceWriterIndex <= evidenceGuardIndex ||
           evidenceWriteIndex <= evidenceWriterIndex ||
           evidenceFlushIndex <= evidenceWriteIndex ||
           evidenceHashIndex <= evidenceFlushIndex ||
           evidenceGuardReleaseIndex <= evidenceHashIndex ||
           completionObjectIndex <= evidenceGuardReleaseIndex ||
           completionIndex <= completionObjectIndex ||
           structuredResultIndex <= completionIndex)
            throw new GradleException(
                'Wrapper evidence ordering drifted: expected invocation-owned output/log guards -> Gradle invoke -> in-memory output/log write -> native exit capture -> zero-exit check -> in-memory marker/server SHA -> same-stream log hash -> log guard release -> private guard release -> private-root cleanup -> guarded JSON evidence -> completion/result.'
            )

        logger.lifecycle(
            'CHAT1_CUMULATIVE_WRAPPER_CONTRACT_PASS ' +
            'exactV308HashPinned=true ' +
            'invocationOwnedClient=true ' +
            'sourceReadGuard=true ' +
            'privateReadGuard=true ' +
            'canonicalGate=true ' +
            'cleanHeadBound=true ' +
            'durableEvidence=true ' +
            'durableEvidenceIdentityGuarded=true ' +
            'gradleOutputAuthorityInvocationOwned=true ' +
            'durableLogIdentityGuarded=true ' +
            'certifiedServerShaBound=true ' +
            'inMemoryReleaseHandoff=true ' +
            'hostedPromotionSatisfied=false ' +
            'authoritativeMarkerObservedOnly=true'
        )
    }
}

