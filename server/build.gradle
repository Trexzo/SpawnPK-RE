tasks.register('chat1CumulativeWrapperContractRegression') {
    group = 'verification'
    description = 'Locks the canonical exact-v308 cumulative-certification wrapper and local evidence boundary without requiring proprietary client bytes.'

    doLast {
        File wrapper =
            new File(
                repoRoot,
                'scripts/Run-Chat1CumulativeCertification.ps1'
            )
        File gitignore =
            new File(
                repoRoot,
                '.gitignore'
            )
        File currentRelease =
            new File(
                repoRoot,
                'RUN_CURRENT_RELEASE_ACCEPTANCE.ps1'
            )

        if(!wrapper.isFile())
            throw new GradleException(
                "Missing Chat 1 cumulative certification wrapper: ${wrapper}"
            )
        if(!gitignore.isFile())
            throw new GradleException(
                "Missing repository ignore policy: ${gitignore}"
            )
        if(!currentRelease.isFile())
            throw new GradleException(
                "Missing current release acceptance entry point: ${currentRelease}"
            )

        String text =
            wrapper.getText('UTF-8')
        String ignoreText =
            gitignore.getText('UTF-8')
        String currentReleaseText =
            currentRelease.getText('UTF-8')

        [
            'Select-LocalLabBuildJava.ps1',
            'Get-Sha256Hex',
            'Get-FileHash',
            '[IO.File]::Open(',
            '[IO.FileMode]::CreateNew',
            '[IO.FileShare]::Read',
            '[IO.FileShare]::None',
            '$sourceGuard',
            '$snapshotRoot',
            '$snapshotClient',
            '$privateGuard',
            '$sourceGuard.CopyTo($snapshotWriter)',
            '$privateClientSha',
            'EvidenceFileName',
            '$markerMatches = @(',
            'serverSha256=([0-9a-f]{64})',
            'certifiedServerJarSha256 = $certifiedServerSha',
            'serverSha256=$certifiedServerSha',
            'invocationOwnedClient = $true',
            'invocationOwnedClient=true',
            'function Assert-OrdinaryFile',
            'function Remove-EmptyCertificationSnapshotRootSafely',
            'function Remove-CertificationSnapshotSafely',
            'function Remove-CertificationEvidenceLeafSafely',
            '$snapshotClientOwned = $true',
            '$evidenceOwned = $true',
            '$publishCleanupFailures = @()',
            'evidence writer dispose:',
            'evidence guard dispose:',
            'evidence leaf cleanup:',
            'Remove-CertificationSnapshotSafely -SnapshotRoot $snapshotRoot -SnapshotClient $snapshotClient',
            'Remove-CertificationEvidenceLeafSafely -Path $evidence',
            'Remove-Item -LiteralPath $SnapshotClient -Force -ErrorAction Stop',
            'Remove-Item -LiteralPath $SnapshotRoot -Force -ErrorAction Stop',
            v308AcceptanceClientSha256,
            'chat1CurrentCumulativeCertification',
            '-Pv308ClientPath=',
            '--no-daemon',
            '--console=plain',
            '$evidenceRoot = Join-Path $runtimeRoot \'certification\'',
            '$runtimeRoot = Join-Path $repo \'runtime\'',
            'function Assert-OrdinaryDirectory',
            'Get-Item -LiteralPath $Path -Force -ErrorAction Stop',
            '$item.PSIsContainer',
            'function Initialize-CertificationEvidenceRoot',
            '[IO.FileAttributes]::ReparsePoint',
            'Assert-OrdinaryDirectory -Path $runtimeRoot',
            'Assert-OrdinaryDirectory -Path $evidenceRoot',
            'Assert-OrdinaryDirectory -Path $snapshotRoot',
            "Assert-OrdinaryDirectory -Path \$runtimeRoot -Label 'Certification runtime root before client snapshot copy'",
            "Assert-OrdinaryDirectory -Path \$evidenceRoot -Label 'Certification evidence root before client snapshot copy'",
            "Assert-OrdinaryDirectory -Path \$snapshotRoot -Label 'Certification client snapshot root before client snapshot copy'",
            "Assert-OrdinaryDirectory -Path \$runtimeRoot -Label 'Certification runtime root before log write'",
            "Assert-OrdinaryDirectory -Path \$evidenceRoot -Label 'Certification evidence root before log write'",
            "Assert-OrdinaryDirectory -Path \$runtimeRoot -Label 'Certification runtime root before JSON evidence write'",
            "Assert-OrdinaryDirectory -Path \$evidenceRoot -Label 'Certification evidence root before JSON evidence write'",
            'Initialize-CertificationEvidenceRoot',
            'git -C $repo rev-parse HEAD',
            'git -C $repo status --porcelain --untracked-files=normal',
            "New-Object 'System.Collections.Generic.List[string]'",
            '$gradleOutput.Add($line)',
            '$logGuard',
            '$logWriter',
            '$logWriter.WriteLine($line)',
            '$logGuard.Flush($true)',
            'Write-Host $line',
            'Get-FileHash -InputStream $logGuard -Algorithm SHA256',
            '$authoritativeMarker = \'SPAWNPK_CHAT1_CURRENT_CUMULATIVE_CERTIFICATION_PASS\'',
            '$gradleOutput |',
            '$gradleExit = $LASTEXITCODE',
            "\$ErrorActionPreference = 'Continue'",
            'spawnpk-chat1-local-certification-evidence-v1',
            'hostedPromotionSatisfied = $false',
            'hostedEvidenceSeparate = $true',
            '$evidenceGuard',
            '$evidenceWriter',
            '[IO.FileAccess]::ReadWrite',
            '[IO.StreamWriter]::new(',
            '$evidenceWriter.WriteLine($json)',
            '$evidenceGuard.Flush($true)',
            'Get-FileHash -InputStream $evidenceGuard -Algorithm SHA256',
            'Cumulative certification evidence publication failed and cleanup was unsafe/incomplete.',
            'spawnpk-chat1-cumulative-result-v1',
            'evidenceSha256 = $evidenceSha',
            'Write-Output $completion',
            'SPAWNPK_CHAT1_CURRENT_CUMULATIVE_CERTIFICATION_PASS',
            'CHAT1_CUMULATIVE_WRAPPER_COMPLETE',
            'hostedPromotionSatisfied=false',
            'exactV308=true'
        ].each { required ->
            if(!text.contains(required))
                throw new GradleException(
                    "Chat 1 cumulative wrapper contract missing: ${required}"
                )
        }

        [
            '[IO.File]::Open(': 5,
            '[IO.FileShare]::Read': 4,
            '[IO.FileShare]::None': 1,
            '[IO.FileMode]::CreateNew': 3,
            '[IO.FileAccess]::ReadWrite': 2,
            '[IO.StreamWriter]::new(': 2
        ].each { anchor, expectedCount ->
            int count = 0
            int from = 0
            while(true) {
                int found =
                    text.indexOf(
                        anchor,
                        from
                    )
                if(found < 0)
                    break
                count++
                from = found + anchor.length()
            }
            if(count != expectedCount)
                throw new GradleException(
                    "Chat 1 cumulative client-snapshot guard count drift: expected=${expectedCount} actual=${count} anchor=${anchor}"
                )
        }

        if(text.contains("hostedPromotionBlocker = '#816'"))
            throw new GradleException(
                'Local cumulative evidence must not name resolved infrastructure issue #816 as a current promotion blocker.'
            )

        [
            'Set-Content -LiteralPath $evidence',
            'Get-FileHash -LiteralPath $evidence -Algorithm SHA256',
            'Tee-Object -FilePath $log',
            'Select-String -LiteralPath $log',
            'Get-FileHash -LiteralPath $log',
            'Get-Item -LiteralPath $log',
            'New-Item -ItemType Directory -Force -Path $evidenceRoot',
            'Test-Path -LiteralPath $Path -PathType Container',
            'Remove-Item -LiteralPath $snapshotRoot -Recurse -Force',
            'Remove-Item -LiteralPath $evidence -Force -ErrorAction SilentlyContinue'
        ].each { staleMutableAuthority ->
            if(text.contains(staleMutableAuthority))
                throw new GradleException(
                    "Cumulative wrapper must not reacquire authority from a mutable path: ${staleMutableAuthority}"
                )
        }

        String authoritativeMarker =
            'SPAWNPK_CHAT1_CURRENT_CUMULATIVE_CERTIFICATION_PASS'
        List<String> authoritativeMarkerLines =
            text.readLines().findAll {
                it.contains(
                    authoritativeMarker
                )
            }

        if(authoritativeMarkerLines.size() != 1 ||
           !authoritativeMarkerLines[0].contains(
                "\$authoritativeMarker = '${authoritativeMarker}'"
            ))
            throw new GradleException(
                'Wrapper must define the exact Gradle-owned cumulative PASS marker exactly once for invocation-output matching.'
            )

        if(authoritativeMarkerLines[0] =~
                /(?i)\b(Write-Host|Write-Output|echo|return)\b/)
            throw new GradleException(
                'Wrapper must not emit the authoritative cumulative PASS marker.'
            )

        [
            'Write-Host $markerMatch',
            'Write-Output $markerMatch',
            'echo $markerMatch',
            'return $markerMatch'
        ].each { forbiddenOutput ->
            if(text.contains(forbiddenOutput))
                throw new GradleException(
                    "Wrapper must not emit observed Gradle marker data: ${forbiddenOutput}"
                )
        }

        [
            'function Get-ExactGitHead',
            '& $gradlew @gradleArgs',
            '$authoritativeMarker = \'SPAWNPK_CHAT1_CURRENT_CUMULATIVE_CERTIFICATION_PASS\'',
            'New-Object \'System.Collections.Generic.List[string]\'',
