            )
        int logGuardIndex =
            text.indexOf(
                '$logGuard =',
                gradleOutputInitIndex
            )
        int logWriterIndex =
            text.indexOf(
                '[IO.StreamWriter]::new(',
                logGuardIndex
            )
        int gradleOutputAddIndex =
            text.indexOf(
                '[void]$gradleOutput.Add($line)',
                invokeIndex
            )
        int logLineWriteIndex =
            text.indexOf(
                '$logWriter.WriteLine($line)',
                gradleOutputAddIndex
            )
        int markerObservationIndex =
            text.indexOf(
                '$gradleOutput |',
                exitSuccessCheckIndex
            )
        int logHashIndex =
            text.indexOf(
                'Get-FileHash -InputStream $logGuard -Algorithm SHA256',
                markerObservationIndex
            )
        int logGuardReleaseIndex =
            text.indexOf(
                '$logGuard.Dispose()',
                logHashIndex
            )
        int jsonIndex =
            text.indexOf(
                'ConvertTo-Json'
            )
        int evidenceGuardIndex =
            text.indexOf(
                '$evidenceGuard =',
                jsonIndex
            )
        int evidenceWriterIndex =
            text.indexOf(
                '[IO.StreamWriter]::new(',
                evidenceGuardIndex
            )
        int evidenceWriteIndex =
            text.indexOf(
                '$evidenceWriter.WriteLine($json)',
                evidenceWriterIndex
            )
        int evidenceFlushIndex =
            text.indexOf(
                '$evidenceGuard.Flush($true)',
                evidenceWriteIndex
            )
        int evidenceHashIndex =
            text.indexOf(
                'Get-FileHash -InputStream $evidenceGuard -Algorithm SHA256',
                evidenceFlushIndex
            )
        int evidenceGuardReleaseIndex =
            text.lastIndexOf(
                '$evidenceGuard.Dispose()'
            )
        int completionObjectIndex =
            text.indexOf(
                '$completion = [pscustomobject]@{'
            )
        int completionIndex =
            text.indexOf(
                'CHAT1_CUMULATIVE_WRAPPER_COMPLETE'
            )
        int structuredResultIndex =
            text.indexOf(
                'Write-Output $completion'
            )

        if(sourceOpenIndex < 0 ||
           sourceHashIndex <= sourceOpenIndex ||
