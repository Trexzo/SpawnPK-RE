                    "Current release acceptance still uses stale inherited-only path: ${forbidden}"
                )
        }

        int currentBuildIndex =
            currentReleaseText.indexOf(
                '& $gradle clean build'
            )
        int currentLoopbackIndex =
            currentReleaseText.lastIndexOf(
                'Invoke-CurrentServerLoopbackSmoke'
