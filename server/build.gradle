            )

        if(snapshotWriterOwnedIndex <= snapshotWriterIndex ||
           snapshotOwnedCleanupBranchIndex <= snapshotWriterOwnedIndex ||
           snapshotUnownedEmptyCleanupIndex <= snapshotOwnedCleanupBranchIndex)
            throw new GradleException(
                'Snapshot destructive cleanup must be gated by successful CreateNew ownership; unowned-client failure may remove only a proven-empty invocation root.'
            )

        int failedEvidenceCleanupFunctionIndex =
            text.indexOf(
                'function Remove-CertificationEvidenceLeafSafely'
            )
        int failedEvidenceParentCheckIndex =
            text.indexOf(
                "Certification runtime root before failed-evidence cleanup",
                failedEvidenceCleanupFunctionIndex
            )
        int failedEvidenceLeafCheckIndex =
            text.indexOf(
                "Assert-OrdinaryFile -Path \$Path -Label 'Failed certification evidence cleanup leaf'",
                failedEvidenceParentCheckIndex
            )
        int failedEvidenceRemoveIndex =
            text.indexOf(
                'Remove-Item -LiteralPath $Path -Force -ErrorAction Stop',
                failedEvidenceLeafCheckIndex
            )
        int evidenceOwnedIndex =
            text.indexOf(
                '$evidenceOwned = $true',
                evidenceOpenIndex
            )
        int publishOwnedCleanupBranchIndex =
            text.indexOf(
                'if ($evidenceOwned)'
            )
        int publishCleanupInvokeIndex =
            text.indexOf(
                'Remove-CertificationEvidenceLeafSafely -Path $evidence',
                publishOwnedCleanupBranchIndex
            )
        int publishCleanupAccumulatorIndex =
            text.indexOf(
                '$publishCleanupFailures = @()'
            )
        int publishWriterCleanupIndex =
            text.indexOf(
                'evidence writer dispose:',
                publishCleanupAccumulatorIndex
            )
        int publishGuardCleanupIndex =
            text.indexOf(
                'evidence guard dispose:',
                publishWriterCleanupIndex
            )
        int publishLeafCleanupEvidenceIndex =
            text.indexOf(
                'evidence leaf cleanup:',
                publishGuardCleanupIndex
            )
        int publishCleanupCompositeIndex =
            text.indexOf(
                'Cumulative certification evidence publication failed and cleanup was unsafe/incomplete.',
                publishCleanupInvokeIndex
            )

        if(failedEvidenceCleanupFunctionIndex < 0 ||
           failedEvidenceParentCheckIndex <= failedEvidenceCleanupFunctionIndex ||
           failedEvidenceLeafCheckIndex <= failedEvidenceParentCheckIndex ||
           failedEvidenceRemoveIndex <= failedEvidenceLeafCheckIndex ||
           evidenceOwnedIndex <= evidenceOpenIndex ||
           publishCleanupAccumulatorIndex < 0 ||
           publishWriterCleanupIndex <= publishCleanupAccumulatorIndex ||
           publishGuardCleanupIndex <= publishWriterCleanupIndex ||
           publishOwnedCleanupBranchIndex <= evidenceOwnedIndex ||
           publishCleanupInvokeIndex <= publishOwnedCleanupBranchIndex ||
           publishLeafCleanupEvidenceIndex <= publishGuardCleanupIndex ||
           publishCleanupCompositeIndex <= publishCleanupInvokeIndex)
            throw new GradleException(
                'Failed JSON evidence cleanup must preserve the primary publication failure through writer/guard disposal, require successful CreateNew ownership, revalidate ancestry/leaf identity, and compose cleanup failures.'
            )

        if(!ignoreText.readLines().any {
                it.trim() == 'runtime/certification/'
            })
            throw new GradleException(
                'Local cumulative certification evidence directory is not ignored.'
            )

        [
            'scripts\\Run-Chat1CumulativeCertification.ps1',
            '& $cumulativeWrapper -ClientJar $client -EvidenceFileName $cumulativeEvidenceName',
            'Tee-Object -Variable cumulativeOutput',
            'spawnpk-chat1-cumulative-result-v1',
            '$certifiedServerSha = [string]$cumulativeResult.certifiedServerJarSha256',
            '$expectedEvidenceSha = [string]$cumulativeResult.evidenceSha256',
            'Get-FileHash -InputStream $cumulativeEvidenceGuard -Algorithm SHA256',
            '$cumulativeEvidence.certifiedServerJarSha256 -ne $certifiedServerSha',
            '-ExpectedServerSha256 $certifiedServerSha',
            'CURRENT_RELEASE_CUMULATIVE_CERTIFICATION_PASS',
            'hostedPromotionSatisfied=false'
        ].each { required ->
            if(!currentReleaseText.contains(required))
                throw new GradleException(
                    "Current release acceptance contract missing: ${required}"
                )
        }

        [
            '& $gradle r85V308Acceptance',
