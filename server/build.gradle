                '& $cumulativeWrapper -ClientJar $client'
            )
        int currentResultIndex =
            currentReleaseText.indexOf(
                '$cumulativeResult = $cumulativeResults[0]'
            )
        int currentServerShaIndex =
            currentReleaseText.indexOf(
                '$certifiedServerSha = [string]$cumulativeResult.certifiedServerJarSha256'
            )
        int currentEvidenceHashIndex =
            currentReleaseText.indexOf(
                'Get-FileHash -InputStream $cumulativeEvidenceGuard -Algorithm SHA256'
            )
        int currentEvidenceServerMatchIndex =
            currentReleaseText.indexOf(
                '$cumulativeEvidence.certifiedServerJarSha256 -ne $certifiedServerSha'
            )

        if(currentBuildIndex < 0 ||
           currentCumulativeIndex <= currentBuildIndex ||
           currentResultIndex <= currentCumulativeIndex ||
           currentServerShaIndex <= currentResultIndex ||
           currentEvidenceHashIndex <= currentServerShaIndex ||
           currentEvidenceServerMatchIndex <= currentEvidenceHashIndex ||
           currentLoopbackIndex <= currentEvidenceServerMatchIndex)
            throw new GradleException(
                'Current release acceptance ordering drifted: expected clean build -> canonical cumulative wrapper -> in-memory result/server SHA -> guarded evidence hash/cross-check -> loopback smoke.'
            )

        int currentCumulativeCount = 0
        int currentCumulativeFrom = 0
        String currentCumulativeAnchor =
            '& $cumulativeWrapper -ClientJar $client'
        while(true) {
            int found =
                currentReleaseText.indexOf(
                    currentCumulativeAnchor,
                    currentCumulativeFrom
                )
            if(found < 0)
                break
            currentCumulativeCount++
            currentCumulativeFrom =
                found + currentCumulativeAnchor.length()
        }
        if(currentCumulativeCount != 1)
            throw new GradleException(
                "Current release acceptance cumulative-wrapper invocation count drift: expected=1 actual=${currentCumulativeCount}"
            )

        int cleanIndex =
            text.indexOf(
                "'clean'"
            )
        int gateIndex =
            text.indexOf(
                "'chat1CurrentCumulativeCertification'"
            )
        int sourceOpenIndex =
            text.indexOf(
                '[IO.File]::Open('
            )
        int writerOpenIndex =
            text.indexOf(
                '[IO.File]::Open(',
                sourceOpenIndex + 1
            )
        int privateOpenIndex =
            text.indexOf(
                '[IO.File]::Open(',
                writerOpenIndex + 1
            )
        int sourceHashIndex =
            text.indexOf(
                '$actualClientSha = Get-Sha256Hex -Stream $sourceGuard'
            )
        int copyIndex =
            text.indexOf(
                '$sourceGuard.CopyTo($snapshotWriter)'
            )
        int privateHashIndex =
            text.indexOf(
                '$privateClientSha = Get-Sha256Hex -Stream $privateGuard'
            )
        int markerServerShaParseIndex =
            text.indexOf(
                'serverSha256=([0-9a-f]{64})'
            )
        int sourceReleaseIndex =
            text.indexOf(
                '$sourceGuard.Dispose()'
            )
        int clientIndex =
            text.indexOf(
