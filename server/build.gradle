tasks.register('chat1CurrentCumulativeServerIdentityRegression') {
    group = 'verification'
    description = 'Locks the Gradle-owned cumulative server-JAR SHA handoff used by the canonical wrapper and final smoke.'

    doLast {
        File buildFile = new File(repoRoot, 'server/build.gradle')
        String buildText = buildFile.getText('UTF-8')
        String taskAnchor = "tasks.register('chat1CurrentCumulativeCertification')"
        int taskIndex = buildText.lastIndexOf(taskAnchor)
        if(taskIndex < 0)
            throw new GradleException('Current cumulative certification task not found.')

        String taskText = buildText.substring(taskIndex)
        int nextTaskIndex =
            taskText.indexOf(
                'tasks.register(',
                taskAnchor.length()
            )

        String cumulativeTaskText =
            nextTaskIndex < 0 ?
                taskText :
                taskText.substring(0, nextTaskIndex)

        [
            "tasks.named('jar', Jar).get().archiveFile.get().asFile",
            'sha256(certifiedServerJar)',
            "'serverSha256=' + certifiedServerSha256 + ' '"
        ].each { required ->
            if(!cumulativeTaskText.contains(required))
                throw new GradleException(
                    "Current cumulative server identity contract missing: ${required}"
                )
        }

        int dependencyBlockEnd =
            cumulativeTaskText.indexOf('    doLast {')
        if(dependencyBlockEnd < 0)
            throw new GradleException(
                'Current cumulative dependency block terminator not found.'
            )

        String dependencyText =
            cumulativeTaskText.substring(0, dependencyBlockEnd)

        [
            "tasks.named('currentTrainFocusedRegression')",
            "tasks.named('r85V308Acceptance')",
            "tasks.named('verifyJava11Bytecode')"
        ].each { required ->
            if(!dependencyText.contains(required))
                throw new GradleException(
                    "Current cumulative direct proof dependency missing: ${required}"
                )
        }

        [
            "'focused=175 '",
            "'exactV308=179 '",
            "'bytecodeMajor=55'"
        ].each { required ->
            if(!cumulativeTaskText.contains(required))
                throw new GradleException(
                    "Current cumulative numeric proof claim missing: ${required}"
                )
        }

        int jarIndex = cumulativeTaskText.indexOf(
            "tasks.named('jar', Jar).get().archiveFile.get().asFile"
        )
        int hashIndex = cumulativeTaskText.indexOf(
            'sha256(certifiedServerJar)'
        )
        int markerIndex = cumulativeTaskText.indexOf(
            "'SPAWNPK_CHAT1_CURRENT_CUMULATIVE_CERTIFICATION_PASS '"
        )
        int markerShaIndex = cumulativeTaskText.indexOf(
            "'serverSha256=' + certifiedServerSha256 + ' '"
        )

        if(jarIndex < 0 ||
           hashIndex <= jarIndex ||
           markerIndex <= hashIndex ||
           markerShaIndex <= markerIndex)
            throw new GradleException(
                'Current cumulative server identity ordering drifted: expected jar identity -> SHA -> Gradle-owned PASS marker -> serverSha256 field.'
            )

        logger.lifecycle(
            'CHAT1_CUMULATIVE_SERVER_IDENTITY_CONTRACT_PASS ' +
            'gradleOwned=true serverSha256=true'
        )
    }
}

tasks.register('chat1CurrentCumulativeCertification') {
    group = 'verification'
    description = 'Runs the complete current Chat 1 release candidate: Issue #5 Kotlin scripting, Issue #9 R13 source gates, #271/#427 presentation/application gates, Issue #7 pet-damage ownership, focused 175 and canonical exact-v308 179.'

    dependsOn(
        tasks.named('chat1CumulativeWrapperContractRegression'),
        tasks.named('chat1CurrentCumulativeServerIdentityRegression'),
        tasks.named('gradleBootstrapContractRegression'),
        tasks.named('issue5KotlinScriptingCertification'),
        tasks.named('currentTrainFocusedRegression'),
        tasks.named('r85V308Acceptance'),
        tasks.named('verifyJava11Bytecode'),
        tasks.named('issue9R13SourceCertification'),
        tasks.named('staffPartyhatAppearanceGateRegression'),
        tasks.named('tournamentPresentationRegression'),
        tasks.named('normalDuelPresentationRegression'),
        tasks.named('monsterSpawnerPresentationRegression'),
        tasks.named('itemEnchantmentServiceRegression'),
        tasks.named('itemEnchantmentPresentationRegression'),
        tasks.named('legendaryPetFusionServiceRegression'),
        tasks.named('legendaryPetFusionPresentationRegression'),
        tasks.named('bloodcoreLotteryPresentationRegression'),
        tasks.named('petDamageContentCommandActionOwnershipRegression'),
        tasks.named('petSpecializedProcContentCommandActionOwnershipRegression'),
        tasks.named('localServerStartupFailureCleanupRegression'),
        tasks.named('worldPulseStartFailureAtomicRegression'),
        tasks.named('localSessionConstructionOwnershipRegression'),
        tasks.named('worldAdmissionPulseStartAtomicRegression'),
        tasks.named('localAuxHttpResponseRegression'),
        tasks.named('localAuxResponseLivenessRegression'),
        tasks.named('localAuxiliaryWorkerFailureRegression'),
        tasks.named('localAuxVersionsRegression'),
        tasks.named('localAuxHttpWorkerFailurePreservationRegression'),
        tasks.named('localAuxHttpRequestReaderRegression'),
        tasks.named('localAuxArchivePathRegression'),
        tasks.named('localAuxArchiveAccessRegression')
    )

    doLast {
        File certifiedServerJar =
            tasks.named('jar', Jar).get().archiveFile.get().asFile
        if(!certifiedServerJar.isFile())
            throw new GradleException(
                "Cumulative certification produced no server JAR: ${certifiedServerJar}"
            )

        String certifiedServerSha256 =
            sha256(certifiedServerJar)
        if(!(certifiedServerSha256 ==~ /[0-9a-f]{64}/))
            throw new GradleException(
                "Invalid cumulative-certified server SHA-256: ${certifiedServerSha256}"
            )

        logger.lifecycle(
            'SPAWNPK_CHAT1_CURRENT_CUMULATIVE_CERTIFICATION_PASS ' +
            'issue5=true ' +
            'issue9R13Source=true ' +
            'gradleBootstrapPinned=true ' +
            'staffPartyhat=true ' +
            'tournament=true ' +
            'normalDuel=true ' +
            'monsterSpawner=true ' +
            'itemEnchantment=true ' +
            'legendaryPetFusion=true ' +
            'bloodcoreLottery=true ' +
            'petDamage=true ' +
            'specializedPetProc=true ' +
            'startupFailureAtomic=true ' +
            'worldPulseStartAtomic=true ' +
            'localSessionConstructionOwnership=true ' +
            'worldAdmissionPulseStartAtomic=true ' +
            'localAuxHttpStreaming=true ' +
            'localAuxResponseLiveness=true ' +
            'auxWorkerFailurePropagation=true ' +
            'localAuxVersionsBounded=true ' +
            'auxHandlerFailurePreserved=true ' +
            'localAuxRequestBounded=true ' +
            'localAuxArchivePathSafe=true ' +
            'localAuxArchiveAccessSafe=true ' +
            'focused=175 ' +
            'exactV308=179 ' +
            'clientSha256=' + v308AcceptanceClientSha256 + ' ' +
            'serverSha256=' + certifiedServerSha256 + ' ' +
            'canonicalPromoted=true ' +
            'bytecodeMajor=55'
        )
    }
