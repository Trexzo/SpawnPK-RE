tasks.register('playerAppearanceRoleV308Parity') {
    group = 'verification'
    description = 'Runs exact-v308 rs.a.k appearance parser parity for aC and worn-HEAD vs cosmetic-bs separation.'
    dependsOn tasks.named('testClasses'), tasks.named('verifyJava11Bytecode')

    doLast {
        String explicitClientPath =
            providers.gradleProperty('v308ClientPath')
                .orElse(
                    providers.environmentVariable('SPK_V308_CLIENT')
                )
                .getOrNull()

        File client
        if (explicitClientPath != null &&
            !explicitClientPath.trim().isEmpty()) {
            client = new File(explicitClientPath.trim()).canonicalFile
            if (!client.isFile()) {
                throw new GradleException(
                    'Explicit v308 client.jar is not a file: ' + client
                )
            }
            String actual = sha256(client)
            if (!actual.equalsIgnoreCase(v308AcceptanceClientSha256)) {
                throw new GradleException(
                    'Explicit v308 client.jar SHA-256 mismatch: expected=' +
                    v308AcceptanceClientSha256 +
                    ' actual=' + actual +
                    ' path=' + client
                )
            }
        } else {
            client = findExactClientBySha(v308AcceptanceClientSha256)
        }

        if (client == null) {
            throw new GradleException(
                'Exact v308 client.jar is required for player appearance-role parity; provide -Pv308ClientPath=<path> or SPK_V308_CLIENT; required SHA-256=' +
                v308AcceptanceClientSha256
            )
        }

        project.javaexec {
            workingDir repoRoot
            classpath = sourceSets.test.runtimeClasspath + files(client)
            mainClass.set('spk.local.AppearanceClientParityTest')
        }

        logger.lifecycle(
            'PLAYER_APPEARANCE_ROLE_V308_PARITY_PASS clientSha256=' +
            sha256(client) +
            ' ac=true wornHeadVsOverrideBs=true'
        )
    }
}

