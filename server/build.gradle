        ].each { anchor ->
            int count = 0
            int from = 0
            while(true) {
                int found =
                    text.indexOf(
                        anchor,
                        from
                    )
                if(found < 0)
                    break
                count++
                from = found + anchor.length()
            }
            if(count != 1)
                throw new GradleException(
                    "Chat 1 cumulative wrapper structural anchor count drift: expected=1 actual=${count} anchor=${anchor}"
                )
        }

        [
            'function Assert-OrdinaryDirectory': 1,
            'function Assert-OrdinaryFile': 1,
            'function Initialize-CertificationEvidenceRoot': 1,
            'function Remove-EmptyCertificationSnapshotRootSafely': 1,
            'function Remove-CertificationSnapshotSafely': 1,
            'function Remove-CertificationEvidenceLeafSafely': 1,
            'Assert-OrdinaryDirectory -Path $runtimeRoot': 11,
            'Assert-OrdinaryDirectory -Path $evidenceRoot': 11,
            'Assert-OrdinaryDirectory -Path $snapshotRoot': 2,
            'Assert-OrdinaryDirectory -Path $SnapshotRoot': 4,
            'Remove-EmptyCertificationSnapshotRootSafely -SnapshotRoot $snapshotRoot': 1,
            'Remove-EmptyCertificationSnapshotRootSafely -SnapshotRoot $SnapshotRoot': 1,
            'Remove-CertificationSnapshotSafely -SnapshotRoot $snapshotRoot -SnapshotClient $snapshotClient': 1,
            'Remove-CertificationEvidenceLeafSafely -Path $evidence': 1,
            '$snapshotClientOwned = $false': 2,
            '$snapshotClientOwned = $true': 1,
            '$evidenceOwned = $false': 2,
            '$evidenceOwned = $true': 1,
            'Remove-Item -LiteralPath $SnapshotClient -Force -ErrorAction Stop': 1,
            'Remove-Item -LiteralPath $SnapshotRoot -Force -ErrorAction Stop': 1
        ].each { anchor, expectedCount ->
            int count = 0
            int from = 0
            while(true) {
                int found =
                    text.indexOf(
                        anchor,
                        from
                    )
                if(found < 0)
                    break
                count++
                from = found + anchor.length()
            }
            if(count != expectedCount)
                throw new GradleException(
                    "Chat 1 cumulative evidence-root guard count drift: expected=${expectedCount} actual=${count} anchor=${anchor}"
                )
        }

        int evidenceRootInitIndex =
            text.lastIndexOf(
                'Initialize-CertificationEvidenceRoot'
            )
        int snapshotRootCreateIndex =
            text.indexOf(
                'New-Item -ItemType Directory -Path $snapshotRoot'
            )

        if(evidenceRootInitIndex < 0 ||
           snapshotRootCreateIndex < 0 ||
           evidenceRootInitIndex >= snapshotRootCreateIndex)
            throw new GradleException(
                'Certification evidence-root validation must complete before invocation snapshot creation.'
            )

        int snapshotWriterIndex =
            text.indexOf(
                '\$snapshotWriter ='
            )
        int runtimeRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$runtimeRoot -Label 'Certification runtime root before client snapshot copy'",
                snapshotWriterIndex
            )
        int evidenceRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$evidenceRoot -Label 'Certification evidence root before client snapshot copy'",
                runtimeRevalidateIndex
            )
        int snapshotRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$snapshotRoot -Label 'Certification client snapshot root before client snapshot copy'",
                evidenceRevalidateIndex
            )
        int snapshotCopyIndex =
            text.indexOf(
                '\$sourceGuard.CopyTo(\$snapshotWriter)',
                snapshotRevalidateIndex
            )

        if(snapshotWriterIndex < 0 ||
           runtimeRevalidateIndex <= snapshotWriterIndex ||
           evidenceRevalidateIndex <= runtimeRevalidateIndex ||
           snapshotRevalidateIndex <= evidenceRevalidateIndex ||
           snapshotCopyIndex <= snapshotRevalidateIndex)
            throw new GradleException(
                'Client snapshot authority ordering drifted: expected destination CreateNew -> runtime/evidence/snapshot parent revalidation -> guarded source copy.'
            )

        int logOpenIndex =
            text.indexOf(
                '\$logGuard =',
                text.indexOf(
                    "\$gradleOutput ="
                )
            )
        int logRuntimeRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$runtimeRoot -Label 'Certification runtime root before log write'",
                logOpenIndex
            )
        int logEvidenceRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$evidenceRoot -Label 'Certification evidence root before log write'",
                logRuntimeRevalidateIndex
            )
        int logWriterAfterParentValidationIndex =
            text.indexOf(
                '\$logWriter =',
                logEvidenceRevalidateIndex
            )

        if(logOpenIndex < 0 ||
           logRuntimeRevalidateIndex <= logOpenIndex ||
           logEvidenceRevalidateIndex <= logRuntimeRevalidateIndex ||
           logWriterAfterParentValidationIndex <= logEvidenceRevalidateIndex)
            throw new GradleException(
                'Certification log authority ordering drifted: expected log CreateNew -> runtime/evidence revalidation -> log writer.'
            )

        int evidenceOpenSearchStart =
            text.indexOf(
                "\$evidenceSha = \$null"
            )
        int evidenceOpenIndex =
            text.indexOf(
                '\$evidenceGuard =',
                evidenceOpenSearchStart
            )
        int jsonRuntimeRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$runtimeRoot -Label 'Certification runtime root before JSON evidence write'",
                evidenceOpenIndex
            )
        int jsonEvidenceRevalidateIndex =
            text.indexOf(
                "Assert-OrdinaryDirectory -Path \$evidenceRoot -Label 'Certification evidence root before JSON evidence write'",
                jsonRuntimeRevalidateIndex
            )
        int evidenceWriterAfterParentValidationIndex =
            text.indexOf(
                '\$evidenceWriter =',
                jsonEvidenceRevalidateIndex
            )

        if(evidenceOpenSearchStart < 0 ||
           evidenceOpenIndex <= evidenceOpenSearchStart ||
           jsonRuntimeRevalidateIndex <= evidenceOpenIndex ||
           jsonEvidenceRevalidateIndex <= jsonRuntimeRevalidateIndex ||
           evidenceWriterAfterParentValidationIndex <= jsonEvidenceRevalidateIndex)
            throw new GradleException(
                'Certification JSON evidence authority ordering drifted: expected evidence CreateNew -> runtime/evidence revalidation -> JSON writer.'
            )

        int emptySnapshotCleanupFunctionIndex =
            text.indexOf(
                'function Remove-EmptyCertificationSnapshotRootSafely'
            )
        int emptySnapshotProofIndex =
            text.indexOf(
                'Certification snapshot root is not empty; refusing cleanup of unowned or unexpected contents.',
                emptySnapshotCleanupFunctionIndex
            )
        int snapshotRootRemoveIndex =
            text.indexOf(
                'Remove-Item -LiteralPath $SnapshotRoot -Force -ErrorAction Stop',
                emptySnapshotProofIndex
            )

        if(emptySnapshotCleanupFunctionIndex < 0 ||
           emptySnapshotProofIndex <= emptySnapshotCleanupFunctionIndex ||
           snapshotRootRemoveIndex <= emptySnapshotProofIndex)
            throw new GradleException(
                'Empty snapshot-root cleanup must prove no entries before non-recursive root removal.'
            )

        int snapshotCleanupFunctionIndex =
            text.indexOf(
                'function Remove-CertificationSnapshotSafely'
            )
        int snapshotCleanupContentsIndex =
            text.indexOf(
                'Get-ChildItem -LiteralPath $SnapshotRoot -Force -ErrorAction Stop',
                snapshotCleanupFunctionIndex
            )
        int snapshotLeafRemoveIndex =
            text.indexOf(
                'Remove-Item -LiteralPath $SnapshotClient -Force -ErrorAction Stop',
                snapshotCleanupContentsIndex
            )
        int snapshotEmptyCleanupInvokeIndex =
            text.indexOf(
                'Remove-EmptyCertificationSnapshotRootSafely -SnapshotRoot $SnapshotRoot',
                snapshotLeafRemoveIndex
            )

        if(snapshotCleanupFunctionIndex < 0 ||
           snapshotCleanupContentsIndex <= snapshotCleanupFunctionIndex ||
           snapshotLeafRemoveIndex <= snapshotCleanupContentsIndex ||
           snapshotEmptyCleanupInvokeIndex <= snapshotLeafRemoveIndex)
            throw new GradleException(
                'Owned snapshot cleanup must prove the exact leaf, remove only that leaf, then delegate to empty-root cleanup.'
            )

        int snapshotWriterOwnedIndex =
            text.indexOf(
                '$snapshotClientOwned = $true',
                snapshotWriterIndex
            )
        int snapshotOwnedCleanupBranchIndex =
            text.indexOf(
                'if ($snapshotClientOwned)'
