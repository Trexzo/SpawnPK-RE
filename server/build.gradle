tasks.register('currentTrainFocusedRegression') {
    group = 'verification'
    description = 'Runs the frozen #431 focused release-safety regression manifest separately from the inherited 179-test R8.5 suite.'
    dependsOn tasks.named('testClasses'), tasks.named('verifyJava11Bytecode')

    doLast {
        currentTrainFocusedTests.eachWithIndex { className, index ->
            logger.lifecycle(
                "[CURRENT-TRAIN-FOCUSED] ${index + 1}/${currentTrainFocusedTests.size()} ${className}"
            )
            project.javaexec {
                workingDir repoRoot
                classpath = sourceSets.test.runtimeClasspath
                mainClass.set(className)
            }
        }

        logger.lifecycle(
            "GRADLE_CURRENT_TRAIN_FOCUSED_PASS count=${currentTrainFocusedTests.size()} bytecodeMajor=55"
        )
    }
}

