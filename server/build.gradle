tasks.register('pluginDeveloperApiArtifactRegression') {
    group = 'verification'
    description = 'Locks the standalone allowlisted plugin API JAR and Java/JVM consumer boundary.'
    dependsOn(
        pluginApiJar,
        compileJavaPluginApiFixture,
        tasks.named('testClasses')
    )

    doLast {
        File apiJar =
            pluginApiJar.get()
                .archiveFile.get()
                .asFile

        if(!apiJar.isFile())
            throw new GradleException(
                "Missing plugin API artifact: " +
                apiJar
            )

        Set<String> entries =
            new TreeSet<>()

        new java.util.jar.JarFile(apiJar)
            .withCloseable { jar ->
                def enumeration =
                    jar.entries()

                while(enumeration.hasMoreElements()) {
                    def entry =
                        enumeration.nextElement()

                    if(!entry.isDirectory())
                        entries.add(
                            entry.getName()
                        )
                }
            }

        if(entries.any {
                it.startsWith('spk/local/')
            })
            throw new GradleException(
                'Plugin API artifact contains spk/local classes.'
            )

        Set<String> allowedClassEntries =
            new TreeSet<String>(
                pluginApiClassPatterns
            )

        Set<String> actualClassEntries =
            new TreeSet<String>(
                entries.findAll {
                    it.endsWith('.class')
                }
            )

        Set<String> unexpected =
            new TreeSet<String>(
                actualClassEntries
            )
        unexpected.removeAll(
            allowedClassEntries
        )

        if(!unexpected.isEmpty())
            throw new GradleException(
                'Unexpected plugin API artifact classes: ' +
                unexpected
            )

        pluginApiTopLevelClasses.each { binaryName ->
            String entry =
                binaryName.replace('.', '/') +
                '.class'

            if(!actualClassEntries.contains(entry))
                throw new GradleException(
                    'Missing API class from artifact: ' +
                    binaryName
                )
        }

        for(String eventEntry : [
                'spk/event/DomainEventBus.class',
                'spk/event/DomainEventBus$Event.class',
                'spk/event/DomainEventBus$Cancellable.class',
                'spk/event/DomainEventBus$Priority.class',
                'spk/event/DomainEventBus$Listener.class',
                'spk/event/DomainEventBus$Subscription.class'
        ])
            if(!actualClassEntries.contains(eventEntry))
                throw new GradleException(
                    'Missing event API class from artifact: ' +
                    eventEntry
                )

        def apiClassFiles =
            zipTree(apiJar)
                .matching {
                    include '**/*.class'
                }
                .files

        if(apiClassFiles.empty)
            throw new GradleException(
                'Plugin API artifact contains no classes.'
            )

        apiClassFiles.each { classFile ->
            int major =
                readClassMajor(
                    classFile
                )

            if(major != 55)
                throw new GradleException(
                    "Plugin API bytecode compatibility failure: " +
                    classFile +
                    " major=" +
                    major +
                    ", expected=55"
                )
        }

        File javaFixture =
            new File(
                layout.buildDirectory
                    .get()
                    .asFile,
                'plugin-fixtures/java-classes/example/spawnpk/fixture/JavaPluginApiFixture.class'
            )

        if(!javaFixture.isFile())
            throw new GradleException(
                'Java plugin API fixture did not compile.'
            )

        int fixtureMajor =
            readClassMajor(
                javaFixture
            )

        if(fixtureMajor != 55)
            throw new GradleException(
                "Java plugin fixture major=" +
                fixtureMajor +
                ", expected=55"
            )

        logger.lifecycle(
            'PLUGIN_DEVELOPER_API_ARTIFACT_PASS ' +
            'artifact=SpawnPKPluginApi.jar ' +
            'allowlistedClasses=' +
            actualClassEntries.size() +
            ' spkLocalLeak=false ' +
            'javaConsumer=true ' +
            'javaConsumerServerJar=false ' +
            'bytecodeMajor=55 ' +
            'kotlinConsumerDeferred=true ' +
            'classloaderIsolationDeferred=true'
        )
    }
}

def sha256 = { File f ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { input ->
        byte[] buf = new byte[8192]
        int n
        while ((n = input.read(buf)) > 0) {
            digest.update(buf, 0, n)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def findPinnedClient = {
    def candidates = [
        new File(repoRoot, 'evidence/client(6).jar'),
        new File(repoRoot, 'evidence/client(4).jar'),
        new File(repoRoot, 'evidence/client.jar'),
        new File(repoRoot, 'client.jar')
    ]

    candidates.find { f ->
        f.isFile() && sha256(f).equalsIgnoreCase(pinnedClientSha256)
    }
}

def findExactClientBySha = { String expectedSha ->
    def candidates = [
        new File(repoRoot, 'evidence/client(6).jar'),
        new File(repoRoot, 'evidence/client(4).jar'),
        new File(repoRoot, 'evidence/client.jar'),
        new File(repoRoot, 'client.jar')
    ]

    candidates.find { f ->
        f.isFile() && sha256(f).equalsIgnoreCase(expectedSha)
    }
}

def readR85Selftests = {
    File harness = new File(repoRoot, 'RUN_V5185_FULL_SELFTEST.ps1')
    if (!harness.isFile()) {
        throw new GradleException("Missing R8.5 regression harness: ${harness}")
    }

    String text = harness.getText('UTF-8')
    int start = text.indexOf('$tests=@(')
    if (start < 0) {
        throw new GradleException('Could not locate $tests block in RUN_V5185_FULL_SELFTEST.ps1')
    }

    int end = text.indexOf('\n)\n', start)
    if (end < 0) {
        end = text.indexOf('\r\n)\r\n', start)
    }
    if (end < 0) {
        throw new GradleException('Could not locate end of $tests block in RUN_V5185_FULL_SELFTEST.ps1')
    }

    String block = text.substring(start, end)
    def matcher = block =~ /'([A-Za-z0-9_]+Test)'/
    def names = matcher.collect { it[1] }

    int uniqueNames = names.toSet().size()

    if (names.size() != 179 ||
        uniqueNames != 179) {
        throw new GradleException(
            "R8.5 regression manifest drift: expected 179 unique tests, found " +
            names.size() +
            " / " +
            uniqueNames
        )
    }
    names
}

tasks.register('r85Regression') {
    group = 'verification'
    description = 'Runs the inherited 179/179 R8.5 main-method regression suite when the pinned client fixture is available.'
    dependsOn tasks.named('jar'), tasks.named('testClasses'), tasks.named('verifyJava11Bytecode')

    doLast {
        File client = findPinnedClient()
        boolean requireClient = providers.gradleProperty('requireExactClient').map { it.toBoolean() }.getOrElse(false)

        if (client == null) {
            String message = 'Pinned exact client.jar is not present; R8.5 regression execution skipped. Supply external runtime or use -PrequireExactClient=true to make this fatal.'
            if (requireClient) {
                throw new GradleException(message)
            }
            logger.warn("R85_REGRESSION_SKIPPED ${message}")
            return
        }

        def names = readR85Selftests()
        File configDir = new File(System.getenv('USERPROFILE') ?: System.getProperty('user.home'), '.spawnpk/configs')

        names.eachWithIndex { testName, index ->
            logger.lifecycle("[GRADLE-R85] ${index + 1}/${names.size()} ${testName}")
            project.javaexec {
                workingDir repoRoot
                classpath = sourceSets.test.runtimeClasspath + files(client)
                mainClass.set("spk.local.${testName}")
                if (testName == 'VoidglassR2ConfigPatchToolTest' || testName == 'VoidglassR3ConfigPatchToolTest') {
                    jvmArgs "-Dspk.voidglass.configDir=${configDir.absolutePath}"
                }
            }
        }

        logger.lifecycle("GRADLE_R85_FULL_SELFTEST_PASS count=${names.size()} exactClient=true bytecodeMajor=55")
    }
}

tasks.register('r85V308Acceptance') {
    group = 'verification'
    description = 'Runs the inherited 179/179 R8.5 suite against the canonical exact v308 client pin.'
    dependsOn tasks.named('jar'), tasks.named('testClasses'), tasks.named('verifyJava11Bytecode')

    doLast {
        String explicitClientPath =
            providers.gradleProperty('v308ClientPath')
                .orElse(
                    providers.environmentVariable(
                        'SPK_V308_CLIENT'
                    )
                )
                .getOrNull()

        File client

        if (explicitClientPath != null &&
            !explicitClientPath.trim().isEmpty()) {
            client =
                new File(
                    explicitClientPath.trim()
                ).canonicalFile

            if (!client.isFile()) {
                throw new GradleException(
                    "Explicit v308 acceptance client.jar is not a file: ${client}"
                )
            }

            String explicitSha = sha256(client)

            if (!explicitSha.equalsIgnoreCase(
                    v308AcceptanceClientSha256)) {
                throw new GradleException(
                    "Explicit v308 acceptance client.jar SHA-256 mismatch: expected=${v308AcceptanceClientSha256} actual=${explicitSha} path=${client}"
                )
            }
        } else {
            client =
                findExactClientBySha(
                    v308AcceptanceClientSha256
                )
        }

        if (client == null) {
            throw new GradleException(
                "Exact v308 acceptance client.jar is not present; provide -Pv308ClientPath=<path> or SPK_V308_CLIENT, or place the exact fixture in a recognized repository candidate path; required SHA-256=${v308AcceptanceClientSha256}"
            )
        }

        String actualClientSha = sha256(client)
        def names = readR85Selftests()
        File configDir = new File(System.getenv('USERPROFILE') ?: System.getProperty('user.home'), '.spawnpk/configs')

        names.eachWithIndex { testName, index ->
            logger.lifecycle("[GRADLE-R85-V308] ${index + 1}/${names.size()} ${testName}")
            project.javaexec {
                workingDir repoRoot
                classpath = sourceSets.test.runtimeClasspath + files(client)
                mainClass.set("spk.local.${testName}")
                if (testName == 'VoidglassR2ConfigPatchToolTest' || testName == 'VoidglassR3ConfigPatchToolTest') {
                    jvmArgs "-Dspk.voidglass.configDir=${configDir.absolutePath}"
                }
            }
        }

        logger.lifecycle(
            "GRADLE_R85_V308_ACCEPTANCE_PASS count=${names.size()} clientSha256=${actualClientSha} canonicalPromoted=true bytecodeMajor=55"
        )
    }
}

