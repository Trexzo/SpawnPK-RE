    description = 'Proves callback-failure owner/dependant terminalization while preserving unrelated event/task progress and no content fallback.'
    dependsOn tasks.named('testClasses')

    doLast {
        [
            'spk.local.PluginRuntimeFailureCascadeTest',
            'spk.local.PluginSchedulerLifecycleTest',
            'spk.local.PluginEventFailureIsolationTest'
        ].each { mainClassName ->
            project.javaexec {
                workingDir repoRoot
                classpath = sourceSets.test.runtimeClasspath
                mainClass.set(mainClassName)
            }
        }

        logger.lifecycle(
            'PLUGIN_RUNTIME_FAILURE_CASCADE_PASS transitiveCascade=true reverseDependencyCleanup=true unrelatedEventContinues=true taskFailureTerminal=true contentFailureTerminal=true sameDispatchFallback=false disableExactlyOnce=true terminalDiagnosticsDetached=true terminalHandlesReleaseFailureSink=true nestedTaskCascadeDeferred=true batchEnableAdmissionAtomic=true batchTaskDeferredUntilCommit=true failedBatchTaskHandleTerminal=true batchCommitPublicationBarrier=true preCommitTaskDefers=true admissionRejectionNotFailure=true claimedFailureRecorded=true cleanupFailureDetached=true stackDetached=true hostileThrowableContained=true hostileTaskQueueContinues=true'
        )
    }
}

tasks.register('issue4FinalCertification') {
    group = 'verification'
    description = 'Runs every Issue #4 plugin gate plus the frozen 175-test and exact-v308 179-test release-safety suites.'

    dependsOn(
        tasks.named('pluginDeveloperApiArtifactRegression'),
        tasks.named('pluginKotlinJvmConsumerRegression'),
        tasks.named('pluginClassloaderIsolationRegression'),
        tasks.named('pluginCallbackLeaseIsolationRegression'),
        tasks.named('pluginSchedulerTerminalReleaseRegression'),
        tasks.named('pluginContentRegistrationTerminalReleaseRegression'),
        tasks.named('pluginEnableFacadeTerminalReleaseRegression'),
        tasks.named('pluginWorldTerminalLifecycleRegression'),
        tasks.named('pluginRuntimeFailureCascadeRegression'),
        tasks.named('currentTrainFocusedRegression'),
        tasks.named('r85V308Acceptance')
    )

    doLast {
        logger.lifecycle(
            'SPAWNPK_ISSUE4_FINAL_CERTIFICATION_PASS ' +
            'pluginGates=9 focused=175 exactV308=179 ' +
            'bytecodeMajor=55 canonicalPromoted=true'
        )
    }
}

