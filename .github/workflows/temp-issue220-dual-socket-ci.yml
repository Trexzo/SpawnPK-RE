name: TEMP Issue 220 Dual Socket Reliability CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/EngineR3DualSocketVisibilityTest.java'
      - '.github/workflows/temp-issue220-dual-socket-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Stress dual-socket visibility
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            & java -cp server/build/classes spk.local.EngineR3DualSocketVisibilityTest
            if ($LASTEXITCODE -ne 0) {
              throw "EngineR3DualSocketVisibilityTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }
          Write-Host "ISSUE220_DUAL_SOCKET_STRESS_PASS iterations=20"

      - name: Run related shared-world regressions
        shell: pwsh
        run: |
          $tests = @(
            'EngineR3PlayerSyncTest',
            'SharedWorldSocketIntegrationTest',
            'LocalSessionRuntimeBindingsTest'
          )

          foreach ($test in $tests) {
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE220_RELATED_SHARED_WORLD_PASS tests=$($tests.Count)"
