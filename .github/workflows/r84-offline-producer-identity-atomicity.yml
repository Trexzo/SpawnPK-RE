name: R84 Offline Producer Identity and Atomicity Model

on:
  push:
    branches:
      - playability/r84-offline-producer-identity-atomicity-20261120
  pull_request:
    paths:
      - server/src/spk/local/CombatOutcomeObserverGroup.java
      - server/src/spk/local/R84OfflineAtomicCombatRecord.java
      - server/src/spk/local/R84OfflineAtomicCombatRecordTest.java
      - server/src/spk/local/R83OfflineCombatCheckpointAudit.java
      - server/src/spk/local/R83OfflineCombatCheckpointObserver.java
      - server/src/spk/local/R83OfflineCombatCheckpointAuditTest.java
      - server/src/spk/local/R81OfflineCombatOutcomeDeliveryGuard.java
      - server/src/spk/local/R81OfflineCombatOutcomeReplayFence.java
      - server/src/spk/local/R81OfflineCombatOutcomeReplayTest.java
      - server/src/spk/local/CombatOutcomeObjectiveObserver.java
      - server/src/spk/local/CombatOutcomeMatchObserver.java
      - server/src/spk/local/CombatOutcomeCollectionLogObserver.java
      - server/src/spk/local/R80OfflineCombatProjectionOwnershipFence.java
      - server/src/spk/local/R80OfflineCombatProjectionFanoutTest.java
      - .github/workflows/r84-offline-producer-identity-atomicity.yml

jobs:
  linux-projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R84 crash ordering audit and inherited regressions
        working-directory: server
        run: |
          for test in spk.local.R84OfflineAtomicCombatRecordTest spk.local.R83OfflineCombatCheckpointAuditTest spk.local.R81OfflineCombatOutcomeReplayTest spk.local.R80OfflineCombatProjectionFanoutTest spk.local.CombatOutcomeObserverGroupTest spk.local.CombatOutcomeObjectiveIntegrationTest spk.local.CombatOutcomeMatchObserverTest spk.local.CombatOutcomeCollectionLogObserverTest spk.local.R79OfflinePairedPvpOwnershipTest spk.local.PlayerPvpAttackerWorldOwnershipFenceTest spk.local.PlayerPvpTargetWorldOwnershipFenceTest spk.local.PlayerCombatOutcomeProducerTest spk.local.R78OfflineVerifiedCombatOutcomeTest spk.local.R77OfflineDomainPublicationQuiescenceTest spk.local.R77OfflineEventProducerSourceAuditTest spk.event.DomainEventBusTest spk.event.DomainEventPublicApiBoundaryTest spk.local.R76OfflineWorldTickOwnedEventTest spk.local.R75OfflineRealtimePetIngressTest spk.local.R75OfflineDecodedPacketQuiescenceTest spk.local.R74OfflineIngressAndShutdownTest spk.local.R73OfflineFinalLogoutDrainTest spk.local.R72OfflineTerminalAndDurableOrderTest spk.local.R71OfflineSnapshotCaptureOrderTest spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-projections:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R84 crash ordering audit and inherited regressions
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R84OfflineAtomicCombatRecordTest',
            'spk.local.R83OfflineCombatCheckpointAuditTest',
            'spk.local.R81OfflineCombatOutcomeReplayTest',
            'spk.local.R80OfflineCombatProjectionFanoutTest',
            'spk.local.CombatOutcomeObserverGroupTest',
            'spk.local.CombatOutcomeObjectiveIntegrationTest',
            'spk.local.CombatOutcomeMatchObserverTest',
            'spk.local.CombatOutcomeCollectionLogObserverTest',
            'spk.local.R79OfflinePairedPvpOwnershipTest',
            'spk.local.PlayerPvpAttackerWorldOwnershipFenceTest',
            'spk.local.PlayerPvpTargetWorldOwnershipFenceTest',
            'spk.local.PlayerCombatOutcomeProducerTest',
            'spk.local.R78OfflineVerifiedCombatOutcomeTest',
            'spk.local.R77OfflineDomainPublicationQuiescenceTest',
            'spk.local.R77OfflineEventProducerSourceAuditTest',
            'spk.event.DomainEventBusTest',
            'spk.event.DomainEventPublicApiBoundaryTest',
            'spk.local.R76OfflineWorldTickOwnedEventTest',
            'spk.local.R75OfflineRealtimePetIngressTest',
            'spk.local.R75OfflineDecodedPacketQuiescenceTest',
            'spk.local.R74OfflineIngressAndShutdownTest',
            'spk.local.R73OfflineFinalLogoutDrainTest',
            'spk.local.R72OfflineTerminalAndDurableOrderTest',
            'spk.local.R71OfflineSnapshotCaptureOrderTest',
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
