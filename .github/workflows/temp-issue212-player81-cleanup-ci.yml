name: TEMP Issue 212 Player81 Cleanup CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/Player81WorldSync.java'
      - 'server/src/spk/local/Player81WorldStateCleanupTest.java'
      - '.github/workflows/temp-issue212-player81-cleanup-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Run Player81 lifecycle regressions
        shell: pwsh
        run: |
          $tests = @(
            'Player81WorldStateCleanupTest',
            'LocalSessionRuntimeBindingsTest',
            'EngineR3PlayerSyncTest',
            'EngineR3DualSocketVisibilityTest',
            'SharedWorldSocketIntegrationTest',
            'PlayerPresentationIsolationTest'
          )

          foreach ($test in $tests) {
            Write-Host "RUN $test"
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE212_PLAYER81_CLEANUP_CI_PASS tests=$($tests.Count)"
