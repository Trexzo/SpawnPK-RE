name: temp-issue152-client-v308-login-compat-ci

on:
  push:
    branches:
      - test/issue-152-client-v308-login-compat

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: v308 login compatibility
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.ClientBuildRevision308CompatibilityTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited login regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.HandshakeIntegrationTest',
            'spk.local.DualProfileSocketIntegrationTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
