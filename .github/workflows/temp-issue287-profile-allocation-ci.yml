name: TEMP Issue 287 Concurrent Profile Allocation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/World.java'
      - 'server/src/spk/local/LocalSessionPlayerInitializer.java'
      - 'server/src/spk/local/ConcurrentCanonicalProfileAllocationTest.java'
      - '.github/workflows/temp-issue287-profile-allocation-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress concurrent canonical profile allocation
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 8; $i++) {
            & java -cp $cp spk.local.ConcurrentCanonicalProfileAllocationTest
            if ($LASTEXITCODE -ne 0) {
              throw "ConcurrentCanonicalProfileAllocationTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE287_CONCURRENT_PROFILE_STRESS_PASS iterations=8"

      - name: Run profile lifecycle guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'DuplicateSrcProfilePreloadGuardTest',
            'SecondaryAccountSelectionTest',
            'DualProfileSocketIntegrationTest',
            'LocalSessionPlayerInitializerTest',
            'PlayerRegistryIdentityValidationTest',
            'LocalAccountProfilesTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE287_PROFILE_LIFECYCLE_GUARDS_PASS tests=$($tests.Count)"
