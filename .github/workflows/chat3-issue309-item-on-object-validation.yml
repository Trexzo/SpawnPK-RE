name: Chat3 Issue309 Item On Object Validation

on:
  push:
    branches:
      - content/issue-309-item-on-object-registration-chat3
  pull_request:
    branches:
      - main

jobs:
  windows-item-on-object:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Gradle-backed canonical build
        shell: pwsh
        run: ./server/build.ps1
      - name: Focused content API regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          $tests = @(
            'ContentItemOnObjectRegistrationTest',
            'ContentItemOnNpcRegistrationTest',
            'ContentItemOptionRegistrationTest',
            'ContentPublicApiBoundaryTest',
            'ContentRegistrationLifecycleTest',
            'ContentProvenanceAuthorityBoundaryTest'
          )
          foreach ($t in $tests) {
            Write-Host "[ISSUE309] $t"
            & java -cp $cp "spk.local.$t"
            if ($LASTEXITCODE -ne 0) { throw "Issue 309 regression failed: $t" }
          }
          Write-Host "CHAT3_ISSUE309_ITEM_ON_OBJECT_PASS tests=$($tests.Count)"
