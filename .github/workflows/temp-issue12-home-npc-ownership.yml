name: Temporary Issue 12 HOME NPC ownership validation

on:
  push:
    branches:
      - refactor/issue-12-home-npc-world-ownership

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run canonical HOME ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldHomeNpcOwnershipTest
      - name: Run HOME world state regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeNpcWorldStateTest
      - name: Run HOME runtime plan regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeWorldRuntimePlanTest
      - name: Run HOME integration regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeWorldV55IntegrationTest
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
