name: Temp Issue 165 Marketplace Hardening CI

on:
  pull_request:

jobs:
  issue165:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 159 escrow regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.AtomicTransactionServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Issue 165 Marketplace regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.MarketplaceServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Marketplace protocol boundary guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/MarketplaceListing.java",
            "server/src/spk/local/MarketplaceListingRepository.java",
            "server/src/spk/local/MarketplaceService.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ServerPacketWriter|ClientPacket|ApplicationBus|spriteId|sceneIndex" -CaseSensitive:$false
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "Issue 165 domain source contains protocol identity."
          }
          Write-Host "ISSUE165_PROTOCOL_BOUNDARY_PASS"
