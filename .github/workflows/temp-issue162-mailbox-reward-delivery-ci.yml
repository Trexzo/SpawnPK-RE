name: temp-issue162-mailbox-reward-delivery-ci

on:
  push:
    branches:
      - refactor/issue-162-mailbox-reward-delivery

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Mailbox reward delivery foundation
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.MailboxRewardDeliveryFoundationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited mailbox/application/world regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ApplicationUiServiceTest',
            'spk.local.WorldPulseCommandExecutionTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
