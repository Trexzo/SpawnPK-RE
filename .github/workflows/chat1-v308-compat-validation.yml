name: Chat1 V308 Compatibility Validation

on:
  push:
    branches:
      - integration/issue152-v308-compat-chat1

jobs:
  windows-v308-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle-backed canonical build
        shell: pwsh
        run: ./server/build.ps1
      - name: Exact-current v308 compatibility regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          & java -cp $cp spk.local.ClientBuildRevision308CompatibilityTest
          if ($LASTEXITCODE -ne 0) {
            throw "ClientBuildRevision308CompatibilityTest failed: exit=$LASTEXITCODE"
          }
          Write-Host "CHAT1_V308_COMPAT_PASS tests=1"
