name: Windows source-only preflight (not original-client GUI)

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/Check-WindowsReleaseEvidence.ps1'
      - 'scripts/Test-WindowsClientEvidenceContract.ps1'
      - 'scripts/Assert-WindowsSourceReleaseBoundary.ps1'
      - 'scripts/Test-WindowsSourceReleaseBoundary.ps1'
      - 'scripts/Test-WindowsNativeDirectoryIdentity.ps1'
      - 'scripts/Test-WindowsFileId128.ps1'
      - 'tools/verification/FilesystemLinkCountProbe.java'
      - '.github/workflows/windows-source-preflight.yml'
  workflow_dispatch:

jobs:
  windows-source-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Java 11 target
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle artifacts
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned Gradle SHA256 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-GradleBootstrapHash.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "GRADLE_SHA256_VECTOR_TEST_FAILED"
          }

      - name: Verify absent and mismatched v308 client evidence remains negative
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-WindowsClientEvidenceContract.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "WINDOWS_CLIENT_EVIDENCE_CONTRACT_FAILED"
          }

      - name: Record original-client availability without fabricating GUI acceptance
        shell: pwsh
        run: |
          & ./scripts/Check-WindowsReleaseEvidence.ps1 -OutputPath windows-release-evidence.json
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Windows evidence preflight failed: $LASTEXITCODE"
          }

      - name: Compile Windows Java sources and run bounded synthetic smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./server/gradlew.bat --no-daemon clean testClasses verifyJava11Bytecode g21294FinalSaveWaitTimeoutRegression g2023AttemptFenceUncertainCompletionEvidenceRegression g21371StrictPreActiveLinkProviderRegression g21372StrictPreActiveLinkProviderRegression g21373StrictPreActiveLinkProviderRegression g21374StrictOneShotTokenAdmissionRegression g21375StrictOneShotTokenAdmissionRegression g21376StrictOneShotTokenAdmissionRegression
          if ($LASTEXITCODE -ne 0) {
            throw "WINDOWS_SOURCE_ONLY_BUILD_FAILED exitCode=$LASTEXITCODE"
          }
          Write-Host "SPK_WINDOWS_SOURCE_SMOKE_PASS java11Bytecode=true accountWaitFixture=true npcAttemptFixture=true strictNlinkAdmissionFailClosedFixtures=3 strictRealWorldTokenFixtures=3 originalClientGui=false"

      # P5.31 source-only regression lane. Windows compilation alone
      # does not execute any of the P5.16-P5.30 combat regressions,
      # while full Linux Gradle runs may be cancelled independently.
      # Keep the original negative native-client release gate unchanged.
      - name: Execute source-only Wind Strike and shared PvM combat regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./server/gradlew.bat --no-daemon playablePvmChainSmoke
          if ($LASTEXITCODE -ne 0) {
            throw "WINDOWS_PVM_SOURCE_REGRESSION_FAILED exitCode=$LASTEXITCODE"
          }
          Write-Host "SPK_WINDOWS_PVM_SOURCE_REGRESSION_PASS tasks=40 defaultLocalSessionStillOff=true originalClientGui=false"

      - name: Record G21.171 World ancestry provider identity (negative is not positive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./server/gradlew.bat --no-daemon playableWorldAncestryProviderEvidenceSmoke | Tee-Object -FilePath windows-world-ancestry-full-log.txt
          if ($LASTEXITCODE -ne 0) {
            throw "WINDOWS_WORLD_ANCESTRY_PROVIDER_EVIDENCE_FAILED exitCode=$LASTEXITCODE"
          }
          $evidence = @(Get-Content windows-world-ancestry-full-log.txt | Where-Object { $_ -match 'P549_' })
          if (-not ($evidence | Where-Object { $_ -match 'P549_WORLD_ANCESTRY_EVIDENCE_PASS' })) {
            throw "WINDOWS_WORLD_ANCESTRY_PROVIDER_REPORT_MISSING"
          }
          $evidence | Set-Content -Path windows-world-ancestry-evidence.txt
          Write-Host "SPK_WINDOWS_WORLD_ANCESTRY_EVIDENCE_RECORDED positiveAndNegativeOutcomesSeparated=true"

      # P5.50: Win32 handle-level identity exists independently of
      # Java BasicFileAttributes.fileKey, but is NOT yet wired into
      # World ownership or filesystem admission.
      - name: Observe native Win32 directory IDs and pathname replacement (not World-save approval)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-WindowsNativeDirectoryIdentity.ps1 -OutputPath windows-native-directory-id-evidence.json
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "WINDOWS_NATIVE_DIRECTORY_IDENTITY_PROBE_FAILED exitCode=$LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath windows-native-directory-id-evidence.json)) {
            throw "WINDOWS_NATIVE_DIRECTORY_IDENTITY_REPORT_MISSING"
          }
          $evidence = Get-Content -Raw -LiteralPath windows-native-directory-id-evidence.json | ConvertFrom-Json
          if ($evidence.type -cne "SPK_P550_WIN32_DIRECTORY_IDENTITY_CAPABILITY_ONLY" -or
              $evidence.nativeDirectoryIdentityAvailable -ne $true -or
              $evidence.allSelectedAncestorsHaveNativeIdentity -ne $true -or
              $evidence.observedNativeAncestorCount -lt 4 -or
              $evidence.reopenStable -ne $true -or
              $evidence.distinctDirectoriesHaveDistinctIds -ne $true -or
              $evidence.renamedDirectoryPreservesId -ne $true -or
              $evidence.samePathReplacementChangesId -ne $true -or
              $evidence.ordinaryFileNotDirectory -ne $true -or
              $evidence.productionG21171Unchanged -ne $true -or
              $evidence.positiveWindowsWorldSaveCertified -ne $false -or
              $evidence.nativeIdentityFencingIntegrated -ne $false -or
              $evidence.crashDurabilityCertified -ne $false) {
            throw "WINDOWS_NATIVE_DIRECTORY_IDENTITY_INVALID_OR_OVERCLAIMED"
          }
          if ($evidence.symlinkCreationSupported -and
              -not $evidence.symlinkReparseObserved) {
            throw "WINDOWS_NATIVE_DIRECTORY_IDENTITY_SYMLINK_NEGATIVE_FAILED"
          }
          Write-Host "SPK_WINDOWS_NATIVE_DIRECTORY_IDENTITY_EVIDENCE_PASS nativeIdObservationOnly=true positiveWorldSaveCertified=false"

      # P5.51: observe complete 128-bit FileIdInfo including when a
      # native directory handle survives a rename. No authority grant.
      - name: Verify Win32 FileIdInfo 128-bit identity and held-handle continuity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-WindowsFileId128.ps1 -OutputPath windows-fileid128-evidence.json
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "P551_FILEID128_PROBE_FAILED exitCode=$LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath windows-fileid128-evidence.json)) {
            throw "P551_FILEID128_REPORT_MISSING"
          }
          $e = Get-Content -Raw -LiteralPath windows-fileid128-evidence.json | ConvertFrom-Json
          if ($e.type -cne "SPK_P551_FILEID128_CAPABILITY_ONLY" -or
              $e.fileId128Available -ne $true -or
              $e.ancestorIdsAvailable -ne $true -or
              $e.ancestorCount -lt 4 -or
              $e.reopenStable -ne $true -or
              $e.distinctDirectoryIds -ne $true -or
              $e.originalHandleStableAfterRename -ne $true -or
              $e.renamedNameRetainsId -ne $true -or
              $e.replacementAtSamePathDifferentId -ne $true -or
              $e.regularFileNotDirectory -ne $true -or
              ($e.symlinkFixtureSupported -and -not $e.symlinkIsReparse) -or
              $e.positiveWindowsWorldSaveCertified -ne $false -or
              $e.nativeWriterFenceIntegrated -ne $false -or
              $e.crossJvmOwnerLeaseCertified -ne $false -or
              $e.crashDurabilityCertified -ne $false) {
            throw "P551_FILEID128_UNSAFE_OR_OVERCLAIMED_REPORT"
          }
          Write-Host "P551_WINDOWS_FILEID128_EVIDENCE_RECORDED 128bitHandleIdentityOnly=true worldSaveAuthority=false"

      - name: Probe strict Java unix:nlink capability (not a pass assertion)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ./.spk-windows-probe | Out-Null
          & javac --release 11 -d ./.spk-windows-probe ./tools/verification/FilesystemLinkCountProbe.java
          if ($LASTEXITCODE -ne 0) { throw "Windows nlink probe compilation failed" }
          & java -cp ./.spk-windows-probe FilesystemLinkCountProbe | Tee-Object -FilePath windows-linkcount-evidence.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows nlink probe execution failed" }
          Write-Host "SPK_NLINK_PROBE_EXECUTED not_a_strict_gate_success_claim=true"

      - name: Reject unsafe Windows release-evidence promotion (source-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-WindowsSourceReleaseBoundary.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "WINDOWS_NEGATIVE_RELEASE_BOUNDARY_TEST_FAILED"
          }
          & ./scripts/Assert-WindowsSourceReleaseBoundary.ps1 -ClientEvidencePath windows-release-evidence.json -LinkCountEvidencePath windows-linkcount-evidence.txt -OutputPath windows-source-release-boundary.json
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "WINDOWS_NEGATIVE_RELEASE_BOUNDARY_FAILED"
          }

      - name: Upload negative release boundary decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-negative-release-boundary
          path: windows-source-release-boundary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload 128-bit Win32 FileIdInfo evidence (non-authorizing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fileid128-capability-evidence
          path: windows-fileid128-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Win32 native directory ID capability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-directory-id-evidence
          path: windows-native-directory-id-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload World ancestry provider identity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-world-ancestry-provider-evidence
          path: windows-world-ancestry-evidence.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload link-count provider capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-linkcount-capability
          path: windows-linkcount-evidence.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload original-client preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-only-evidence
          path: windows-release-evidence.json
          if-no-files-found: warn
          retention-days: 14
