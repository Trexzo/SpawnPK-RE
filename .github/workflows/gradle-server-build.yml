name: Gradle server build

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'tools/runtime/**'
      - 'tools/custom-assets/**'
      - '*.ps1'
      - 'docs/EXTERNAL_RUNTIME.md'
      - '.gitignore'
      - '.github/workflows/gradle-server-build.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'tools/runtime/**'
      - 'tools/custom-assets/**'
      - '*.ps1'
      - 'docs/EXTERNAL_RUNTIME.md'
      - '.gitignore'
      - '.github/workflows/gradle-server-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify Java 11 bytecode
        run: bash server/gradlew --no-daemon clean build
