name: Gradle server build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to validate'
        required: true
        type: string
      extra_tasks:
        description: 'Optional space-separated Gradle tasks to run after build/focused gates'
        required: false
        default: ''
        type: string

  pull_request:
    paths:
      - 'server/**'
      - 'scripts/Build-Server.ps1'
      - 'RUN_REPO_SELFTEST.ps1'
      - 'RUN_V5185_FULL_SELFTEST.ps1'
      - '.github/workflows/gradle-server-build.yml'

  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'scripts/Build-Server.ps1'
      - 'RUN_REPO_SELFTEST.ps1'
      - 'RUN_V5185_FULL_SELFTEST.ps1'
      - '.github/workflows/gradle-server-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify Java 11 bytecode
        run: bash server/gradlew --no-daemon clean build

      - name: Discover available verification tasks
        shell: bash
        run: |
          set -euo pipefail
          bash server/gradlew --no-daemon tasks --all --console=plain > "${RUNNER_TEMP}/gradle-tasks.txt"
          cat "${RUNNER_TEMP}/gradle-tasks.txt"

      - name: Run focused regression when available
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'currentTrainFocusedRegression' "${RUNNER_TEMP}/gradle-tasks.txt"; then
            bash server/gradlew --no-daemon currentTrainFocusedRegression
          else
            echo "currentTrainFocusedRegression is not defined on this ref; skipping."
          fi

      - name: Run Issue 7 aggregate acceptance when available
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'issue7CoreContentDecouplingAcceptance' "${RUNNER_TEMP}/gradle-tasks.txt"; then
            bash server/gradlew --no-daemon issue7CoreContentDecouplingAcceptance
          else
            echo "issue7CoreContentDecouplingAcceptance is not defined on this ref; skipping."
          fi

      - name: Run optional requested Gradle tasks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_tasks != '' }}
        shell: bash
        env:
          EXTRA_TASKS: ${{ inputs.extra_tasks }}
        run: |
          set -euo pipefail
          read -r -a TASKS <<< "${EXTRA_TASKS}"
          bash server/gradlew --no-daemon "${TASKS[@]}"
