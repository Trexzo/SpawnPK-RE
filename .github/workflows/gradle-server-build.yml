name: Gradle server build

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'tools/runtime/**'
      - 'tools/custom-assets/**'
      - '*.ps1'
      - 'docs/EXTERNAL_RUNTIME.md'
      - '.gitignore'
      - '.github/workflows/gradle-server-build.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'tools/runtime/**'
      - 'tools/custom-assets/**'
      - '*.ps1'
      - 'docs/EXTERNAL_RUNTIME.md'
      - '.gitignore'
      - '.github/workflows/gradle-server-build.yml'

jobs:
  # P5.31: quick independent Linux parity signal for the PvM
  # gameplay lane, even when the legacy 911-case full train times out.
  # This does not substitute for the complete build/release gate.
  pvm-source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 for Java 11 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache pinned Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Execute canonical melee and Wind Strike source chain
        shell: bash
        run: |
          set -euo pipefail
          # Keep the strict persistent-account socket regression on
          # Linux, where the required ancestry/link-count evidence is
          # available. Windows must still fail closed on unsupported
          # account filesystem providers.
          bash server/gradlew --no-daemon playablePvmChainSmoke playablePrayerMagicStyleSocketRegression
          echo "SPK_LINUX_PVM_SOURCE_REGRESSION_PASS crossPlatformTasks=34 persistentSocketLinux=true originalClientGui=false fullReleaseGateUnchanged=true"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The main-aligned candidate initially failed before compilation:
      # Maven Central returned HTTP 429 for Kotlin scripting dependencies.
      # Cache Gradle's immutable downloads instead of fetching everything
      # for each new PR and retry ONLY explicitly transient HTTP 429 errors.
      - name: Cache Gradle dependency and wrapper downloads
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Build and verify Java 11 bytecode
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "GRADLE_FULL_BUILD_ATTEMPT=${attempt}"
            if bash server/gradlew --no-daemon clean build 2>&1 | tee gradle-build-attempt.log; then
              echo "GRADLE_FULL_BUILD_SUCCESS attempt=${attempt}"
              exit 0
            fi
            if ! grep -Eiq 'Received status code 429|HTTP (response )?429|Too Many Requests' gradle-build-attempt.log; then
              echo "::error::Non-rate-limit Gradle failure; no automatic retry."
              exit 1
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Maven rate limit persisted through all three bounded attempts."
              exit 1
            fi
            echo "::warning::Dependency endpoint returned HTTP 429; retrying the exact full build after a bounded delay."
            sleep $((attempt * 30))
          done
