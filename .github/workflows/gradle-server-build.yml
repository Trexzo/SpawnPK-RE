name: Gradle server build

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/Build-Server.ps1'
      - 'RUN_REPO_SELFTEST.ps1'
      - 'RUN_V5185_FULL_SELFTEST.ps1'
      - 'tools/verification/loopback_boot_smoke.py'
      - 'tools/verification/test_loopback_boot_smoke.py'
      - 'tools/verification/synthetic_revision317_login.py'
      - 'tools/verification/test_synthetic_revision317_login.py'
      - 'tools/verification/synthetic_s2c_bank.py'
      - 'tools/verification/test_synthetic_s2c_bank.py'
      - 'tools/verification/synthetic_persistence_reconnect.py'
      - 'tools/verification/test_synthetic_persistence_reconnect.py'
      - 'tools/verification/synthetic_ground_take_reconnect.py'
      - 'tools/verification/test_synthetic_ground_take_reconnect.py'
      - 'tools/verification/synthetic_mortal_pvm_loot.py'
      - 'tools/verification/test_synthetic_mortal_pvm_loot.py'
      - 'tools/verification/synthetic_mortal_respawn.py'
      - 'tools/verification/test_synthetic_mortal_respawn.py'
      - 'tools/verification/synthetic_pvm_xp_reconnect.py'
      - 'tools/verification/test_synthetic_pvm_xp_reconnect.py'
      - 'tools/verification/synthetic_pvm_outcome_reconnect.py'
      - 'tools/verification/test_synthetic_pvm_outcome_reconnect.py'
      - '.github/workflows/gradle-server-build.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'scripts/Build-Server.ps1'
      - 'RUN_REPO_SELFTEST.ps1'
      - 'RUN_V5185_FULL_SELFTEST.ps1'
      - 'tools/verification/loopback_boot_smoke.py'
      - 'tools/verification/test_loopback_boot_smoke.py'
      - '.github/workflows/gradle-server-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify Java 11 bytecode
        run: bash server/gradlew --no-daemon clean build

      - name: Set up supported runtime JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit-test isolated server boot probe
        run: |
          python3 -m unittest discover -s tools/verification -p 'test_loopback_boot_smoke.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_revision317_login.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_s2c_bank.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_persistence_reconnect.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_ground_take_reconnect.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_mortal_pvm_loot.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_mortal_respawn.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_pvm_xp_reconnect.py' -v
          python3 -m unittest discover -s tools/verification -p 'test_synthetic_pvm_outcome_reconnect.py' -v

      - name: Boot actual server JAR in isolated loopback profile
        run: python3 tools/verification/loopback_boot_smoke.py --startup-timeout 30

      - name: Synthetic revision317 login + ISAAC bootstrap against actual server JAR
        run: python3 tools/verification/loopback_boot_smoke.py --startup-timeout 30 --synthetic-login

      - name: Synthetic client walk to bank through actual JVM authoritative World ticks
        run: python3 tools/verification/loopback_boot_smoke.py --startup-timeout 30 --synthetic-login --walk-bank

      - name: Synthetic bank mismatch, coin withdraw, deposit and stale retry
        run: python3 tools/verification/loopback_boot_smoke.py --startup-timeout 30 --synthetic-login --walk-bank --bank-roundtrip

      - name: Real-JVM ISAAC S2C53 bank/inventory wire parity, before/after transactions
        run: python3 tools/verification/loopback_boot_smoke.py --startup-timeout 30 --synthetic-login --walk-bank --bank-roundtrip --wire-inventory

      - name: Persistent account net-change preserved across two fresh Java JVMs
        run: python3 tools/verification/synthetic_persistence_reconnect.py

      - name: Real-JVM ground Drop/Take, scene S2C44/156 and persistent reconnect
        run: python3 tools/verification/synthetic_ground_take_reconnect.py

      - name: Real-JVM custom mortal PvM death, ground loot, Take, bank and fresh login
        run: python3 tools/verification/synthetic_mortal_pvm_loot.py

      - name: Real-JVM two 25HP NPC kills, distinct respawn, two loots banked across JVM restart
        run: python3 tools/verification/synthetic_mortal_respawn.py

      - name: Real-JVM six published PvM hits award independent S2C134 Attack XP and survive JVM restart
        run: python3 tools/verification/synthetic_pvm_xp_reconnect.py

      - name: Semantic PvM kill outcome producer World event bus and duplicate guards
        run: java -cp server/build/classes/java/main:server/build/classes/java/test spk.local.LocalLabPvmKillOutcomeProducerTest

      - name: Real-JVM two typed NPC_KILL World outcomes and loot/XP across JVM restart
        run: python3 tools/verification/synthetic_pvm_outcome_reconnect.py
