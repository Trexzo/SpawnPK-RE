name: TEMP Issue 339 Foreign Registry Ownership CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/PlayerRegistry.java'
      - 'server/src/spk/local/PlayerRegistryForeignOwnershipTest.java'
      - '.github/workflows/temp-issue339-foreign-registry-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress foreign registry ownership
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 20; $i++) {
            & java -cp $cp spk.local.PlayerRegistryForeignOwnershipTest
            if ($LASTEXITCODE -ne 0) {
              throw "PlayerRegistryForeignOwnershipTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE339_FOREIGN_REGISTRY_STRESS_PASS iterations=20"

      - name: Run registry and lifecycle guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'PlayerRegistryIdentityValidationTest',
            'PlayerLifecycleServiceTest',
            'WorldCommandLifecycleFenceTest',
            'WorldRealtimeQueueLifecycleFenceTest',
            'Player81WorldStateCleanupTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE339_REGISTRY_LIFECYCLE_GUARDS_PASS tests=$($tests.Count)"
