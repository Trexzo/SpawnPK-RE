name: temp-issue17-ui-request-ci

on:
  push:
    branches:
      - refactor/issue-17-ui-request-queue

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: |
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focused typed UI request regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ClientUiRequestQueueTest',
            'spk.local.ClientCommandRequestQueueTest',
            'spk.local.ClientPacketFramingAuthorityTest',
            'spk.local.LocalPendingRequestDispatcherTest',
            'spk.local.LocalSessionUiActionHandlerTest',
            'spk.local.LocalCommandDispatcherTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server\build\classes $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
