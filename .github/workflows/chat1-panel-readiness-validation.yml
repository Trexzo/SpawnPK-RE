name: Chat1 Panel Readiness Validation

on:
  push:
    branches:
      - integration/post257-panel-readiness-chat1

jobs:
  windows-panel-readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle-backed canonical build
        shell: pwsh
        run: ./server/build.ps1

      - name: Stress deterministic panel socket tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          $tests = @(
            'EngineR7DevPanelSocketTest',
            'EngineR72RuntimeWeaponPanelSocketTest',
            'EngineR82ResearchPanelSocketTest',
            'EngineR83DiscoveryPanelSocketTest',
            'EngineR84ApplicationPanelSocketTest',
            'EngineR8ResearchPanelSocketTest'
          )
          for ($round = 1; $round -le 10; $round++) {
            foreach ($t in $tests) {
              Write-Host "[PANEL] round=$round test=$t"
              & java -cp $cp "spk.local.$t"
              if ($LASTEXITCODE -ne 0) {
                throw "Panel readiness regression failed: round=$round test=$t exit=$LASTEXITCODE"
              }
            }
          }
          Write-Host "CHAT1_PANEL_READINESS_STRESS_PASS rounds=10 tests=$($tests.Count) executions=60"
