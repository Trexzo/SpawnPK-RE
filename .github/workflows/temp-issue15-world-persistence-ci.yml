name: temp-issue15-world-persistence-ci

on:
  push:
    branches:
      - refactor/issue-15-world-thread-snapshot-io

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: |
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focused world persistence regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.WorldPersistenceThreadingTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.LocalSessionPlayerInitializerTest',
            'spk.local.LocalSessionBootstrapPublisherTest',
            'spk.local.LocalSessionRuntimeBindingsTest',
            'spk.local.LocalSessionUiActionHandlerTest',
            'spk.local.RuntimeRepositorySaveTest',
            'spk.local.RuntimeRepositoryLoadTest',
            'spk.local.PlayerSnapshotSchemaExtractionTest',
            'spk.local.SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server\build\classes $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
