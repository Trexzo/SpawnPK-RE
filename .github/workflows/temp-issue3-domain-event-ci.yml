name: temp-issue3-domain-event-ci

on:
  push:
    branches:
      - refactor/issue-3-domain-event-bus-foundation
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Domain event bus regressions
        shell: pwsh
        run: |
          $jar = "server/build/SpawnPKLocalServer.jar"
          java -cp $jar spk.event.DomainEventBusTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $jar spk.local.DomainEventBusWorldContextTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Existing world and content regressions
        shell: pwsh
        run: |
          $jar = "server/build/SpawnPKLocalServer.jar"
          $tests = @(
            "spk.local.ContentRegistryTest",
            "spk.local.NpcOptionContentRegistryParityTest",
            "spk.local.WorldCommandLifecycleFenceTest",
            "spk.local.WorldPulseCommandExecutionTest"
          )
          foreach ($test in $tests) {
            java -cp $jar $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
