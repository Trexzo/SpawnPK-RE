name: temp-issue17-generic-bridge-retirement-ci

on:
  push:
    branches:
      - refactor/issue-17-retire-generic-c2s-bridge-chat2
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: |
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focused generic bridge retirement regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.GenericInteractionTypedRequestGoldenVectorTest',
            'spk.local.LocalGenericInteractionHandlerTest',
            'spk.local.ClientPacketProbeTest',
            'spk.local.ClientPacketFramingAuthorityTest',
            'spk.local.LocalPendingRequestDispatcherTest',
            'spk.local.ClientSpellTargetRequestQueueTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server\build\classes $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
