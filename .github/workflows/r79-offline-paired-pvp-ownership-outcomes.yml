name: R79 Offline Paired PvP Ownership and Outcomes

on:
  push:
    branches:
      - playability/r79-offline-dual-pvp-ownership-outcomes-20261116
  pull_request:
    paths:
      - server/src/spk/local/World.java
      - server/src/spk/local/R79OfflinePairedPvpOwnershipGate.java
      - server/src/spk/local/R79OfflinePairedPvpOwnershipTest.java
      - .github/workflows/r79-offline-paired-pvp-ownership-outcomes.yml

jobs:
  linux-paired-pvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R79 real paired World PvP and inherited regressions
        working-directory: server
        run: |
          for test in spk.local.R79OfflinePairedPvpOwnershipTest spk.local.PlayerPvpAttackerWorldOwnershipFenceTest spk.local.PlayerPvpTargetWorldOwnershipFenceTest spk.local.PlayerPvpLifecycleIntegrationTest spk.local.PlayerCombatOutcomeProducerTest spk.local.R78OfflineVerifiedCombatOutcomeTest spk.local.LocalLabPvmKillOutcomeProducerTest spk.local.CombatOutcomeObserverGroupTest spk.event.DomainEventBusTest spk.event.DomainEventPublicApiBoundaryTest spk.local.R77OfflineDomainPublicationQuiescenceTest spk.local.R77OfflineEventProducerSourceAuditTest spk.local.R76OfflineWorldTickOwnedEventTest spk.local.R75OfflineRealtimePetIngressTest spk.local.R75OfflineDecodedPacketQuiescenceTest spk.local.R74OfflineIngressAndShutdownTest spk.local.R73OfflineFinalLogoutDrainTest spk.local.R72OfflineTerminalAndDurableOrderTest spk.local.R71OfflineSnapshotCaptureOrderTest spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-paired-pvp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R79 real paired World PvP and inherited regressions
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R79OfflinePairedPvpOwnershipTest',
            'spk.local.PlayerPvpAttackerWorldOwnershipFenceTest',
            'spk.local.PlayerPvpTargetWorldOwnershipFenceTest',
            'spk.local.PlayerPvpLifecycleIntegrationTest',
            'spk.local.PlayerCombatOutcomeProducerTest',
            'spk.local.R78OfflineVerifiedCombatOutcomeTest',
            'spk.local.LocalLabPvmKillOutcomeProducerTest',
            'spk.local.CombatOutcomeObserverGroupTest',
            'spk.event.DomainEventBusTest',
            'spk.event.DomainEventPublicApiBoundaryTest',
            'spk.local.R77OfflineDomainPublicationQuiescenceTest',
            'spk.local.R77OfflineEventProducerSourceAuditTest',
            'spk.local.R76OfflineWorldTickOwnedEventTest',
            'spk.local.R75OfflineRealtimePetIngressTest',
            'spk.local.R75OfflineDecodedPacketQuiescenceTest',
            'spk.local.R74OfflineIngressAndShutdownTest',
            'spk.local.R73OfflineFinalLogoutDrainTest',
            'spk.local.R72OfflineTerminalAndDurableOrderTest',
            'spk.local.R71OfflineSnapshotCaptureOrderTest',
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
