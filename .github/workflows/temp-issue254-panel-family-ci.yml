name: TEMP Issue 254 Panel Family Reliability CI

on:
  pull_request:
    branches:
      - test/devpanel-socket-readiness-chat2
    paths:
      - 'server/src/spk/local/EngineR82ResearchPanelSocketTest.java'
      - 'server/src/spk/local/EngineR83DiscoveryPanelSocketTest.java'
      - 'server/src/spk/local/EngineR84ApplicationPanelSocketTest.java'
      - 'server/src/spk/local/EngineR8ResearchPanelSocketTest.java'
      - '.github/workflows/temp-issue254-panel-family-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Stress research and application panel sockets
        shell: pwsh
        run: |
          $tests = @(
            'EngineR82ResearchPanelSocketTest',
            'EngineR83DiscoveryPanelSocketTest',
            'EngineR84ApplicationPanelSocketTest',
            'EngineR8ResearchPanelSocketTest'
          )

          foreach ($test in $tests) {
            for ($i = 1; $i -le 10; $i++) {
              & java -cp server/build/classes "spk.local.$test"
              if ($LASTEXITCODE -ne 0) {
                throw "$test failed iteration=$i exit=$LASTEXITCODE"
              }
            }
          }

          Write-Host "ISSUE254_PANEL_FAMILY_STRESS_PASS tests=$($tests.Count) iterationsEach=10"

      - name: Run parent dev-panel guard
        shell: pwsh
        run: |
          & java -cp server/build/classes spk.local.EngineR7DevPanelSocketTest
          if ($LASTEXITCODE -ne 0) {
            throw "EngineR7DevPanelSocketTest failed exit=$LASTEXITCODE"
          }

          Write-Host "ISSUE254_PARENT_DEVPANEL_PASS tests=1"
