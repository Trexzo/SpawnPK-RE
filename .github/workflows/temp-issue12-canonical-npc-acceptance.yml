name: Temporary Issue 12 canonical NPC acceptance validation

on:
  push:
    branches:
      - test/issue-12-canonical-npc-acceptance

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run canonical viewer lifecycle acceptance regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CanonicalNpcViewerLifecycleAcceptanceTest
      - name: Run canonical HOME ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldHomeNpcOwnershipTest
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
      - name: Run world presentation bus regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR32WorldPresentationBusTest
