name: Chat1 Post200 Gradle Validation

on:
  push:
    branches:
      - integration/post200-gradle-chat1

jobs:
  linux-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle build and Java 11 bytecode verification
        run: bash server/gradlew --no-daemon clean build

  windows-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: PowerShell build wrapper
        shell: pwsh
        run: ./server/build.ps1
      - name: Verify canonical 179-test manifest preserved
        shell: pwsh
        run: |
          $raw = Get-Content ./RUN_V5185_FULL_SELFTEST.ps1 -Raw
          $m = [regex]::Match($raw, '(?s)\$tests=@\((.*?)\)\s*\$cpParts=')
          if (-not $m.Success) { throw 'Could not parse canonical test manifest' }
          $count = [regex]::Matches($m.Groups[1].Value, "'([A-Za-z0-9_]+Test)'").Count
          if ($count -ne 179) { throw "Expected 179 tests, found $count" }
          Write-Host "POST200_GRADLE_MANIFEST_PASS count=$count"
