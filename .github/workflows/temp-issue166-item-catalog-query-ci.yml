name: temp-issue166-item-catalog-query-ci

on:
  push:
    branches:
      - refactor/issue-166-item-catalog-query

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Item catalog query service
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.ItemCatalogQueryServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited catalog/application regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ItemCatalogTest',
            'spk.local.ApplicationUiServiceTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
