name: R76 Offline World Tick and Owned Event Quiescence

on:
  push:
    branches:
      - playability/r76-offline-world-tick-owned-event-fence-20261115
  pull_request:
    paths:
      - server/src/spk/local/WorldPulse.java
      - server/src/spk/local/WorldEventQueue.java
      - server/src/spk/local/R76OfflineWorldTickAndEventFence.java
      - server/src/spk/local/R76OfflineWorldTickOwnedEventTest.java
      - .github/workflows/r76-offline-world-tick-owned-events.yml

jobs:
  linux-tick-owned-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java 11-compatible server and tests
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R76 WorldPulse and inherited persistence safety checks
        working-directory: server
        run: |
          for test in spk.local.R76OfflineWorldTickOwnedEventTest spk.local.R75OfflineRealtimePetIngressTest spk.local.R75OfflineDecodedPacketQuiescenceTest spk.local.R74OfflineIngressAndShutdownTest spk.local.R73OfflineFinalLogoutDrainTest spk.local.R72OfflineTerminalAndDurableOrderTest spk.local.R71OfflineSnapshotCaptureOrderTest spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-tick-owned-events:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java 11-compatible server and tests
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R76 WorldPulse and inherited persistence safety checks
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R76OfflineWorldTickOwnedEventTest',
            'spk.local.R75OfflineRealtimePetIngressTest',
            'spk.local.R75OfflineDecodedPacketQuiescenceTest',
            'spk.local.R74OfflineIngressAndShutdownTest',
            'spk.local.R73OfflineFinalLogoutDrainTest',
            'spk.local.R72OfflineTerminalAndDurableOrderTest',
            'spk.local.R71OfflineSnapshotCaptureOrderTest',
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
