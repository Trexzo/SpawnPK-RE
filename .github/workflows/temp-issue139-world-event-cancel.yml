name: Temporary Issue 139 world event cancellation validation

on:
  push:
    branches:
      - fix/issue-139-world-event-cancel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build all current sources
        shell: pwsh
        run: |
          javac -version
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "server/build.ps1 failed: $LASTEXITCODE" }

      - name: Run scheduler and world regressions
        shell: pwsh
        run: |
          $jar = Join-Path $PWD 'server\build\SpawnPKLocalServer.jar'
          $tests = @(
            'WorldEventQueueCancellationTest',
            'WorldPulseCommandExecutionTest',
            'SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host ("[ISSUE-139] {0}" -f $test)
            & java -cp $jar ("spk.local." + $test)
            if ($LASTEXITCODE -ne 0) { throw "$test failed: $LASTEXITCODE" }
          }

      - name: Verify Java 11 bytecode target
        shell: pwsh
        run: |
          $jar = Join-Path $PWD 'server\build\SpawnPKLocalServer.jar'
          $line = (& javap -verbose -classpath $jar spk.local.WorldEventQueue |
            Select-String 'major version:' | Select-Object -First 1).Line
          Write-Host $line
          if ($line -notmatch 'major version:\s+55') { throw "Expected Java 11 class major 55." }

      - name: Record external pinned-client limitation
        shell: pwsh
        run: |
          $candidates = @(
            'evidence\client(6).jar',
            'evidence\client(4).jar',
            'evidence\client.jar',
            'client.jar'
          )
          $present = @($candidates | Where-Object { Test-Path -LiteralPath $_ })
          if ($present.Count -ne 0) { throw "Unexpected pinned client material in GitHub checkout: $($present -join ', ')" }
          Write-Host 'PINNED_CLIENT_ABSENT_EXPECTED: inherited 179/179 LocalLab gate not executed in GitHub.'
