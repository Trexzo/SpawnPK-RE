name: TEMP Issue 228 Item Library Reliability CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/EngineR5ItemLibrarySocketTest.java'
      - '.github/workflows/temp-issue228-item-library-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Stress item library socket regression
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            & java -cp server/build/classes spk.local.EngineR5ItemLibrarySocketTest
            if ($LASTEXITCODE -ne 0) {
              throw "EngineR5ItemLibrarySocketTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }
          Write-Host "ISSUE228_ITEM_LIBRARY_STRESS_PASS iterations=20"

      - name: Run related item-library regressions
        shell: pwsh
        run: |
          $tests = @(
            'EngineR5NativeItemLibraryTest',
            'ItemCatalogTest',
            'EngineR5ItemAuthorityTest'
          )

          foreach ($test in $tests) {
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE228_RELATED_ITEM_LIBRARY_PASS tests=$($tests.Count)"
