name: R70 Offline Coordinated Persistence Commit

on:
  push:
    branches:
      - playability/r70-offline-coordinated-io-commit-20261115
  pull_request:
    paths:
      - server/src/spk/local/R70OfflineCoordinatedPersistenceAdmission.java
      - server/src/spk/local/R70OfflineCoordinatedIoCommitTest.java
      - server/src/spk/local/WorldPlayerPersistence.java
      - .github/workflows/r70-offline-coordinated-io-commit.yml

jobs:
  linux-coordinated-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java 11-compatible server and test classes
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: Run real IO commit and inherited stale-owner fences
        working-directory: server
        run: |
          for test in spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-coordinated-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java 11-compatible server and test classes
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real IO commit and inherited stale-owner fences
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
