name: TEMP Issue 320 Checkpoint Shutdown CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/WorldPlayerPersistence.java'
      - 'server/src/spk/local/WorldPlayerPersistenceCheckpointShutdownTest.java'
      - '.github/workflows/temp-issue320-checkpoint-shutdown-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress active checkpoint shutdown
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 2; $i++) {
            & java -cp $cp spk.local.WorldPlayerPersistenceCheckpointShutdownTest
            if ($LASTEXITCODE -ne 0) {
              throw "WorldPlayerPersistenceCheckpointShutdownTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE320_CHECKPOINT_SHUTDOWN_STRESS_PASS iterations=2"

      - name: Run persistence shutdown guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'WorldPlayerPersistenceUninterruptibleShutdownTest',
            'WorldPlayerPersistenceShutdownTest',
            'WorldAutosaveCheckpointTest',
            'WorldPersistenceThreadingTest',
            'PlayerRepositoryFoundationTest',
            'LocalAccountProfilesTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE320_PERSISTENCE_GUARDS_PASS tests=$($tests.Count)"
