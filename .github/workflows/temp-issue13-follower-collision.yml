name: Temporary Issue 13 follower collision validation

on:
  push:
    branches:
      - refactor/issue-13-follower-collision-routing

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run follower collision routing regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.FollowerCollisionRoutingTest
      - name: Run pet broken trail recovery regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetBrokenTrailRecoveryTest
      - name: Run pet catchup cadence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetCatchupCadenceTest
      - name: Run pet catchup scheduler continuity regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetCatchupSchedulerContinuityTest
      - name: Run pet route replacement regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetRouteReplacementTest
      - name: Run mini pet follow speed regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.MiniPetFollowSpeedTest
      - name: Run authoritative HOME movement regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeAuthoritativeMovementCollisionTest
      - name: Run interaction approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.InteractionApproachResolverTest
