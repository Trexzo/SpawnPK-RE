name: TEMP Issue 375 Prayer Magic Spell Readiness CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/PrayerMagicStyleRuntimeIntegrationTest.java'
      - '.github/workflows/temp-issue375-prayer-magic-readiness-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress prayer/magic post-spell readiness
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 15; $i++) {
            & java -cp $cp spk.local.PrayerMagicStyleRuntimeIntegrationTest
            if ($LASTEXITCODE -ne 0) {
              throw "PrayerMagicStyleRuntimeIntegrationTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE375_PRAYER_MAGIC_READINESS_STRESS_PASS iterations=15"

      - name: Run prayer/spell guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'
          $tests = @(
            'spk.local.LocalSpellTargetHandlerTest',
            'spk.local.SpellTargetCodecTest',
            'spk.local.LocalPrayerMagicCommandHandlerTest',
            'spk.local.PrayerMagicCombatRuntimeTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE375_PRAYER_MAGIC_GUARDS_PASS tests=4"
