name: Issue 9 temporary validation

on:
  push:
    branches:
      - pipeline/issue-9-custom-asset-definitions
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical build
        shell: pwsh
        run: ./server/build.ps1
      - name: Focused Issue 9 regressions
        shell: pwsh
        run: |
          $jar = 'server/build/SpawnPKLocalServer.jar'
          java -cp $jar spk.local.CustomAssetManifestRepositoryTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $jar spk.local.PetDefinitionRepositoryTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $jar spk.local.VoidglassR3CustomContentTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $jar spk.local.EquipmentSlotOverrideDataTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Packaged resource and cleanup contract
        shell: pwsh
        run: |
          $listing = & jar tf server/build/SpawnPKLocalServer.jar
          foreach ($required in @('spk/local/custom_asset_manifest.tsv','spk/local/custom_pet_mappings.tsv','spk/local/equipment_slot_overrides.tsv')) {
            if ($listing -notcontains $required) { throw "missing packaged resource: $required" }
          }
          if (Test-Path 'server/src/spk/local/data/custom_voidglass_r2/PROFILE.txt') { throw 'retired R2 profile still tracked' }
          if (Test-Path 'server/src/spk/local/data/custom_voidglass_r2/SERVER_RESOURCE_ROWS.tsv') { throw 'retired R2 resource rows still tracked' }
          $src = Get-Content 'server/src/spk/local/VoidglassR3CustomContent.java' -Raw
          if ($src -match 'getDeclaredField|setAccessible|java\.lang\.reflect|WeakHashMap') { throw 'Voidglass reflection bypass still present' }
          Write-Host 'ISSUE9_PIPELINE_CONTRACT_PASS'
