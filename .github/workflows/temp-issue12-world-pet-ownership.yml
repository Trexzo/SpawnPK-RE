name: Temporary Issue 12 world pet ownership validation

on:
  push:
    branches:
      - refactor/issue-12-world-pet-ownership

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run canonical pet ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldPetNpcOwnershipTest
      - name: Run mini-pet subsystem regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.MiniPetSubsystemTest
      - name: Run pet replacement runtime regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetReplacementRuntimeTest
      - name: Run pet runtime integration regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetRuntimeIntegrationTest
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
