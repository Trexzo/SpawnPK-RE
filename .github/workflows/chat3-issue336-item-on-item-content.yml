name: Chat3 Issue336 Item On Item Content
# PR-observable retrigger

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/content/api/ContentItemOnItemContext.java'
      - 'server/src/spk/content/api/ContentItemOnItemHandler.java'
      - 'server/src/spk/content/api/ContentRegistrar.java'
      - 'server/src/spk/local/ContentItemOnItemRegistrationTest.java'
      - 'server/src/spk/local/ContentProvenanceAuthorityBoundaryTest.java'
      - 'server/src/spk/local/ContentPublicApiBoundaryTest.java'
      - 'server/src/spk/local/ContentRegistry.java'
      - '.github/workflows/chat3-issue336-item-on-item-content.yml'

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run item-on-item content guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\server\gradlew.bat --no-daemon clean jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { throw 'Gradle compile failed' }

          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'

          & java -cp $cp spk.local.ContentItemOnItemRegistrationTest
          if ($LASTEXITCODE -ne 0) { throw 'ContentItemOnItemRegistrationTest failed' }

          & java -cp $cp spk.local.ContentPublicApiBoundaryTest
          if ($LASTEXITCODE -ne 0) { throw 'ContentPublicApiBoundaryTest failed' }

          & java -cp $cp spk.local.ContentProvenanceAuthorityBoundaryTest
          if ($LASTEXITCODE -ne 0) { throw 'ContentProvenanceAuthorityBoundaryTest failed' }

          Write-Host 'CHAT3_ISSUE336_ITEM_ON_ITEM_PASS tests=3'
