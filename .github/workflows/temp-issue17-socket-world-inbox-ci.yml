name: temp-issue17-socket-world-inbox-ci

on:
  push:
    branches:
      - test/issue-17-socket-world-inbox-boundary-chat2
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: |
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Issue 17 socket to World inbox acceptance
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.TypedRequestWorldInboxSocketTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.SharedWorldSocketIntegrationTest',
            'spk.local.ClientPacketProbeTest',
            'spk.local.ClientPacketFramingAuthorityTest',
            'spk.local.LocalPendingRequestDispatcherTest',
            'spk.local.ClientMovementRequestQueueTest',
            'spk.local.GenericInteractionTypedRequestGoldenVectorTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server\build\classes $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
