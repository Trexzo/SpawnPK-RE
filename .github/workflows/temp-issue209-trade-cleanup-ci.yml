name: TEMP Issue 209 Trade State Cleanup CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/TradeService.java'
      - 'server/src/spk/local/TradeServiceWorldStateCleanupTest.java'
      - '.github/workflows/temp-issue209-trade-cleanup-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Run trade lifecycle regressions
        shell: pwsh
        run: |
          $tests = @(
            'TradeServiceWorldStateCleanupTest',
            'EngineR4TradeFlowTest',
            'EngineR41TradePresentationStateTest',
            'LocalSessionRuntimeBindingsTest',
            'EngineR41TradeApproachSocketTest'
          )

          foreach ($test in $tests) {
            Write-Host "RUN $test"
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE209_TRADE_STATE_CLEANUP_CI_PASS tests=$($tests.Count)"
