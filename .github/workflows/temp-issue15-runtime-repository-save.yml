name: Temporary Issue 15 runtime repository save validation

on:
  push:
    branches:
      - refactor/issue-15-runtime-save-repository

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run runtime repository save regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.RuntimeRepositorySaveTest
      - name: Run repository foundation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerRepositoryFoundationTest
      - name: Run legacy account persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.AccountPersistenceTest
      - name: Run dual profile persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.LocalAccountProfilesTest
      - name: Run player lifecycle regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerLifecycleServiceTest
