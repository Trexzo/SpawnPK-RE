name: temp-issue135-player-registry-ci

on:
  push:
    branches:
      - fix/issue-135-player-registry-identity

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Registry identity regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.PlayerRegistryIdentityValidationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited world lifecycle regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.WorldCommandLifecycleFenceTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.SharedWorldSocketIntegrationTest',
            'spk.local.PlayerLifecycleServiceTest',
            'spk.local.CanonicalNpcViewerLifecycleAcceptanceTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
