name: temp-issue10-launcher-ci

on:
  push:
    branches:
      - fix/issue-10-launchers

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Launcher contract regression
        shell: pwsh
        run: |
          & .\scripts\Test-LauncherContract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build throwaway airgap smoke JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\local-client -Force | Out-Null
          @'
          public final class LauncherSmoke {
              public static void main(String[] args) {
                  System.out.println("AIRGAP_DUMMY_JAR_PASS");
              }
          }
          '@ | Set-Content -LiteralPath .\LauncherSmoke.java -Encoding UTF8
          javac .\LauncherSmoke.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jar --create --file .\local-client\client-airgap.jar --main-class LauncherSmoke .\LauncherSmoke.class
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise standalone airgap launcher
        shell: pwsh
        run: |
          $output = & .\RUN_CLIENT_AIRGAP.ps1 *>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch 'LOCALLAB_JAVA_OK') { throw 'Canonical Java selector did not run.' }
          if ($output -notmatch 'AIRGAP_DUMMY_JAR_PASS') { throw 'Selected Java did not execute the expected airgap JAR.' }

      - name: Root runtime artifact guard
        shell: pwsh
        run: |
          $pollution = @(Get-ChildItem -LiteralPath . -File -Force | Where-Object {
              $_.Extension -in @('.log','.lock','.pid')
          })
          if ($pollution.Count -gt 0) {
              $pollution | Format-Table Name,Length,LastWriteTime
              throw 'Launcher validation created runtime log/lock/pid artifacts in repository root.'
          }
          Write-Host 'ROOT_RUNTIME_ARTIFACT_GUARD_PASS'
