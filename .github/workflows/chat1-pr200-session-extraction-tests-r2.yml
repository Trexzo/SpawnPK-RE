name: Chat1 PR200 Session Extraction Test Alignment R2

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Extracted-owner regression batch
        shell: pwsh
        run: |
          $tests = @(
            "spk.local.RuntimeCorrectiveIntegrationTest",
            "spk.local.VoidglassRuntimeIntegrationTest",
            "spk.local.PetAccessoryContractTest",
            "spk.local.ScoobyFourWayLocalExtensionTest",
            "spk.local.PetPickupTimingContractTest",
            "spk.local.PetAccessoryDialogTest",
            "spk.local.DialogNumberKeyStateTest",
            "spk.local.PetPickupSynchronousRemovalTest",
            "spk.local.EngineR6RegionProjectionTest",
            "spk.local.EngineR81PetPickupFreezeTest",
            "spk.local.LocalMovementRequestHandlerTest",
            "spk.local.LocalPendingRequestDispatcherTest",
            "spk.local.LocalPetDropPickupHandlerTest",
            "spk.local.LocalRegionStreamHandlerTest"
          )
          foreach ($test in $tests) {
            Write-Host "RUN $test"
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
