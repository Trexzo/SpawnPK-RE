name: TEMP Issue 225 Trade Approach Reliability CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/EngineR41TradeApproachSocketTest.java'
      - '.github/workflows/temp-issue225-trade-approach-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Stress trade approach socket regression
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            & java -cp server/build/classes spk.local.EngineR41TradeApproachSocketTest
            if ($LASTEXITCODE -ne 0) {
              throw "EngineR41TradeApproachSocketTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }
          Write-Host "ISSUE225_TRADE_APPROACH_STRESS_PASS iterations=20"

      - name: Run related trade regressions
        shell: pwsh
        run: |
          $tests = @(
            'EngineR4TradeFlowTest',
            'EngineR41TradePresentationStateTest',
            'EngineR4TradeSocketOpenTest'
          )

          foreach ($test in $tests) {
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE225_RELATED_TRADE_PASS tests=$($tests.Count)"
