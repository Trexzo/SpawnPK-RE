name: Chat1 Launcher Contract Validation

on:
  push:
    branches:
      - integration/issue10-launchers-chat1

jobs:
  windows-launcher-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Parse edited launcher scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'RUN_ALL_LOCAL_LAB.ps1',
            'RUN_CLIENT_AIRGAP.ps1',
            'scripts/Test-LauncherContract.ps1'
          )
          foreach ($file in $files) {
            $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $file))
            Write-Host "POWERSHELL_PARSE_PASS $file"
          }
      - name: Launcher contract regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-LauncherContract.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Launcher contract regression failed: exit=$LASTEXITCODE"
          }
          Write-Host "CHAT1_LAUNCHER_CONTRACT_PASS"
