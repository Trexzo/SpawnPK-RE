name: Temporary Issue 12 canonical relay fixture validation

on:
  push:
    branches:
      - refactor/issue-12-remove-reflection-npc-fixtures

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
      - name: Run world presentation bus regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR32WorldPresentationBusTest
      - name: Run canonical HOME ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldHomeNpcOwnershipTest
      - name: Run canonical mask routing regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldNpcCanonicalMaskRoutingTest
      - name: Run canonical pet mutation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldPetNpcMutationAuthorityTest
