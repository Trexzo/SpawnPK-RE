jobs:
  linux-projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R108 lexical plugin mutability source audit
        working-directory: server
        run: |
          python3 ./tools/audit_plugin_mutability_surface.py --self-test

      - name: R110 exact-current inbound route source fence
        working-directory: server
        run: |
          python3 ./tools/audit_item_on_player_inbound_route.py

      - name: R110 real opcode14 inbound route boundary and read-only preflight
        working-directory: server
        run: |
          java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' spk.local.R110OfflineItemOnPlayerPreflightTest

  windows-projections:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R108 lexical plugin mutability source audit
        shell: pwsh
        working-directory: server
        run: |
          & python ./tools/audit_plugin_mutability_surface.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R110 exact-current inbound route source fence
        shell: pwsh
        working-directory: server
        run: |
          & python ./tools/audit_item_on_player_inbound_route.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R110 real opcode14 inbound route boundary and read-only preflight
        shell: pwsh
        working-directory: server
        run: |
          $cp='build/SpawnPKLocalServer.jar;build/classes/java/test'
          & java -cp $cp spk.local.R110OfflineItemOnPlayerPreflightTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
