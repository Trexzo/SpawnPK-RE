name: Chat4 R7-R11 Blender fixtures

on:
  push:
    branches:
      - research/chat4-r7-blender-rig-fixture

permissions:
  contents: read

jobs:
  blender-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and checksum official Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          base='https://download.blender.org/release/Blender4.5'
          curl -fsSLO "$base/blender-4.5.14.sha256"
          curl -fsSLO "$base/blender-4.5.14-linux-x64.tar.xz"
          grep 'blender-4.5.14-linux-x64.tar.xz' blender-4.5.14.sha256 | sha256sum -c -
          sha256sum blender-4.5.14-linux-x64.tar.xz | tee blender-fixture-binary-sha256.txt
          tar -xf blender-4.5.14-linux-x64.tar.xz

      - name: Execute R7 rigid-object fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-output
          export R7_OUT="$PWD/r7-output"
          ./blender-4.5.14-linux-x64/blender --background --factory-startup \
            --python tools/research/chat4_r7_blender_fixture.py 2>&1 | tee r7-output/blender-run.log
          grep -F 'R7_BLENDER_RUNTIME_EXECUTED_PASS' r7-output/blender-run.log
          grep -F 'R7_BLENDER_NATIVE_KEYFRAMES_PASS' r7-output/blender-run.log
          grep -F 'R7_BLENDER_AXIS_CONTRACT_EMIT_PASS' r7-output/blender-run.log
          grep -F 'R7_BLENDER_RIG_V1_EXPORT_PASS' r7-output/blender-run.log
          cp blender-fixture-binary-sha256.txt r7-output/

      - name: Execute R8 two-bone armature fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8-output
          export R8_OUT="$PWD/r8-output"
          ./blender-4.5.14-linux-x64/blender --background --factory-startup \
            --python tools/research/chat4_r8_blender_armature_fixture.py 2>&1 | tee r8-output/blender-run.log
          grep -F 'R8_BLENDER_ARMATURE_RUNTIME_PASS' r8-output/blender-run.log
          grep -F 'R8_BLENDER_TWO_BONE_RIG_PASS' r8-output/blender-run.log
          grep -F 'R8_BLENDER_POSE_KEYFRAMES_PASS' r8-output/blender-run.log
          grep -F 'R8_BLENDER_ARMATURE_RIG_V1_EXPORT_PASS' r8-output/blender-run.log
          grep -F 'R8_BLENDER_ARMATURE_AXIS_CONTRACT_PASS' r8-output/blender-run.log
          cp blender-fixture-binary-sha256.txt r8-output/

      - name: Execute R9 parent-child hierarchy bake fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-output
          export R9_OUT="$PWD/r9-output"
          ./blender-4.5.14-linux-x64/blender --background --factory-startup \
            --python tools/research/chat4_r9_blender_hierarchy_fixture.py 2>&1 | tee r9-output/blender-run.log
          grep -F 'R9_BLENDER_HIERARCHY_RUNTIME_PASS' r9-output/blender-run.log
          grep -F 'R9_BLENDER_PARENT_CHILD_PASS' r9-output/blender-run.log
          grep -F 'R9_HIERARCHY_GLOBAL_DELTA_BAKE_PASS' r9-output/blender-run.log
          grep -F 'R9_HIERARCHY_NO_SHEAR_GUARD_PASS' r9-output/blender-run.log
          grep -F 'R9_BLENDER_HIERARCHY_RIG_V1_EXPORT_PASS' r9-output/blender-run.log
          cp blender-fixture-binary-sha256.txt r9-output/

      - name: Execute R10 full Blender authoring fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r10-output
          export R10_OUT="$PWD/r10-output"
          ./blender-4.5.14-linux-x64/blender --background --factory-startup \
            --python tools/research/chat4_r10_blender_full_authoring_fixture.py 2>&1 | tee r10-output/blender-run.log
          grep -F 'R10_BLENDER_RUNTIME_PASS' r10-output/blender-run.log
          grep -F 'R10_BLENDER_MESH_SKIN_EXPORT_PASS' r10-output/blender-run.log
          grep -F 'R10_BLENDER_HIERARCHY_BAKE_REUSE_PASS' r10-output/blender-run.log
          grep -F 'R10_BLENDER_FULL_AUTHORING_EXPORT_PASS' r10-output/blender-run.log
          cp blender-fixture-binary-sha256.txt r10-output/

      - name: Execute R11 Blender UV + skin + hierarchy fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r11-output
          export R11_OUT="$PWD/r11-output"
          ./blender-4.5.14-linux-x64/blender --background --factory-startup \
            --python tools/research/chat4_r11_blender_uv_skin_fixture.py 2>&1 | tee r11-output/blender-run.log
          grep -F 'R11_BLENDER_UV_RUNTIME_PASS' r11-output/blender-run.log
          grep -F 'R11_BLENDER_UV_LAYER_PASS' r11-output/blender-run.log
          grep -F 'R11_BLENDER_UV_SKIN_EXPORT_PASS' r11-output/blender-run.log
          grep -F 'R11_BLENDER_MATERIAL_BINDING_PASS' r11-output/blender-run.log
          grep -F 'R11_BLENDER_HIERARCHY_UV_RIG_V1_EXPORT_PASS' r11-output/blender-run.log
          cp blender-fixture-binary-sha256.txt r11-output/

      - name: Upload R7 authored fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat4-r7-blender-fixture
          path: r7-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload R8 armature fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat4-r8-blender-armature-fixture
          path: r8-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload R9 hierarchy fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat4-r9-blender-hierarchy-fixture
          path: r9-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload R10 full authoring fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat4-r10-blender-full-authoring-fixture
          path: r10-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload R11 Blender UV skin hierarchy fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat4-r11-blender-uv-skin-hierarchy-fixture
          path: r11-output/
          if-no-files-found: error
          retention-days: 7
