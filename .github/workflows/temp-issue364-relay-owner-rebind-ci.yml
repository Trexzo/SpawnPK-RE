name: TEMP Issue 364 Relay Owner Rebind CI

on:
  pull_request:
    branches:
      - fix/issue-357-relay-replacement-cleanup-chat2
    paths:
      - 'server/src/spk/local/Player81WorldSync.java'
      - 'server/src/spk/local/SharedNpcWorldRelay.java'
      - 'server/src/spk/local/RelayOwnerWriterRebindCleanupTest.java'
      - '.github/workflows/temp-issue364-relay-owner-rebind-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress relay owner/writer rebind cleanup
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 10; $i++) {
            & java -cp $cp spk.local.RelayOwnerWriterRebindCleanupTest
            if ($LASTEXITCODE -ne 0) {
              throw "RelayOwnerWriterRebindCleanupTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE364_RELAY_OWNER_REBIND_STRESS_PASS iterations=10"

      - name: Run stacked relay guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'RelayWriterReplacementCleanupTest',
            'Player81OwnerStatePruneTest',
            'Player81WorldStateCleanupTest',
            'EngineR31SharedNpcRelayTest',
            'LocalSessionRuntimeBindingsTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE364_STACKED_RELAY_GUARDS_PASS tests=$($tests.Count)"
