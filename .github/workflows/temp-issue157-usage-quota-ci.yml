name: temp-issue157-usage-quota-ci

on:
  push:
    branches:
      - refactor/issue-157-semantic-usage-quota

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Usage quota foundation
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.UsageQuotaFoundationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited application/world regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ApplicationUiServiceTest',
            'spk.local.WorldPulseCommandExecutionTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
