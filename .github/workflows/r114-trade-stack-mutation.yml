name: R114 Trade Stack Mutation
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/r114-trade-stack-mutation.yml'
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Linux
        if: runner.os == 'Linux'
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: server
        run: .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
      - name: Regressions
        shell: bash
        working-directory: server
        run: |
          set -e
          sep=:
          if [ "$RUNNER_OS" = Windows ]; then sep=';'; fi
          cp="build/SpawnPKLocalServer.jar${sep}build/classes/java/test"
          python tools/audit_r113_stack_references.py
          python tools/audit_r112_inventory_epoch_write_surface.py
          java -cp "$cp" spk.local.R55TradePublicationRollbackTest
          java -cp "$cp" spk.local.R112OfflineInventoryEpochAuditTest
