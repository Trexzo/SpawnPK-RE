name: TEMP Issue 225 Baseline Probe

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/EngineR41TradeApproachSocketTest.java'
      - '.github/workflows/temp-issue225-baseline-probe.yml'

jobs:
  baseline:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore untouched #16 test source
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin refactor/issue-16-npc-option-registry
          if ($LASTEXITCODE -ne 0) { throw "BASELINE_FETCH_FAILED" }

          git show FETCH_HEAD:server/src/spk/local/EngineR41TradeApproachSocketTest.java |
            Set-Content -LiteralPath server/src/spk/local/EngineR41TradeApproachSocketTest.java -Encoding utf8

          if ($LASTEXITCODE -ne 0) { throw "BASELINE_RESTORE_FAILED" }

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build restored baseline
        shell: pwsh
        run: ./server/build.ps1

      - name: Run untouched baseline five times
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            & java -cp server/build/classes spk.local.EngineR41TradeApproachSocketTest
            if ($LASTEXITCODE -ne 0) {
              throw "BASELINE EngineR41TradeApproachSocketTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }
          Write-Host "ISSUE225_BASELINE_PROBE_PASS iterations=5"
