name: Chat4 Make-over Mage Validation

on:
  push:
    branches:
      - feature/makeover-mage-character-design-chat4

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile all sources and verify Java 11 bytecode
        shell: bash
        run: |
          set -euo pipefail
          cd server
          chmod +x gradlew
          ./gradlew --no-daemon clean jar testClasses verifyJava11Bytecode

      - name: Run focused Make-over Mage regressions
        shell: bash
        run: |
          set -euo pipefail
          cd server
          CP="build/classes/java/main:build/classes/java/test:build/resources/main"
          java -cp "$CP" spk.local.CharacterDesignProfileTest
          java -cp "$CP" spk.local.CharacterDesignRequestTest
          java -cp "$CP" spk.local.MakeoverAppearancePersistenceTest
          java -cp "$CP" spk.local.MakeoverAppearancePacket81Test
          echo MAKEOVER_FOCUSED_REGRESSION_PASS

      - name: Run repository Gradle checks
        shell: bash
        run: |
          set -euo pipefail
          cd server
          ./gradlew --no-daemon check
