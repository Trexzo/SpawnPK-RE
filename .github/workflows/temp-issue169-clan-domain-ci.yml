name: Temp Issue 169 Clan Domain CI

on:
  pull_request:

jobs:
  issue169:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 169 focused regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.ClanDomainFoundationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clan domain protocol-boundary guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/ClanAggregate.java",
            "server/src/spk/local/ClanRepository.java",
            "server/src/spk/local/ClanWarDefinition.java",
            "server/src/spk/local/ClanWarChallenge.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ServerPacketWriter|ClientPacket|ApplicationBus|spriteId|sceneIndex" -CaseSensitive:$false
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "Issue 169 domain source contains protocol/presentation identity."
          }
          Write-Host "ISSUE169_PROTOCOL_BOUNDARY_PASS"
