name: Chat1 Regression Reliability Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/chat1-regression-reliability-validation.yml'

jobs:
  merge-result-regression-reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile current merge result
        run: bash server/gradlew --no-daemon clean jar testClasses verifyJava11Bytecode

      - name: Run focused reliability tests on current merge result
        run: |
          set -euo pipefail
          CP='server/build/SpawnPKLocalServer.jar:server/build/classes/java/test'
          tests=(
            WorldCommandLatencyTest
            EngineR3DualSocketVisibilityTest
            EngineR41TradeApproachSocketTest
            EngineR5ItemLibrarySocketTest
            EngineR6RegionSocketCommandTest
            EngineR6WorldCollisionAuthorityTest
            LocalRegionStreamHandlerTest
            LocalRegionDevCommandHandlerTest
          )
          for t in "${tests[@]}"; do
            echo "[MERGE-RESULT] $t"
            java -cp "$CP" "spk.local.$t"
          done
          echo "CHAT1_REGRESSION_RELIABILITY_MERGE_RESULT_PASS tests=${#tests[@]}"
