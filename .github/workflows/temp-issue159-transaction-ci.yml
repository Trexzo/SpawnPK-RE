name: Temp Issue 159 Transaction Escrow CI

on:
  pull_request:
    branches: [ main ]

jobs:
  issue159:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 159 focused regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.AtomicTransactionServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protocol-independent source guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/EscrowAsset.java",
            "server/src/spk/local/AtomicTransactionService.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ServerPacketWriter|ClientPacket|ApplicationBus" -CaseSensitive:$false
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "Issue 159 domain source contains protocol/presentation identity."
          }
          Write-Host "ISSUE159_PROTOCOL_BOUNDARY_PASS"
