name: TEMP Issue 217 Command Latency Reliability CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/WorldCommandLatencyTest.java'
      - '.github/workflows/temp-issue217-command-latency-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Stress WorldCommandLatencyTest
        shell: pwsh
        run: |
          for ($i = 1; $i -le 100; $i++) {
            & java -cp server/build/classes spk.local.WorldCommandLatencyTest
            if ($LASTEXITCODE -ne 0) {
              throw "WorldCommandLatencyTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }
          Write-Host "ISSUE217_LATENCY_STRESS_PASS iterations=100"

      - name: Run related command regressions
        shell: pwsh
        run: |
          $tests = @(
            'WorldPulseCommandExecutionTest',
            'WorldCommandFairnessTest',
            'WorldCommandLifecycleFenceTest'
          )

          foreach ($test in $tests) {
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE217_RELATED_COMMANDS_PASS tests=$($tests.Count)"
