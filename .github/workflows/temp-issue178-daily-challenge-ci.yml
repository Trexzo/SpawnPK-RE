name: temp-issue178-daily-challenge-ci

on:
  push:
    branches:
      - refactor/issue-178-daily-challenge-assignment

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Objective foundation regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.ObjectiveProgressFoundationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Daily Challenge assignment regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.DailyChallengeAssignmentServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited application regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.ApplicationUiServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
