name: TEMP Integration Roadmap 11-16

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1
  workflow_dispatch:

jobs:
  windows-jdk21-cumulative:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "server/build.ps1 failed rc=$LASTEXITCODE" }

      - name: Cumulative Roadmap 11-16 focused regression gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $jar = ".\server\build\SpawnPKLocalServer.jar"
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) {
            throw "Missing built server JAR: $jar"
          }

          $tests = @(
            "HandshakeIntegrationTest",
            "SharedWorldOwnershipTest",
            "WorldPulseCommandExecutionTest",
            "SharedWorldSocketIntegrationTest",
            "CacheCrossRegionRoutingAcceptanceTest",
            "CanonicalHomeNpcMaskRelayTest",
            "CanonicalNpcViewerLifecycleAcceptanceTest",
            "CanonicalPetMutationAuthorityTest",
            "CanonicalRemotePetProjectionTest",
            "CollisionStepAuthorityCompatibilityTest",
            "CombatDamageRulesSeparationTest",
            "CombatPresentationAdapterTest",
            "CombatSystemHooksTest",
            "CombatTargetValidityTest",
            "CombatTimingHitSchedulerTest",
            "ContentRegistryTest",
            "CosmeticDedicatedSlotTest",
            "DialogCloseOnMovementTest",
            "EngineR31SharedNpcRelayTest",
            "EngineR32WorldPresentationBusTest",
            "EngineR6WorldCollisionAuthorityTest",
            "EngineR81SceneStreamingTest",
            "FollowerCollisionRoutingTest",
            "HomeAuthoritativeMovementCollisionTest",
            "InteractionApproachResolverTest",
            "LocalBankObjectInteractionHandlerTest",
            "LocalBankRequestHandlerTest",
            "LocalCombatCommandHandlerTest",
            "LocalCommandDispatcherTest",
            "LocalCompCapeCustomizeHandlerTest",
            "LocalCompColorsCommandHandlerTest",
            "LocalCosmeticCommandHandlerTest",
            "LocalDevEntityCommandHandlersTest",
            "LocalDevPanelAmountHandlerTest",
            "LocalDevPanelCoordinatorTest",
            "LocalDevPanelRendererTest",
            "LocalDevPanelWidgetHandlerTest",
            "LocalDevPetCommandHandlerTest",
            "LocalDevSessionCommandHandlerTest",
            "LocalDevToolCommandHandlerTest",
            "LocalDevWorldCommandHandlerTest",
            "LocalDiagnosticCommandHandlerTest",
            "LocalEquipmentItemActionHandlerTest",
            "LocalGameplayWidgetHandlerTest",
            "LocalGenericInteractionHandlerTest",
            "LocalGroundItemInteractionHandlerTest",
            "LocalItemOnItemHandlerTest",
            "LocalItemOnNpcHandlerTest",
            "LocalItemSpawnCommandHandlerTest",
            "LocalMiniPetCommandHandlerTest",
            "LocalMovementRequestHandlerTest",
            "LocalNurseCommandHandlerTest",
            "LocalPendingRequestDispatcherTest",
            "LocalPetCompatibilityCommandHandlerTest",
            "LocalPetDropPickupHandlerTest",
            "LocalPetInventoryDialogHandlerTest",
            "LocalPetRealtimeSchedulerTest",
            "LocalPetRuntimeCommandHandlerTest",
            "LocalPlayerInteractionHandlerTest",
            "LocalPrayerMagicCommandHandlerTest",
            "LocalRegionDevCommandHandlerTest",
            "LocalRegionStreamHandlerTest",
            "LocalRoutedNpcInteractionHandlerTest",
            "LocalSessionBootstrapPublisherTest",
            "LocalSessionPlayerInitializerTest",
            "LocalSessionRuntimeBindingsTest",
            "LocalSessionUiActionHandlerTest",
            "LocalSpellTargetHandlerTest",
            "LocalVoidglassCommandHandlerTest",
            "LocalWorldTickCoordinatorTest",
            "NormalInventoryDragEquipTest",
            "NpcOptionContentRegistryParityTest",
            "NpcViewIndexMapTest",
            "NurseContentRegistryParityTest",
            "ObjectOptionContentRegistryParityTest",
            "PlayerInteractionRouteFinderTest",
            "PlayerLifecycleServiceTest",
            "PlayerPvpLifecycleIntegrationTest",
            "PlayerRepositoryFoundationTest",
            "PlayerSnapshotMigrationTest",
            "PlayerSnapshotSchemaExtractionTest",
            "PlayerStatusServiceTest",
            "PositionPersistenceR213Test",
            "RouteFinderCompatibilityTest",
            "RuntimeRepositoryLoadTest",
            "RuntimeRepositorySaveTest",
            "V58StatePersistenceTest",
            "WorldAutosaveCheckpointTest",
            "WorldHomeNpcOwnershipTest",
            "WorldNpcPresentationEventsTest",
            "WorldNpcRegistryTest",
            "WorldPersistenceThreadingTest",
            "WorldPetNpcOwnershipTest",
            "WorldPlayerCombatStateOwnershipTest"
          )

          $count = 0
          foreach ($test in $tests) {
            Write-Host ("[INTEGRATION] {0}/{1} {2}" -f ($count + 1), $tests.Count, $test)
            & java -cp $jar ("spk.local." + $test)
            if ($LASTEXITCODE -ne 0) {
              throw "Integration regression failed: $test rc=$LASTEXITCODE"
            }
            $count++
          }

          Write-Host ("ROADMAP_11_16_INTEGRATION_PASS tests={0}" -f $count) -ForegroundColor Green
