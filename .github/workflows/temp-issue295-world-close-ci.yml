name: TEMP Issue 295 World Close Queue Fence CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/World.java'
      - 'server/src/spk/local/WorldEventQueue.java'
      - 'server/src/spk/local/WorldRealtimeQueue.java'
      - 'server/src/spk/local/WorldCloseScheduledWorkFenceTest.java'
      - '.github/workflows/temp-issue295-world-close-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress World close scheduled-work fence
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 10; $i++) {
            & java -cp $cp spk.local.WorldCloseScheduledWorkFenceTest
            if ($LASTEXITCODE -ne 0) {
              throw "WorldCloseScheduledWorkFenceTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE295_WORLD_CLOSE_STRESS_PASS iterations=10"

      - name: Run World lifecycle guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'WorldEventQueueCancellationTest',
            'WorldRealtimeQueueLifecycleFenceTest',
            'WorldCommandShutdownFenceTest',
            'WorldCommandLifecycleFenceTest',
            'WorldPulseCommandExecutionTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE295_WORLD_LIFECYCLE_GUARDS_PASS tests=$($tests.Count)"
