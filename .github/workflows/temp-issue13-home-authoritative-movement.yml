name: Temporary Issue 13 authoritative HOME movement validation

on:
  push:
    branches:
      - refactor/issue-13-home-authoritative-movement

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run authoritative HOME movement collision regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeAuthoritativeMovementCollisionTest
      - name: Run collision authority regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CollisionStepAuthorityCompatibilityTest
      - name: Run movement runtime regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.MovementRuntimeIntegrationTest
      - name: Run HOME collision path regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeCombatCollisionPathTest
      - name: Run combat server-owned approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatServerOwnedApproachTest
      - name: Run world collision authority regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR6WorldCollisionAuthorityTest
      - name: Run dialogue close-on-movement regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.DialogCloseOnMovementTest
