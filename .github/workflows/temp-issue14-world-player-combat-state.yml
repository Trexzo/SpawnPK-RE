name: Temporary Issue 14 WorldPlayer combat-state validation

on:
  push:
    branches:
      - refactor/issue-14-world-player-combat-state

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run canonical combat-state ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldPlayerCombatStateOwnershipTest
      - name: Run combat server-owned approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatServerOwnedApproachTest
      - name: Run RouteFinder compatibility regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.RouteFinderCompatibilityTest
      - name: Run movement runtime regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.MovementRuntimeIntegrationTest
