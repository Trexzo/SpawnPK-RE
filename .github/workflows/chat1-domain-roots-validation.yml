name: Chat1 Domain Foundation Roots Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/chat1-domain-roots-validation.yml'

jobs:
  focused-domain-roots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile current merge result
        run: bash server/gradlew --no-daemon clean jar testClasses verifyJava11Bytecode

      - name: Run focused domain foundation regressions
        run: |
          set -euo pipefail
          CP='server/build/SpawnPKLocalServer.jar:server/build/classes/java/test'
          tests=(
            SemanticTimedEffectFoundationTest
            ObjectiveProgressFoundationTest
            UsageQuotaFoundationTest
            MailboxRewardDeliveryFoundationTest
            ItemCatalogQueryServiceTest
          )
          for t in "${tests[@]}"; do
            echo "[DOMAIN-ROOT] $t"
            java -cp "$CP" "spk.local.$t"
          done
          echo "CHAT1_DOMAIN_FOUNDATION_ROOTS_PASS tests=${#tests[@]}"
