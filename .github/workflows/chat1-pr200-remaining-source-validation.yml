name: Chat1 PR200 Remaining Source Validation

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Collision and R5.1 stale-contract regressions
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.CombatMovementIntentTest
          if ($LASTEXITCODE -ne 0) { throw "CombatMovementIntentTest failed" }
          java -cp server/build/SpawnPKLocalServer.jar spk.local.EngineR51V913TrajectorySoundTest
          if ($LASTEXITCODE -ne 0) { throw "EngineR51V913TrajectorySoundTest failed" }
      - name: Item library socket focused reruns
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "ITEM_LIBRARY_SOCKET_ATTEMPT $_"
            java -cp server/build/SpawnPKLocalServer.jar spk.local.EngineR5ItemLibrarySocketTest
            if ($LASTEXITCODE -ne 0) { throw "EngineR5ItemLibrarySocketTest failed attempt=$_" }
          }
