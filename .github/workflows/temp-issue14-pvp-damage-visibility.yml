name: Temporary Issue 14 PvP damage visibility validation

on:
  push:
    branches:
      - refactor/issue-14-pvp-damage-visibility

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run PvP damage visibility regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerCombatDamageVisibilityTest
      - name: Run combat target validity regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatTargetValidityTest
      - name: Run player lifecycle regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerLifecycleServiceTest
      - name: Run combat ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldPlayerCombatStateOwnershipTest
      - name: Run combat system hooks regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatSystemHooksTest
      - name: Run combat presentation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatPresentationAdapterTest
