name: TEMP Issue 380 World Close Terminal Wait CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/World.java'
      - 'server/src/spk/local/WorldConcurrentCloseTerminalWaitTest.java'
      - '.github/workflows/temp-issue380-world-close-terminal-wait-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress concurrent World close terminal wait
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 10; $i++) {
            & java -cp $cp spk.local.WorldConcurrentCloseTerminalWaitTest
            if ($LASTEXITCODE -ne 0) {
              throw "WorldConcurrentCloseTerminalWaitTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE380_WORLD_CLOSE_TERMINAL_WAIT_STRESS_PASS iterations=10"

      - name: Run World lifecycle guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'WorldCloseScheduledWorkFenceTest',
            'WorldPulseCloseTailFenceTest',
            'WorldAdmissionCloseFenceTest',
            'WorldPlayerPersistenceUninterruptibleShutdownTest',
            'WorldPlayerPersistenceCheckpointShutdownTest',
            'WorldCommandShutdownFenceTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE380_WORLD_LIFECYCLE_GUARDS_PASS tests=$($tests.Count)"
