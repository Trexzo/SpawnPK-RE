name: TEMP Issue361 Container Cache Boundary CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/ContentPublicApiBoundaryTest.java'
      - 'server/src/spk/event/DomainEventPublicApiBoundaryTest.java'
      - '.github/workflows/temp-issue361-container-cache-boundary-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and verify Java 11 bytecode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\server\gradlew.bat --no-daemon clean jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { throw 'Gradle compile/bytecode verification failed' }

      - name: Run API boundary guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/classes/java/main;server/build/classes/java/test;server/build/resources/main'
          $tests = @(
            'spk.local.ContentPublicApiBoundaryTest',
            'spk.local.ContentProvenanceAuthorityBoundaryTest',
            'spk.event.DomainEventPublicApiBoundaryTest',
            'spk.event.DomainEventBusTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed exit=$LASTEXITCODE" }
          }

          Write-Host 'CHAT3_ISSUE361_CONTAINER_CACHE_BOUNDARY_PASS tests=4'
