name: TEMP Issue 353 Public Slot Boundary CI

on:
  push:
    branches:
      - test/issue-353-public-slot-boundary-chat3
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/ContentPublicApiBoundaryTest.java'
      - 'server/src/spk/event/DomainEventPublicApiBoundaryTest.java'
      - '.github/workflows/temp-issue353-public-slot-boundary-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and run API boundary guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\server\gradlew.bat --no-daemon clean jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { throw 'Gradle compile/bytecode verification failed' }

          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          $tests = @(
            'spk.local.ContentPublicApiBoundaryTest',
            'spk.local.ContentProvenanceAuthorityBoundaryTest',
            'spk.event.DomainEventPublicApiBoundaryTest',
            'spk.event.DomainEventBusTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed exit=$LASTEXITCODE" }
          }

          Write-Host 'CHAT3_ISSUE353_PUBLIC_SLOT_BOUNDARY_PASS tests=4'
