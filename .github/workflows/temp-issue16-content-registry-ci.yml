name: temp-issue16-content-registry-ci

on:
  push:
    branches:
      - refactor/issue-16-content-registry-foundation

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: |
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focused content registry regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ContentRegistryTest',
            'spk.local.NurseContentRegistryParityTest',
            'spk.local.LocalNurseCommandHandlerTest',
            'spk.local.LocalCommandDispatcherTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.WorldPersistenceThreadingTest',
            'spk.local.PlayerSnapshotMigrationTest',
            'spk.local.SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server\build\classes $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
