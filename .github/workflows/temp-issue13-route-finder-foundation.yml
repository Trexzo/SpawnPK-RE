name: Temporary Issue 13 RouteFinder foundation validation

on:
  push:
    branches:
      - refactor/issue-13-route-finder-foundation

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run RouteFinder compatibility regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.RouteFinderCompatibilityTest
      - name: Run HOME collision path regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeCombatCollisionPathTest
      - name: Run combat server-owned approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatServerOwnedApproachTest
      - name: Run movement runtime regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.MovementRuntimeIntegrationTest
