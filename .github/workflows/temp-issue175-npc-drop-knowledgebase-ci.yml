name: Temp Issue 175 NPC Drop Knowledgebase CI

on:
  pull_request:

jobs:
  issue175:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 175 focused regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.NpcDropKnowledgebaseQueryTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Query protocol-boundary guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/NpcCatalogQueryService.java",
            "server/src/spk/local/DropTableCatalogQueryService.java",
            "server/src/spk/local/KnowledgebaseQueryService.java",
            "server/src/spk/local/QueryPage.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ServerPacketWriter|ClientPacket|ApplicationBus|spriteId|cacheOffset|cacheIndex|rawDefinition" -CaseSensitive:$false
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "Issue 175 query source contains protocol/raw-cache identity."
          }
          Write-Host "ISSUE175_PROTOCOL_BOUNDARY_PASS"
