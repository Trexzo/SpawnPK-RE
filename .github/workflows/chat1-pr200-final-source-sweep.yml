name: Chat1 PR200 Final Source-Only Sweep

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1

jobs:
  sweep:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Source-only tests 31-179 excluding pinned-client classes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $raw = Get-Content ./RUN_V5185_FULL_SELFTEST.ps1 -Raw
          $m = [regex]::Match($raw, '(?s)\$tests=@\((.*?)\)\s*\$cp=')
          if (-not $m.Success) { throw "Could not parse canonical test list" }

          $all = @(
            [regex]::Matches($m.Groups[1].Value, "'([^']+)'") |
            ForEach-Object { $_.Groups[1].Value }
          )
          $start = [Array]::IndexOf($all, "HomeWorldV55IntegrationTest")
          if ($start -lt 0) { throw "HomeWorldV55IntegrationTest not found" }

          $skip = @{
            "EquipmentMultiSlotRuntimeIntegrationTest" = "requires exact pinned client rs.Client/rs.a.k/rs.x.e for packet81 appearance parse"
            "SpawnTabClientParityTest" = "requires exact pinned client class rs.x.e"
            "PlayerStateClientParityTest" = "requires exact pinned client class rs.x.e"
          }

          $tests = @($all[$start..($all.Count-1)] | Where-Object { -not $skip.ContainsKey($_) })
          foreach ($name in $skip.Keys) {
            Write-Host "SOURCE_SWEEP_SKIP test=$name reason=$($skip[$name])"
          }

          $pass=0
          $fail=0
          $timeout=0

          foreach ($t in $tests) {
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName="java"
            $psi.Arguments="-cp `"server/build/SpawnPKLocalServer.jar`" spk.local.$t"
            $psi.WorkingDirectory=$PWD.Path
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true

            $proc=New-Object System.Diagnostics.Process
            $proc.StartInfo=$psi

            if(-not $proc.Start()){
              Write-Host "SOURCE_SWEEP_FAIL test=$t reason=START_FAILED"
              $fail++
              continue
            }

            $outTask=$proc.StandardOutput.ReadToEndAsync()
            $errTask=$proc.StandardError.ReadToEndAsync()

            if(-not $proc.WaitForExit(90000)){
              try{$proc.Kill()}catch{}
              try{[void]$proc.WaitForExit(5000)}catch{}
              Write-Host "SOURCE_SWEEP_TIMEOUT test=$t"
              $timeout++
              $proc.Dispose()
              continue
            }

            $stdout=$outTask.Result
            $stderr=$errTask.Result
            $rc=$proc.ExitCode
            $proc.Dispose()

            if($rc -eq 0){
              $last=@($stdout -split "`r?`n" | Where-Object { $_ }) | Select-Object -Last 1
              Write-Host "SOURCE_SWEEP_PASS test=$t marker=$last"
              $pass++
            } else {
              Write-Host "SOURCE_SWEEP_FAIL test=$t rc=$rc"
              @(($stdout -split "`r?`n");($stderr -split "`r?`n")) |
                Where-Object { $_ } |
                Select-Object -Last 12 |
                ForEach-Object { Write-Host "  $_" }
              $fail++
            }
          }

          Write-Host "SOURCE_SWEEP_SUMMARY total=$($tests.Count) pass=$pass fail=$fail timeout=$timeout skipped=$($skip.Count)"
          if($fail -ne 0 -or $timeout -ne 0){
            throw "Source-only sweep failed: pass=$pass fail=$fail timeout=$timeout"
          }
