name: R66 Offline Stale Gameplay Event Dispatch

on:
  push:
    branches:
      - playability/r66-offline-stale-game-event-dispatch-20261115
  pull_request:
    paths:
      - server/src/spk/local/R64OfflineSessionOwnership.java
      - server/src/spk/local/R66OfflineGameEventDispatch.java
      - server/src/spk/local/R66OfflineGameEventDispatchTest.java
      - .github/workflows/r66-stale-game-event-dispatch.yml

jobs:
  linux-stale-game-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile server and verify Java 11-compatible bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: Verify queued stale gameplay events and prior persistence safety
        working-directory: server
        run: |
          for test in spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.R62TradePairCompletionCertificateTest spk.local.R61TradePairReplayTest spk.local.R60TradePairCoordinatorTest spk.local.R59TradePairIntentIndexTest spk.local.R58TradePairLoginPreflightTest spk.local.R57TradePairJournalReviewTest spk.local.R56TradeSplitSaveRestartEvidenceTest spk.local.R55TradePublicationRollbackTest spk.local.AccountCrashLeaseRecoveryTest spk.local.EngineR4TradeFlowTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-stale-game-events:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile server and verify Java 11-compatible bytecode
        working-directory: server
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify queued stale gameplay events and prior persistence safety
        working-directory: server
        shell: pwsh
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.R62TradePairCompletionCertificateTest',
            'spk.local.R61TradePairReplayTest',
            'spk.local.R60TradePairCoordinatorTest',
            'spk.local.R59TradePairIntentIndexTest',
            'spk.local.R58TradePairLoginPreflightTest',
            'spk.local.R57TradePairJournalReviewTest',
            'spk.local.R56TradeSplitSaveRestartEvidenceTest',
            'spk.local.R55TradePublicationRollbackTest',
            'spk.local.AccountCrashLeaseRecoveryTest',
            'spk.local.EngineR4TradeFlowTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
