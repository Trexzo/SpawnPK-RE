name: Temporary Issue 12 canonical NPC projection validation

on:
  push:
    branches:
      - refactor/issue-12-canonical-npc-projection-identity

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run canonical HOME mask relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CanonicalHomeNpcMaskRelayTest
      - name: Run canonical HOME ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldHomeNpcOwnershipTest
      - name: Run canonical pet ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldPetNpcOwnershipTest
      - name: Run canonical remote pet projection regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CanonicalRemotePetProjectionTest
      - name: Run World NPC presentation event regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldNpcPresentationEventsTest
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
      - name: Run world presentation bus regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR32WorldPresentationBusTest
