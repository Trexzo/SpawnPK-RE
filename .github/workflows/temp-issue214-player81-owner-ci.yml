name: TEMP Issue 214 Player81 Owner Cleanup CI

on:
  pull_request:
    branches:
      - fix/issue-212-player81-worldstate-cleanup
    paths:
      - 'server/src/spk/local/Player81WorldSync.java'
      - 'server/src/spk/local/Player81OwnerStatePruneTest.java'
      - '.github/workflows/temp-issue214-player81-owner-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Run deterministic Player81 owner-state regressions
        shell: pwsh
        run: |
          $tests = @(
            'Player81OwnerStatePruneTest',
            'Player81WorldStateCleanupTest',
            'LocalSessionRuntimeBindingsTest',
            'EngineR3PlayerSyncTest',
            'SharedWorldSocketIntegrationTest',
            'PlayerPresentationIsolationTest'
          )

          foreach ($test in $tests) {
            Write-Host "RUN $test"
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE214_PLAYER81_OWNER_CI_PASS tests=$($tests.Count)"
