name: TEMP Issue 205 World Command Shutdown CI

on:
  pull_request:
    branches:
      - refactor/issue-16-npc-option-registry
    paths:
      - 'server/src/spk/local/WorldCommandInbox.java'
      - 'server/src/spk/local/World.java'
      - 'server/src/spk/local/WorldCommandShutdownFenceTest.java'
      - '.github/workflows/temp-issue205-command-shutdown-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: ./server/build.ps1

      - name: Run deterministic command lifecycle regressions
        shell: pwsh
        run: |
          $tests = @(
            'WorldCommandShutdownFenceTest',
            'WorldCommandLifecycleFenceTest',
            'WorldCommandFairnessTest',
            'WorldPulseCommandExecutionTest',
            'WorldPersistenceThreadingTest',
            'WorldAutosaveCheckpointTest',
            'SharedWorldSocketIntegrationTest'
          )

          foreach ($test in $tests) {
            Write-Host "RUN $test"
            & java -cp server/build/classes "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host "ISSUE205_COMMAND_SHUTDOWN_CI_PASS tests=$($tests.Count)"
