name: R75 Offline Realtime Pet and Decoded Request Quiescence

on:
  push:
    branches:
      - playability/r75-offline-realtime-pet-ingress-20261115
  pull_request:
    paths:
      - server/src/spk/local/WorldRealtimeQueue.java
      - server/src/spk/local/WorldPetNpcService.java
      - server/src/spk/local/R75OfflineCrossIngressFence.java
      - server/src/spk/local/R75OfflineRealtimePetIngressTest.java
      - server/src/spk/local/R75OfflineDecodedPacketQuiescenceTest.java
      - server/src/spk/local/LocalPendingRequestDispatcherTest.java
      - .github/workflows/r75-offline-cross-ingress-quiescence.yml

jobs:
  linux-cross-ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R75 callback routes plus inherited R63-R74 regression
        working-directory: server
        run: |
          for test in spk.local.R75OfflineRealtimePetIngressTest spk.local.R75OfflineDecodedPacketQuiescenceTest spk.local.R74OfflineIngressAndShutdownTest spk.local.R73OfflineFinalLogoutDrainTest spk.local.R72OfflineTerminalAndDurableOrderTest spk.local.R71OfflineSnapshotCaptureOrderTest spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-cross-ingress:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R75 callback routes plus inherited R63-R74 regression
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R75OfflineRealtimePetIngressTest',
            'spk.local.R75OfflineDecodedPacketQuiescenceTest',
            'spk.local.R74OfflineIngressAndShutdownTest',
            'spk.local.R73OfflineFinalLogoutDrainTest',
            'spk.local.R72OfflineTerminalAndDurableOrderTest',
            'spk.local.R71OfflineSnapshotCaptureOrderTest',
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
