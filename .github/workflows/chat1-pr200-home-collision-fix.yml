name: Chat1 PR200 HOME Collision Fixture Fix

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: HOME collision and movement regression cluster
        shell: pwsh
        run: |
          $tests = @(
            "spk.local.HomeWorldV55IntegrationTest",
            "spk.local.HomeAuthoritativeMovementCollisionTest",
            "spk.local.CollisionStepAuthorityCompatibilityTest",
            "spk.local.HomeCombatCollisionPathTest",
            "spk.local.FollowerCollisionRoutingTest",
            "spk.local.MovementRuntimeIntegrationTest",
            "spk.local.CombatServerOwnedApproachTest",
            "spk.local.EngineR6WorldCollisionAuthorityTest",
            "spk.local.DialogCloseOnMovementTest",
            "spk.local.CombatEngineM1Test"
          )
          foreach ($test in $tests) {
            Write-Host "RUN $test"
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
