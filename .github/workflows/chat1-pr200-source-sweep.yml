name: Chat1 PR200 Source-Only Regression Sweep

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1

jobs:
  sweep:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Sweep tests 31-179 without external pinned client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw = Get-Content ./RUN_V5185_FULL_SELFTEST.ps1 -Raw
          $m = [regex]::Match($raw, '(?s)\$tests=@\((.*?)\)\s*\$cp=')
          if (-not $m.Success) { throw "Could not parse test list" }

          $tests = @(
            [regex]::Matches($m.Groups[1].Value, "'([^']+)'") |
            ForEach-Object { $_.Groups[1].Value }
          )

          $start = [Array]::IndexOf($tests, "HomeWorldV55IntegrationTest")
          if ($start -lt 0) { throw "HomeWorldV55IntegrationTest not found" }

          $tests = @($tests[$start..($tests.Count - 1)])

          $pass = 0
          $fail = 0
          $timeout = 0

          foreach ($t in $tests) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = "java"
            $psi.Arguments = "-cp `"server/build/SpawnPKLocalServer.jar`" spk.local.$t"
            $psi.WorkingDirectory = $PWD.Path
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true

            $p = New-Object System.Diagnostics.Process
            $p.StartInfo = $psi

            if (-not $p.Start()) {
              Write-Host "SWEEP_FAIL test=$t reason=START_FAILED"
              $fail++
              continue
            }

            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()

            if (-not $p.WaitForExit(60000)) {
              try { $p.Kill() } catch {}
              try { [void]$p.WaitForExit(5000) } catch {}
              Write-Host "SWEEP_TIMEOUT test=$t"
              $timeout++
              $p.Dispose()
              continue
            }

            $stdout = $outTask.Result
            $stderr = $errTask.Result
            $rc = $p.ExitCode
            $p.Dispose()

            if ($rc -eq 0) {
              $last = @($stdout -split "`r?`n" | Where-Object { $_ }) | Select-Object -Last 1
              Write-Host "SWEEP_PASS test=$t marker=$last"
              $pass++
            }
            else {
              Write-Host "SWEEP_FAIL test=$t rc=$rc"
              @(
                ($stdout -split "`r?`n")
                ($stderr -split "`r?`n")
              ) | Where-Object { $_ } | Select-Object -Last 8 | ForEach-Object {
                Write-Host "  $_"
              }
              $fail++
            }
          }

          Write-Host "SWEEP_SUMMARY total=$($tests.Count) pass=$pass fail=$fail timeout=$timeout"
