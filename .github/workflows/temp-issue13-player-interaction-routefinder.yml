name: Temporary Issue 13 player interaction routing validation

on:
  push:
    branches:
      - refactor/issue-13-player-interaction-routefinder

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run player interaction RouteFinder regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerInteractionRouteFinderTest
      - name: Run PvP lifecycle integration regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerPvpLifecycleIntegrationTest
      - name: Run interaction approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.InteractionApproachResolverTest
      - name: Run RouteFinder compatibility regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.RouteFinderCompatibilityTest
      - name: Run authoritative HOME movement regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeAuthoritativeMovementCollisionTest
      - name: Run combat target validity regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatTargetValidityTest
