name: Chat3 Issue329 Domain Event Boundary
# PR-observable retrigger

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/event/DomainEventPublicApiBoundaryTest.java'
      - '.github/workflows/chat3-issue329-domain-event-boundary.yml'

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run event API guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\server\gradlew.bat --no-daemon clean jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { throw 'Gradle compile failed' }

          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'

          & java -cp $cp spk.event.DomainEventPublicApiBoundaryTest
          if ($LASTEXITCODE -ne 0) { throw 'DomainEventPublicApiBoundaryTest failed' }

          & java -cp $cp spk.event.DomainEventBusTest
          if ($LASTEXITCODE -ne 0) { throw 'DomainEventBusTest failed' }

          & java -cp $cp spk.local.DomainEventBusWorldContextTest
          if ($LASTEXITCODE -ne 0) { throw 'DomainEventBusWorldContextTest failed' }

          Write-Host 'CHAT3_ISSUE329_DOMAIN_EVENT_BOUNDARY_PASS tests=3'
