name: temp-issue17-ground-item-ci

on:
  push:
    branches:
      - refactor/issue-17-ground-item-request-queue-chat2

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build server
        shell: pwsh
        run: |
          & .\server\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focused typed ground-item regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ClientGroundItemRequestQueueTest',
            'spk.local.EngineR1ClientDecodeTest',
            'spk.local.ClientPacketProbeTest',
            'spk.local.ClientPacketFramingAuthorityTest',
            'spk.local.LocalPendingRequestDispatcherTest',
            'spk.local.LocalGroundItemInteractionHandlerTest',
            'spk.local.GroundItemSemanticTest',
            'spk.local.R85GenericC2SBridgeGoldenVectorTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server\build\classes $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
