name: Temporary Issue 12 World NPC event validation

on:
  push:
    branches:
      - refactor/issue-12-world-npc-presentation-events

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run World NPC presentation event regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldNpcPresentationEventsTest
      - name: Run canonical remote pet projection regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CanonicalRemotePetProjectionTest
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
      - name: Run world presentation bus regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR32WorldPresentationBusTest
      - name: Run shared world ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.SharedWorldOwnershipTest
