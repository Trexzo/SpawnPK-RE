name: Chat1 Post236 Issue169 Validation

on:
  push:
    branches:
      - integration/post236-issue169-clan-chat1

jobs:
  issue169:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle-backed Windows server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 169 focused regression
        shell: pwsh
        run: |
          $cp = "server/build/classes/java/main;server/build/classes/java/test;server/src"
          java -cp $cp spk.local.ClanDomainFoundationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Issue 169 protocol boundary guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/ClanAggregate.java",
            "server/src/spk/local/ClanEvidenceAuthority.java",
            "server/src/spk/local/ClanRepository.java",
            "server/src/spk/local/ClanWarChallenge.java",
            "server/src/spk/local/ClanWarDefinition.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ClientPacket|ServerPacket|spriteId|sceneIndex" -CaseSensitive:$false
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; throw "Issue 169 protocol boundary violation." }
          Write-Host "ISSUE169_POST236_PROTOCOL_BOUNDARY_PASS"
