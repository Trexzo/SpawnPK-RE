name: R78 Offline Verified PvM Combat Outcomes

on:
  push:
    branches:
      - playability/r78-offline-verified-combat-outcome-20261115
  pull_request:
    paths:
      - server/src/spk/local/LocalLabPvmKillOutcomeProducer.java
      - server/src/spk/local/R78OfflineVerifiedCombatFactBridge.java
      - server/src/spk/local/R78OfflineVerifiedCombatOutcomeTest.java
      - .github/workflows/r78-offline-verified-pvm-combat-outcomes.yml

jobs:
  linux-verified-combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build server and check Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R78 source-exact combat publisher and inherited safety suites
        working-directory: server
        run: |
          for test in spk.local.R78OfflineVerifiedCombatOutcomeTest spk.local.LocalLabPvmKillOutcomeProducerTest spk.local.CombatOutcomeObserverGroupTest spk.local.PlayerCombatOutcomeProducerTest spk.local.CombatOutcomeObjectiveIntegrationTest spk.local.CombatOutcomeCollectionLogObserverTest spk.local.CombatOutcomeMatchObserverTest spk.local.R77OfflineDomainPublicationQuiescenceTest spk.local.R77OfflineEventProducerSourceAuditTest spk.event.DomainEventBusTest spk.event.DomainEventPublicApiBoundaryTest spk.local.DomainEventBusWorldContextTest spk.local.R76OfflineWorldTickOwnedEventTest spk.local.R75OfflineRealtimePetIngressTest spk.local.R75OfflineDecodedPacketQuiescenceTest spk.local.R74OfflineIngressAndShutdownTest spk.local.R73OfflineFinalLogoutDrainTest spk.local.R72OfflineTerminalAndDurableOrderTest spk.local.R71OfflineSnapshotCaptureOrderTest spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-verified-combat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build server and check Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R78 source-exact combat publisher and inherited safety suites
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R78OfflineVerifiedCombatOutcomeTest',
            'spk.local.LocalLabPvmKillOutcomeProducerTest',
            'spk.local.CombatOutcomeObserverGroupTest',
            'spk.local.PlayerCombatOutcomeProducerTest',
            'spk.local.CombatOutcomeObjectiveIntegrationTest',
            'spk.local.CombatOutcomeCollectionLogObserverTest',
            'spk.local.CombatOutcomeMatchObserverTest',
            'spk.local.R77OfflineDomainPublicationQuiescenceTest',
            'spk.local.R77OfflineEventProducerSourceAuditTest',
            'spk.event.DomainEventBusTest',
            'spk.event.DomainEventPublicApiBoundaryTest',
            'spk.local.DomainEventBusWorldContextTest',
            'spk.local.R76OfflineWorldTickOwnedEventTest',
            'spk.local.R75OfflineRealtimePetIngressTest',
            'spk.local.R75OfflineDecodedPacketQuiescenceTest',
            'spk.local.R74OfflineIngressAndShutdownTest',
            'spk.local.R73OfflineFinalLogoutDrainTest',
            'spk.local.R72OfflineTerminalAndDurableOrderTest',
            'spk.local.R71OfflineSnapshotCaptureOrderTest',
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
