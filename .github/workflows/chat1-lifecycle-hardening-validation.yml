name: Chat1 Lifecycle Hardening Validation

on:
  push:
    branches:
      - integration/post252-lifecycle-hardening-chat1

jobs:
  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle-backed canonical build
        shell: pwsh
        run: ./server/build.ps1
      - name: Lifecycle cumulative regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          $tests = @(
            'WorldCommandShutdownFenceTest',
            'WorldCommandLifecycleFenceTest',
            'WorldCommandFairnessTest',
            'WorldPulseCommandExecutionTest',
            'WorldPersistenceThreadingTest',
            'WorldAutosaveCheckpointTest',
            'SharedWorldSocketIntegrationTest',
            'TradeServiceWorldStateCleanupTest',
            'EngineR4TradeFlowTest',
            'EngineR41TradePresentationStateTest',
            'LocalSessionRuntimeBindingsTest',
            'Player81WorldStateCleanupTest',
            'Player81OwnerStatePruneTest',
            'EngineR3PlayerSyncTest',
            'PlayerPresentationIsolationTest'
          )
          foreach ($t in $tests) {
            Write-Host "[LIFECYCLE] $t"
            & java -cp $cp "spk.local.$t"
            if ($LASTEXITCODE -ne 0) { throw "Lifecycle regression failed: $t" }
          }
          Write-Host "POST252_LIFECYCLE_HARDENING_PASS tests=$($tests.Count)"
