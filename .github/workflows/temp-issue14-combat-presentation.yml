name: Temporary Issue 14 combat presentation validation

on:
  push:
    branches:
      - refactor/issue-14-combat-presentation-adapter

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run combat presentation adapter regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatPresentationAdapterTest
      - name: Run combat timing and hit scheduler regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatTimingHitSchedulerTest
      - name: Run combat target validity regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatTargetValidityTest
      - name: Run combat damage separation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatDamageRulesSeparationTest
      - name: Run combat approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatServerOwnedApproachTest
