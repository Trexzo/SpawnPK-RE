name: R64 Offline Session Ownership Fence

on:
  push:
    branches:
      - playability/r64-offline-session-ownership-fence-20261115
  pull_request:
    paths:
      - server/src/spk/local/R63AccountSaveAdmission.java
      - server/src/spk/local/R64OfflineSessionOwnership.java
      - server/src/spk/local/R64OfflineSessionOwnershipTest.java
      - .github/workflows/r64-offline-session-ownership.yml

jobs:
  linux-session-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java 11-compatible server and test classes
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: Verify cross-JVM session takeover and inherited crash gates
        working-directory: server
        run: |
          for test in spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.R62TradePairCompletionCertificateTest spk.local.R61TradePairReplayTest spk.local.R60TradePairCoordinatorTest spk.local.R59TradePairIntentIndexTest spk.local.R58TradePairLoginPreflightTest spk.local.R57TradePairJournalReviewTest spk.local.R56TradeSplitSaveRestartEvidenceTest spk.local.R55TradePublicationRollbackTest spk.local.AccountCrashLeaseRecoveryTest spk.local.EngineR4TradeFlowTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-session-fence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java 11-compatible server and test classes
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify cross-JVM session takeover and inherited crash gates
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.R62TradePairCompletionCertificateTest',
            'spk.local.R61TradePairReplayTest',
            'spk.local.R60TradePairCoordinatorTest',
            'spk.local.R59TradePairIntentIndexTest',
            'spk.local.R58TradePairLoginPreflightTest',
            'spk.local.R57TradePairJournalReviewTest',
            'spk.local.R56TradeSplitSaveRestartEvidenceTest',
            'spk.local.R55TradePublicationRollbackTest',
            'spk.local.AccountCrashLeaseRecoveryTest',
            'spk.local.EngineR4TradeFlowTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
