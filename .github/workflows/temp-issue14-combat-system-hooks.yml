name: Temporary Issue 14 combat system hooks validation

on:
  push:
    branches:
      - refactor/issue-14-combat-system-hooks

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run combat system hook regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatSystemHooksTest
      - name: Run combat presentation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatPresentationAdapterTest
      - name: Run combat timing regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatTimingHitSchedulerTest
      - name: Run damage separation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatDamageRulesSeparationTest
      - name: Run player status regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerStatusServiceTest
