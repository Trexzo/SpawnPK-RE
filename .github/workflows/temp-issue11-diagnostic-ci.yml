name: Temporary issue 11 diagnostic slice validation

on:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile current R8.5 source tree
        shell: pwsh
        run: ./server/build.ps1

      - name: Run diagnostic command boundary test
        shell: pwsh
        run: java -cp server/build/SpawnPKLocalServer.jar spk.local.LocalDiagnosticCommandHandlerTest
