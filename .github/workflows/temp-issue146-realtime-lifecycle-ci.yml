name: temp-issue146-realtime-lifecycle-ci

on:
  push:
    branches:
      - fix/issue-146-realtime-lifecycle-fence

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Realtime lifecycle regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.WorldRealtimeQueueLifecycleFenceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inherited realtime/world regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.LocalPetRealtimeSchedulerTest',
            'spk.local.WorldCommandLifecycleFenceTest',
            'spk.local.WorldPulseCommandExecutionTest',
            'spk.local.SharedWorldSocketIntegrationTest'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
