      - .github/workflows/r103-offline-owned-plugin-task-retirement.yml

jobs:
  linux-projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R103 owned plugin task admission and real World retirement
        working-directory: server
        run: |
          java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' spk.local.R103OfflineOwnedPluginTaskRetirementTest

  windows-projections:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R103 owned plugin task admission and real World retirement
        shell: pwsh
        working-directory: server
        run: |
          $cp='build/SpawnPKLocalServer.jar;build/classes/java/test'
          & java -cp $cp spk.local.R103OfflineOwnedPluginTaskRetirementTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
