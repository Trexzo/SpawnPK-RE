name: temp-issue194-blood-fountain-perk-selection-ci

on:
  push:
    branches:
      - refactor/issue-194-blood-fountain-perk-selection

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Blood Fountain catalog and selection regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.BloodFountainSelectablePerkCatalogTest',
            'spk.local.BloodFountainPerkSelectionServiceTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

      - name: Inherited application regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.ApplicationUiServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
