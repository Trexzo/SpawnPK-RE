name: R77 Offline Domain Publication and Event Source Audit

on:
  push:
    branches:
      - playability/r77-offline-domain-event-owned-admission-20261115
  pull_request:
    paths:
      - server/src/spk/event/DomainEventBus.java
      - server/src/spk/local/R77OfflineOwnedDomainPublicationFence.java
      - server/src/spk/local/R77OfflineDomainPublicationQuiescenceTest.java
      - server/src/spk/local/R77OfflineEventProducerSourceAuditTest.java
      - .github/workflows/r77-offline-domain-owner-publications.yml

jobs:
  linux-domain-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile server and verify Java 11 bytecode
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: R77 real domain listener and inherited safety checks
        working-directory: server
        run: |
          for test in spk.local.R77OfflineDomainPublicationQuiescenceTest spk.local.R77OfflineEventProducerSourceAuditTest spk.event.DomainEventBusTest spk.event.DomainEventPublicApiBoundaryTest spk.local.DomainEventBusWorldContextTest spk.local.R76OfflineWorldTickOwnedEventTest spk.local.R75OfflineRealtimePetIngressTest spk.local.R75OfflineDecodedPacketQuiescenceTest spk.local.R74OfflineIngressAndShutdownTest spk.local.R73OfflineFinalLogoutDrainTest spk.local.R72OfflineTerminalAndDurableOrderTest spk.local.R71OfflineSnapshotCaptureOrderTest spk.local.R70OfflineCoordinatedIoCommitTest spk.local.R69OfflinePersistenceWriteFenceTest spk.local.R68RealDispatcherAdmissionTest spk.local.R67OfflineDecodedPacketDispatchTest spk.local.R66OfflineGameEventDispatchTest spk.local.R65DeferredSessionSaveDispatchTest spk.local.R64OfflineSessionOwnershipTest spk.local.R63AccountSaveAdmissionTest spk.local.SharedWorldOwnershipTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-domain-publication:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile server and verify Java 11 bytecode
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R77 real domain listener and inherited safety checks
        shell: pwsh
        working-directory: server
        run: |
          $cp='build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R77OfflineDomainPublicationQuiescenceTest',
            'spk.local.R77OfflineEventProducerSourceAuditTest',
            'spk.event.DomainEventBusTest',
            'spk.event.DomainEventPublicApiBoundaryTest',
            'spk.local.DomainEventBusWorldContextTest',
            'spk.local.R76OfflineWorldTickOwnedEventTest',
            'spk.local.R75OfflineRealtimePetIngressTest',
            'spk.local.R75OfflineDecodedPacketQuiescenceTest',
            'spk.local.R74OfflineIngressAndShutdownTest',
            'spk.local.R73OfflineFinalLogoutDrainTest',
            'spk.local.R72OfflineTerminalAndDurableOrderTest',
            'spk.local.R71OfflineSnapshotCaptureOrderTest',
            'spk.local.R70OfflineCoordinatedIoCommitTest',
            'spk.local.R69OfflinePersistenceWriteFenceTest',
            'spk.local.R68RealDispatcherAdmissionTest',
            'spk.local.R67OfflineDecodedPacketDispatchTest',
            'spk.local.R66OfflineGameEventDispatchTest',
            'spk.local.R65DeferredSessionSaveDispatchTest',
            'spk.local.R64OfflineSessionOwnershipTest',
            'spk.local.R63AccountSaveAdmissionTest',
            'spk.local.SharedWorldOwnershipTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
