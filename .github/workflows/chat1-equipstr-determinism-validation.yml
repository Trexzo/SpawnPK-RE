name: Chat1 Equipstr Determinism Validation

on:
  push:
    branches:
      - integration/equipstr-determinism-chat1

jobs:
  windows-equipstr-determinism:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle-backed canonical build
        shell: pwsh
        run: ./server/build.ps1
      - name: Stress equipstr regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          for ($round = 1; $round -le 15; $round++) {
            Write-Host "[EQUIPSTR] round=$round"
            & java -cp $cp spk.local.EngineR81EquipstrFailClosedSocketTest
            if ($LASTEXITCODE -ne 0) {
              throw "Equipstr determinism regression failed: round=$round exit=$LASTEXITCODE"
            }
          }
          & java -cp $cp spk.local.EngineR5ItemLibrarySocketTest
          if ($LASTEXITCODE -ne 0) {
            throw "Parent item-library regression failed: exit=$LASTEXITCODE"
          }
          Write-Host "CHAT1_EQUIPSTR_DETERMINISM_PASS stress=15 parent=1"
