name: Temporary Issue 15 repository foundation validation

on:
  push:
    branches:
      - refactor/issue-15-player-snapshot-repository-foundation

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run repository foundation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerRepositoryFoundationTest
      - name: Run legacy account persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.AccountPersistenceTest
      - name: Run dual profile persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.LocalAccountProfilesTest
      - name: Run pet persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PetPersistenceTest
      - name: Run position persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PositionPersistenceR213Test
      - name: Run player state persistence regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.V58StatePersistenceTest
