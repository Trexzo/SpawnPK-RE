name: Temporary Issue 12 world NPC registry validation

on:
  push:
    branches:
      - refactor/issue-12-world-npc-registry-foundation

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run canonical world NPC regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldNpcRegistryTest
      - name: Run shared world ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.SharedWorldOwnershipTest
      - name: Run shared NPC relay regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR31SharedNpcRelayTest
