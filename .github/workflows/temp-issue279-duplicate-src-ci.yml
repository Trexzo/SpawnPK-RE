name: TEMP Issue 279 Duplicate Src Preload Guard CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/LocalAccountProfiles.java'
      - 'server/src/spk/local/DuplicateSrcProfilePreloadGuardTest.java'
      - '.github/workflows/temp-issue279-duplicate-src-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress duplicate-src preload guard
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 10; $i++) {
            & java -cp $cp spk.local.DuplicateSrcProfilePreloadGuardTest
            if ($LASTEXITCODE -ne 0) {
              throw "DuplicateSrcProfilePreloadGuardTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE279_DUPLICATE_SRC_PRELOAD_STRESS_PASS iterations=10"

      - name: Run profile and lifecycle guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'SecondaryAccountSelectionTest',
            'LocalSessionPlayerInitializerTest',
            'DualProfileSocketIntegrationTest',
            'PlayerRegistryIdentityValidationTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE279_PROFILE_LIFECYCLE_GUARDS_PASS tests=$($tests.Count)"
