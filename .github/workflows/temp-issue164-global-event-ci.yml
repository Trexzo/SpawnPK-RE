name: Temp Issue 164 Global Event CI

on:
  pull_request:

jobs:
  issue164:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 164 focused regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.GlobalEventLifecycleFoundationTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Global event protocol-boundary guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/WorldEventId.java",
            "server/src/spk/local/WorldEventDefinition.java",
            "server/src/spk/local/GlobalEventService.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ServerPacketWriter|ClientPacket|S2C126|S2C250|WorldEventQueue\.Handle" -CaseSensitive:$false
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "Issue 164 domain source contains protocol or scheduler identity."
          }
          Write-Host "ISSUE164_PROTOCOL_BOUNDARY_PASS"
