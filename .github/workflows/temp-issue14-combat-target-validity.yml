name: Temporary Issue 14 combat target validity validation

on:
  push:
    branches:
      - refactor/issue-14-combat-target-validity

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run combat target validity regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatTargetValidityTest
      - name: Run combat damage rule separation regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatDamageRulesSeparationTest
      - name: Run player lifecycle regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerLifecycleServiceTest
      - name: Run player status regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.PlayerStatusServiceTest
      - name: Run combat ownership regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.WorldPlayerCombatStateOwnershipTest
      - name: Run combat server-owned approach regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CombatServerOwnedApproachTest
