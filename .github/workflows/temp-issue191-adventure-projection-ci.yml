name: temp-issue191-adventure-projection-ci

on:
  push:
    branches:
      - refactor/issue-191-adventure-row-projection

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Adventure projection mapper
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.AdventureBookProjectionMapperTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited objective and application regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ObjectiveProgressFoundationTest',
            'spk.local.ApplicationUiServiceTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
