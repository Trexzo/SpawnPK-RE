name: Chat1 PR200 Combat Test Fix

on:
  push:
    branches:
      - integration/roadmap-11-16-cumulative-chat1

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Legacy CombatEngine M1 regression
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.CombatEngineM1Test
