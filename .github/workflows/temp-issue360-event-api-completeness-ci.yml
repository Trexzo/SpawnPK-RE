name: TEMP Issue360 Event API Completeness CI

on:
  pull_request:
    branches:
      - test/issue-353-public-slot-boundary-chat3
    paths:
      - 'server/src/spk/event/DomainEventPublicApiBoundaryTest.java'
      - '.github/workflows/temp-issue360-event-api-completeness-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and verify Java 11 bytecode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\server\gradlew.bat --no-daemon clean jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { throw 'Gradle compile/bytecode verification failed' }

      - name: Run directory-backed event API boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/classes/java/main;server/build/classes/java/test;server/build/resources/main'
          & java -cp $cp spk.event.DomainEventPublicApiBoundaryTest
          if ($LASTEXITCODE -ne 0) { throw 'directory-backed DomainEventPublicApiBoundaryTest failed' }

      - name: Run JAR-backed event API boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cp = 'server/build/SpawnPKLocalServer.jar;server/build/classes/java/test'
          & java -cp $cp spk.event.DomainEventPublicApiBoundaryTest
          if ($LASTEXITCODE -ne 0) { throw 'JAR-backed DomainEventPublicApiBoundaryTest failed' }

          & java -cp $cp spk.event.DomainEventBusTest
          if ($LASTEXITCODE -ne 0) { throw 'DomainEventBusTest failed' }

          Write-Host 'CHAT3_ISSUE360_EVENT_API_COMPLETENESS_PASS directory=true jar=true eventBus=true'
