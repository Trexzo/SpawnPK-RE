name: Issue 118 temporary validation

on:
  push:
    branches:
      - refactor/issue-118-content-protocol-boundary
  pull_request:
    branches:
      - refactor/issue-113-content-npc-scene-boundary

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical build
        shell: pwsh
        run: ./server/build.ps1
      - name: Focused content API regressions
        shell: pwsh
        run: |
          $jar = 'server/build/SpawnPKLocalServer.jar'
          $tests = @(
            'spk.local.ContentPublicApiBoundaryTest',
            'spk.local.ContentNpcOptionPublicBoundaryTest',
            'spk.local.NurseContentRegistryParityTest',
            'spk.local.ContentRegistryTest',
            'spk.local.ObjectOptionContentRegistryParityTest',
            'spk.local.NpcOptionContentRegistryParityTest'
          )
          foreach ($test in $tests) {
            & java -cp $jar $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Semantic API source guard
        shell: pwsh
        run: |
          $api = Get-ChildItem 'server/src/spk/content/api' -File -Filter '*.java' | Get-Content -Raw
          if ($api -match 'protocolIndex\s*\(') { throw 'public content API still exposes protocolIndex' }
          if ($api -match 'percentageText\s*\(') { throw 'public content API still exposes percentageText' }
          if ($api -match 'widgetId') { throw 'public content API still names raw widget identity' }
          $builtin = Get-Content 'server/src/spk/content/builtin/LocalLabCoreContentModule.java' -Raw
          if ($builtin -match '\b149\b') { throw 'built-in content still knows special-energy widget 149' }
          Write-Host 'ISSUE118_SEMANTIC_API_GUARD_PASS'
