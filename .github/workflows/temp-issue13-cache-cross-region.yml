name: Temporary Issue 13 cache cross-region acceptance

on:
  push:
    branches:
      - test/issue-13-cache-cross-region-acceptance

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current source tree
        shell: pwsh
        run: ./server/build.ps1
      - name: Run cache cross-region routing acceptance regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.CacheCrossRegionRoutingAcceptanceTest
      - name: Run world collision authority regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.EngineR6WorldCollisionAuthorityTest
      - name: Run RouteFinder compatibility regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.RouteFinderCompatibilityTest
      - name: Run authoritative HOME movement regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.HomeAuthoritativeMovementCollisionTest
      - name: Run follower collision regression
        shell: pwsh
        run: java -cp server/build/classes spk.local.FollowerCollisionRoutingTest
