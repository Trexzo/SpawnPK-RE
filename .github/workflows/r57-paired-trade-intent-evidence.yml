name: R57 Paired Trade Intent Offline Evidence

on:
  push:
    branches:
      - playability/r57-paired-trade-intent-evidence-20261114
  pull_request:
    paths:
      - server/src/spk/local/R57TradePairJournal.java
      - server/src/spk/local/R57TradePairJournalReviewTest.java
      - .github/workflows/r57-paired-trade-intent-evidence.yml

jobs:
  linux-offline-intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 compatible classfiles
        working-directory: server
        run: bash ./gradlew --no-daemon jar testClasses verifyJava11Bytecode
      - name: Review four crash states and inherited no-recovery boundary
        working-directory: server
        run: |
          for test in spk.local.R57TradePairJournalReviewTest spk.local.R56TradeSplitSaveRestartEvidenceTest spk.local.R55TradePublicationRollbackTest spk.local.EngineR4TradeFlowTest; do
            java -cp 'build/SpawnPKLocalServer.jar:build/classes/java/test' "$test"
          done

  windows-offline-intent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify Java 11 compatible classfiles
        shell: pwsh
        working-directory: server
        run: |
          .\gradlew.bat --no-daemon jar testClasses verifyJava11Bytecode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Review four crash states and inherited no-recovery boundary
        shell: pwsh
        working-directory: server
        run: |
          $cp = 'build\SpawnPKLocalServer.jar;build\classes\java\test'
          foreach ($test in @(
            'spk.local.R57TradePairJournalReviewTest',
            'spk.local.R56TradeSplitSaveRestartEvidenceTest',
            'spk.local.R55TradePublicationRollbackTest',
            'spk.local.EngineR4TradeFlowTest'
          )) {
            & java -cp $cp $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
