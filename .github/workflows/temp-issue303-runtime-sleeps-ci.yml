name: TEMP Issue 303 Runtime Sleep Removal CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/spk/local/BankRuntimeIntegrationTest.java'
      - 'server/src/spk/local/CompCapeCustomizationTest.java'
      - '.github/workflows/temp-issue303-runtime-sleeps-ci.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile test classes
        shell: pwsh
        run: ./server/gradlew.bat --no-daemon testClasses

      - name: Stress changed runtime regressions
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          for ($i = 1; $i -le 10; $i++) {
            & java -cp $cp spk.local.BankRuntimeIntegrationTest
            if ($LASTEXITCODE -ne 0) {
              throw "BankRuntimeIntegrationTest failed iteration=$i exit=$LASTEXITCODE"
            }

            & java -cp $cp spk.local.CompCapeCustomizationTest
            if ($LASTEXITCODE -ne 0) {
              throw "CompCapeCustomizationTest failed iteration=$i exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE303_RUNTIME_SLEEP_STRESS_PASS bank=10 compCape=10"

      - name: Run nearby regression guards
        shell: pwsh
        run: |
          $cp = 'server/build/classes/java/test;server/build/classes/java/main;server/build/resources/test;server/build/resources/main'

          $tests = @(
            'BankV4AdvancedRuntimeIntegrationTest',
            'BankV4StateTest',
            'LocalCompCapeCustomizeHandlerTest',
            'LocalCompColorsCommandHandlerTest',
            'CompCapeCustomizationTest'
          )

          foreach ($test in $tests) {
            & java -cp $cp "spk.local.$test"
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed exit=$LASTEXITCODE"
            }
          }

          Write-Host "ISSUE303_NEARBY_GUARDS_PASS tests=$($tests.Count)"
