name: Temp Issue 165 Post200 CI
on:
  pull_request:
jobs:
  issue165:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1
      - name: Issue 165 focused regression
        shell: pwsh
        run: |
          java -cp server/build/classes spk.local.MarketplaceServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Marketplace protocol boundary guard
        shell: pwsh
        run: |
          $paths = @(
            "server/src/spk/local/MarketplaceListing.java",
            "server/src/spk/local/MarketplaceService.java"
          )
          $bad = Select-String -Path $paths -Pattern "widgetId|opcode|subtype|ClientPacket|ServerPacket|spriteId|sceneIndex" -CaseSensitive:$false
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; throw "Issue 165 protocol boundary violation." }
          Write-Host "ISSUE165_PROTOCOL_BOUNDARY_PASS"
# synchronize post-200 validation
