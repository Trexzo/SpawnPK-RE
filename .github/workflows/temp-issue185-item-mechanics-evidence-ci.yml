name: temp-issue185-item-mechanics-evidence-ci

on:
  push:
    branches:
      - refactor/issue-185-item-mechanics-evidence-query

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical server build
        shell: pwsh
        run: ./server/build.ps1

      - name: Item mechanics evidence query
        shell: pwsh
        run: |
          java -cp server/build/SpawnPKLocalServer.jar spk.local.ItemMechanicsEvidenceQueryServiceTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inherited item query regressions
        shell: pwsh
        run: |
          $tests = @(
            'spk.local.ItemCatalogQueryServiceTest',
            'spk.local.ItemCatalogTest'
          )

          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            java -cp server/build/SpawnPKLocalServer.jar $test
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }
