      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54e7ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
